<text x="40" y="496.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: CI = continuous integration (the automated checks GitHub runs on every change) · DoD = US Department of Defense · G0–G7 = lifecycle gate (G0 concept to G7 change and sustainment) ·</text>
<text x="40" y="511.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · OMG = Object Management Group, publisher of SysML · PX4 = PX4 Autopilot, the open-source</text>
<text x="40" y="525.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">flight-control software candidate for SUS-A1 · SF-nnn = walker failure-search family (sim/search) · SITL = software-in-the-loop simulation · SUS-A1 = dockable observation UAV · SysML =</text>
<text x="40" y="540.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Systems Modeling Language (SysML v2) · UAV = uncrewed aerial vehicle (drone) · US = United States</text>
</g>
