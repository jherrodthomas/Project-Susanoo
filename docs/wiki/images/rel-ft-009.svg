<text x="20" y="554" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="576">
<rect x="0" y="576" width="1640" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="580" x2="1600" y2="580" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="595.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · PX4 =</text>
<text x="40" y="610.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">PX4 Autopilot, the open-source flight-control software candidate for SUS-A1 · SSF-nnn = safety-significant software function record (safety/software/) · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial vehicle (drone)</text>
</g>
</svg>
