<text x="320.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">contactors already failed</text>
<text x="320.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-022-FM1 · p 4.0e-6</text>
<circle cx="320.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
<rect x="128.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
