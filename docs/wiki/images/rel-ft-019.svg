<text x="20" y="554" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="576">
<rect x="0" y="576" width="840" height="83.6" fill="#FFFFFF"/>
<line x1="40" y1="580" x2="800" y2="580" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="595.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: B-EHA = TS-001 alternative B with electrohydraulic joint actuators (series-hybrid power) · B-EMA = TS-001 alternative B with</text>
<text x="40" y="610.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">electromechanical joint actuators (series-hybrid power) · FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file</text>
<text x="40" y="624.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">per hazard) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part with its failure modes in the reliability pilot</text>
<text x="40" y="639.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(reliability/parts.yaml; PT-nnn-FMn is a failure mode) · TS-nnn = architecture trade study</text>
</g>
</svg>
