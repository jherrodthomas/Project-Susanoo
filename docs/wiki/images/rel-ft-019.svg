<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-019 · HAZ-PWR-002 · alternative B-EHA, B-EMA</text>
<text x="20" y="46" font-size="12" fill="#566275">Battery thermal runaway near the pilot station. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
