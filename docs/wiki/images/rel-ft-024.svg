<text x="20" y="824" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="846">
<rect x="0" y="846" width="1040" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="850" x2="1000" y2="850" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="865.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part</text>
<text x="40" y="880.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · SSF-nnn = safety-significant software function record</text>
<text x="40" y="894.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/software/)</text>
</g>
</svg>
