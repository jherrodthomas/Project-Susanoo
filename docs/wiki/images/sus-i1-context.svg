<title>SUS-I1 system context</title>
<desc>SUS-I1 system context. Inside the boundary: SUS-A1 Dockable observation UAV, SUS-GSE Ground support, maintenance supports, charging and test equipment, SUS-I1-INT Integration manager and PX4 command adapter, SUS-M1 Piloted walker. Outside: EXT-AIRSPACE Airspace, people and property under the UAV, EXT-BYSTANDER Bystanders, EXT-CREW Ground crew and maintainers, EXT-GNSS-RF GNSS and RF environment, EXT-OBSERVER Safety observer, EXT-PILOT Pilot, EXT-TERRAIN Terrain and obstacles, EXT-WEATHER Weather. Connectors: EXT-AIRSPACE–SUS-A1: IF-007; EXT-BYSTANDER–SUS-M1: IF-012; EXT-CREW–SUS-M1: IF-008; EXT-GNSS-RF–SUS-A1: IF-013; EXT-OBSERVER–SUS-M1: IF-011; EXT-PILOT–SUS-M1: IF-001, IF-015; EXT-TERRAIN–SUS-M1: IF-010; EXT-WEATHER–SUS-A1: IF-014; SUS-A1–SUS-I1-INT: IF-PX4-001, IF-PX4-002, IF-PX4-005, IF-PX4-006, IF-PX4-008; SUS-A1–SUS-M1: IF-006, IF-PX4-007, IF-PX4-009; SUS-GSE–SUS-M1: IF-019; SUS-I1-INT–SUS-M1: IF-PX4-003, IF-PX4-004, IF-020.</desc>
