<text x="720.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Walker leaning; wet or icy</text>
<text x="720.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">surfaces</text>
<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
