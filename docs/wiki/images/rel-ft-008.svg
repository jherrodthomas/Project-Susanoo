<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450.6" width="820" height="450.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="396" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-008 · HAZ-GSE-001</text>
<text x="20" y="46" font-size="12" fill="#566275">Fall from height during maintenance. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
<path d="M320.0 154 V170 H120.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 154 V170 H320.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 154 V170 H520.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<rect x="28.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="120.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Loss of balance while reaching</text>
<text x="120.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">or carrying</text>
<text x="120.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M120.0 274 L134.0 288 L120.0 302 L106.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="320.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">No platform or anchor; stand</text>
<text x="320.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">not secured</text>
<text x="320.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">systematic · not quantified</text>
<path d="M320.0 274 L334.0 288 L320.0 302 L306.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="428.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="520.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Wet, oily or icy surfaces,</text>
<text x="520.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">wind, poor light</text>
<text x="520.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M520.0 274 L534.0 288 L520.0 302 L506.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
