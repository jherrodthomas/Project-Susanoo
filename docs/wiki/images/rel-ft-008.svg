<text x="320.0" y="86" font-size="11.5" fill="#152033" text-anchor="middle">Maintainer falls from the</text>
<text x="320.0" y="100" font-size="11.5" fill="#152033" text-anchor="middle">walker</text>
<text x="320.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">or · not quantified</text>
<path d="M306.0 152 Q306.0 130 320.0 122 Q334.0 130 334.0 152 Q320.0 144 306.0 152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="374" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="396">
<rect x="0" y="396" width="820" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="400" x2="780" y2="400" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="415.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record</text>
<text x="40" y="430.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/hazards/HAZ-xxx-nnn.yaml)</text>
</g>
</svg>
