<text x="20" y="674" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="696">
<rect x="0" y="696" width="1440" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="700" x2="1400" y2="700" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="715.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: B-EMA = TS-001 alternative B with electromechanical joint actuators (series-hybrid power) · DC = direct current · FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record</text>
<text x="40" y="730.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · TS-nnn = architecture trade study</text>
</g>
</svg>
