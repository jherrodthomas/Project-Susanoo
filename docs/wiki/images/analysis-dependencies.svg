<g class="terms" data-base-h="480">
<rect x="0" y="480" width="1120" height="98.1" fill="#FFFFFF"/>
<line x1="40" y1="484" x2="1080" y2="484" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="499.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: ARP4754B = SAE guidelines for development of civil aircraft and systems · ARP4761A = SAE guidelines for the safety assessment process on civil aircraft · CONOPS = concept of</text>
<text x="40" y="514.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">operations · DoD = US Department of Defense · EHA = environmental hazard analysis (MIL-STD-882E Task 210) · FHA = functional hazard analysis (MIL-STD-882E Task 208; also ARP4761A aircraft</text>
<text x="40" y="528.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">FHA) · HHA = health hazard analysis (MIL-STD-882E Task 207) · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · PHA = preliminary hazard analysis</text>
<text x="40" y="543.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(MIL-STD-882E Task 202) · PHL = preliminary hazard list (MIL-STD-882E Task 201) · SAE = SAE International, publisher of ARP4754B and ARP4761A · SHA = system hazard analysis (MIL-STD-882E</text>
<text x="40" y="557.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Task 205) · SRHA = system requirements hazard analysis (MIL-STD-882E Task 203) · SSHA = subsystem hazard analysis (MIL-STD-882E Task 204) · US = United States</text>
</g>
</svg>