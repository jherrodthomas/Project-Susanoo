<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 615.1" width="840" height="615.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="840" height="546" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-017 · HAZ-PIL-006</text>
<text x="20" y="46" font-size="12" fill="#566275">Delayed or unsafe extraction of an incapacitated pilot. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
<path d="M320.0 154 V170 H120.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 154 V170 H520.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M520.0 304 V320 H320.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M520.0 304 V320 H520.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M520.0 304 V320 H720.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<rect x="28.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="120.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Pilot incapacitated</text>
<text x="120.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M120.0 274 L134.0 288 L120.0 302 L106.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="320.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">External hatch or restraint</text>
<text x="320.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">release jams</text>
<text x="320.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-027-FM1 · p 1.0e-3</text>
<circle cx="320.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
<rect x="428.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="520.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Crew untrained; rescuers</text>
<text x="520.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">without fall protection</text>
<text x="520.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M520.0 424 L534.0 438 L520.0 452 L506.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="628.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="720.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Fire, smoke, stored energy or</text>
<text x="720.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">a walker on its side</text>
<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M720.0 424 L734.0 438 L720.0 452 L706.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="428.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="520.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Extraction does not go to plan</text>
<text x="520.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">or · p 1.0e-3</text>
<path d="M506.0 302 Q506.0 280 520.0 272 Q534.0 280 534.0 302 Q520.0 294 506.0 302 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="228.0" y="70" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="320.0" y="86" font-size="11.5" fill="#152033" text-anchor="middle">Extraction delayed or unsafe</text>
<text x="320.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">and · not quantified</text>
<path d="M307.0 152 V134 A13 13 0 0 1 333.0 134 V152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="524" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="546">
<rect x="0" y="546" width="840" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="550" x2="800" y2="550" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="565.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record</text>
<text x="40" y="580.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a</text>
<text x="40" y="594.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">failure mode)</text>
</g>
</svg>
