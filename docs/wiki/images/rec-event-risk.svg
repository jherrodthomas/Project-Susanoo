<text x="40" y="349" font-size="10.5" fill="#94A3B8">Generated by tools/previews/record_figures.py from safety/events/EVT-*.yaml and safety/hazards/HAZ-*.yaml. Drafted at independence level I0; nothing shown here is reviewed, verified or accepted.</text>
<g class="terms" data-base-h="376">
<rect x="0" y="376" width="1080" height="98.1" fill="#FFFFFF"/>
<line x1="40" y1="380" x2="1040" y2="380" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="395.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: 1A–4F = risk assessment code, severity 1–4 plus probability A–F (e.g. 1C) · AI = artificial intelligence (here, an AI assistant drafting at independence level I0) · EVT-nnn =</text>
<text x="40" y="410.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">test or demonstration event record (safety/events/) · F-nnn = system function in the item definition · G0–G7 = lifecycle gate (G0 concept to G7 change and sustainment) · HAZ-nnn =</text>
<text x="40" y="424.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · I0–I3 = review independence level (I0 none, e.g. the author or an AI, to I3 independent organisation) · PX4 = PX4 Autopilot, the</text>
<text x="40" y="439.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">open-source flight-control software candidate for SUS-A1 · R01 … = validator rule in tools/pdac (R13 = only a named human review accepts anything) · SITL = software-in-the-loop</text>
<text x="40" y="453.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">simulation · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial vehicle (drone)</text>
</g>
</svg>
