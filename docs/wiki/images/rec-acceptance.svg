<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 1 · How risk is accepted</text>
<text x="40" y="66" font-size="12.5" fill="#475569">Only a review record with a named human in the role the risk level requires accepts a hazard's risk (rule R13); passing CI or an AI review</text>
<text x="40" y="83" font-size="12.5" fill="#475569">never does. Roles are simulated, and a role with no named holder cannot sign.</text>
<text x="1040" y="44" font-size="11" fill="#475569" text-anchor="end">standards/tailoring · reviews/</text>
