<g class="terms" data-base-h="570">
<rect x="0" y="570" width="1080" height="83.6" fill="#FFFFFF"/>
<line x1="40" y1="574" x2="1040" y2="574" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="589.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: AI = artificial intelligence (here, an AI assistant drafting at independence level I0) · CI = continuous integration (the automated checks GitHub runs on every change) · DoD =</text>
<text x="40" y="604.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">US Department of Defense · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · I0–I3 = review independence level (I0 none, e.g. the author or an AI, to I3 independent</text>
<text x="40" y="618.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">organisation) · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · R01 … = validator rule in tools/pdac (R13 = only a named human review accepts</text>
<text x="40" y="633.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">anything) · REV-nnn = review record (reviews/) · ROLE-nnn = project role in the tailoring record (simulated until the lead says otherwise) · US = United States</text>
</g>
</svg>
