<text x="320.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">software · SSF-002 · not quantified</text>
<path d="M320.0 424 L334.0 438 L320.0 452 L306.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
