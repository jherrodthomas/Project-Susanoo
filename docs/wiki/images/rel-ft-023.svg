<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 615.1" width="1040" height="615.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1040" height="546" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-023 · HAZ-WLK-002</text>
<text x="20" y="46" font-size="12" fill="#566275">Walker tip-over or fall with the pilot aboard. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
<path d="M445.0 154 V170 H120.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M445.0 154 V170 H320.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M445.0 154 V170 H520.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M445.0 154 V170 H820.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M820.0 304 V320 H720.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M820.0 304 V320 H920.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<rect x="28.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="120.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Balance controller fails to</text>
<text x="120.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">recover</text>
<text x="120.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">software · SSF-007 · not quantified</text>
<path d="M120.0 274 L134.0 288 L120.0 302 L106.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="320.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Terrain gives way or slope</text>
<text x="320.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">beyond the envelope</text>
<text x="320.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M320.0 274 L334.0 288 L320.0 302 L306.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="428.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="520.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Pilot commands beyond the</text>
<text x="520.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">limits</text>
<text x="520.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M520.0 274 L534.0 288 L520.0 302 L506.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="628.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="720.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Leg actuator supply lost</text>
<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-028-FM1 · p 5.0e-3</text>
<circle cx="720.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
<rect x="828.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="920.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Torque left too small before</text>
<text x="920.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">holding engages (sizing)</text>
<text x="920.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">systematic · not quantified</text>
<path d="M920.0 424 L934.0 438 L920.0 452 L906.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="728.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="820.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Supply decays and the balance</text>
<text x="820.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">capacity is short</text>
<text x="820.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">and · not quantified</text>
<path d="M807.0 302 V284 A13 13 0 0 1 833.0 284 V302 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="353.0" y="70" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="445.0" y="86" font-size="11.5" fill="#152033" text-anchor="middle">Walker tips or falls</text>
<text x="445.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">or · not quantified</text>
<path d="M431.0 152 Q431.0 130 445.0 122 Q459.0 130 459.0 152 Q445.0 144 431.0 152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="524" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="546">
<rect x="0" y="546" width="1040" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="550" x2="1000" y2="550" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="565.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part</text>
<text x="40" y="580.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · SSF-nnn = safety-significant software function record</text>
<text x="40" y="594.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/software/)</text>
</g>
</svg>
