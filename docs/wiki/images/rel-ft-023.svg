<text x="520.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">limits</text>
<text x="520.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M520.0 274 L534.0 288 L520.0 302 L506.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="628.0" y="370" width="184" height="50" rx="3" fill="#eaf2fb" stroke="#152033" stroke-width="1.2"/>
