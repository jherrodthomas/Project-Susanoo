<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 645.1" width="1040" height="645.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1040" height="576" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-023 · HAZ-WLK-002</text>
<text x="20" y="46" font-size="12" fill="#566275">Walker tip-over or fall with the pilot aboard. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
