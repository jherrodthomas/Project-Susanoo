<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-028-FM1 · p 5.0e-3</text>
<circle cx="720.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
