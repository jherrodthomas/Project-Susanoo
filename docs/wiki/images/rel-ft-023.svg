<path d="M431.0 152 Q431.0 130 445.0 122 Q459.0 130 459.0 152 Q445.0 144 431.0 152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="20" y="514" width="18" height="12" rx="2" fill="#fde7e2" stroke="#b42318"/><text x="46" y="524" font-size="11.5" fill="#566275">Top event</text>
<rect x="190" y="514" width="18" height="12" rx="2" fill="#eaf2fb" stroke="#152033"/><text x="216" y="524" font-size="11.5" fill="#566275">Failure mode</text>
<rect x="360" y="514" width="18" height="12" rx="2" fill="#fff4e3" stroke="#b54708" stroke-dasharray="4 3"/><text x="386" y="524" font-size="11.5" fill="#566275">Undeveloped cause</text>
<text x="20" y="554" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="576">
<rect x="0" y="576" width="1040" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="580" x2="1000" y2="580" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="595.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part</text>
<text x="40" y="610.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · SSF-nnn = safety-significant software function record</text>
<text x="40" y="624.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/software/)</text>
</g>
</svg>
