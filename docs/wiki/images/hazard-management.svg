<text x="158.5" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Assess initial risk</text>
<path d="M276 240 H307" stroke="#377a8d" stroke-width="2.5"/><path d="M300 235 l7 5 -7 5" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="295" y="65" width="257" height="330" rx="10" fill="#eef3f9" stroke="#cbd5e1"/>
<rect x="295" y="65" width="257" height="52" rx="10" fill="#204b70"/>
<text x="423.5" y="87" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">Systems &amp; design</text>
<rect x="307" y="142" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="423.5" y="174" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Select design mitigation</text>
<path d="M423.5 218 v34" stroke="#377a8d" stroke-width="2"/><path d="M418.5 246 l5 6 5 -6" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="307" y="252" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="423.5" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Implement control</text>
<path d="M541 240 H572" stroke="#377a8d" stroke-width="2.5"/><path d="M565 235 l7 5 -7 5" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="560" y="65" width="257" height="330" rx="10" fill="#e7eef7" stroke="#cbd5e1"/>
<rect x="560" y="65" width="257" height="52" rx="10" fill="#204b70"/>
<text x="688.5" y="87" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">Verification</text>
<rect x="572" y="142" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="688.5" y="174" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Verify implementation</text>
<path d="M688.5 218 v34" stroke="#377a8d" stroke-width="2"/><path d="M683.5 246 l5 6 5 -6" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="572" y="252" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="688.5" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Validate risk reduction</text>
<path d="M806 240 H837" stroke="#377a8d" stroke-width="2.5"/><path d="M830 235 l7 5 -7 5" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="825" y="65" width="257" height="330" rx="10" fill="#eef3f9" stroke="#cbd5e1"/>
<rect x="825" y="65" width="257" height="52" rx="10" fill="#204b70"/>
<text x="953.5" y="87" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">Risk authority</text>
<rect x="837" y="142" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="953.5" y="174" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Review residual risk</text>
<path d="M953.5 218 v34" stroke="#377a8d" stroke-width="2"/><path d="M948.5 246 l5 6 5 -6" fill="none" stroke="#377a8d" stroke-width="2"/>
<rect x="837" y="252" width="233" height="76" rx="9" fill="white" stroke="#87a3bd" stroke-width="1.6"/>
<text x="953.5" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Accept / reject / return</text>
<text x="30" y="438" font-family="Arial,sans-serif" font-size="15" fill="#3f566b">Residual risk acceptance is a separate authorized decision, never automatic closure.</text>
<text x="30" y="462" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Project Susanoo • MIL-STD-882E • Draft process guidance • Not verified evidence</text>
