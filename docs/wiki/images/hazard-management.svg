<text x="158.5" y="174" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17324d">Identify hazard</text>
<path d="M158.5 218 v34" stroke="#377a8d" stroke-width="2"/><path d="M153.5 246 l5 6 5 -6" fill="none" stroke="#377a8d" stroke-width="2"/>
