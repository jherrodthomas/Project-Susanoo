<text x="40" y="689.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: B-EHA = TS-001 alternative B with electrohydraulic joint actuators (series-hybrid power) · DC = direct current · FT-nnn = fault tree in the reliability pilot (reliability/fault-trees.yaml) · PT-nnn = part with its failure modes in the</text>
<text x="40" y="704.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode) · TS-nnn = architecture trade study</text>
