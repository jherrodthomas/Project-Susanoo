<text x="40" y="66" font-size="12.5" fill="#475569">For each producer, how many pages of each kind show its images (a page counted once per image). Wiki pages use images/ directly; repository pages reach the same files through</text>
<text x="40" y="83" font-size="12.5" fill="#475569">../wiki/images; copied wiki pages use assets/ and are not counted here.</text>
<text x="1240" y="44" font-size="11" fill="#475569" text-anchor="end">every *.md and *.html</text>
