<text x="320.0" y="100" font-size="11.5" fill="#152033" text-anchor="middle">aboard</text>
<text x="320.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">and · p 7.4e-6</text>
<path d="M307.0 152 V134 A13 13 0 0 1 333.0 134 V152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="524" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="546">
<rect x="0" y="546" width="840" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="550" x2="800" y2="550" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="565.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record</text>
<text x="40" y="580.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/hazards/HAZ-xxx-nnn.yaml) · PT-nnn = part with its failure modes in the reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a</text>
<text x="40" y="594.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">failure mode)</text>
</g>
</svg>
