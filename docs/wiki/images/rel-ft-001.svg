<text x="320.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-002-FM1 · p 1.2e-5</text>
<circle cx="320.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
