<text x="120.0" y="258" font-size="10.5" fill="#566275" text-anchor="middle">or · p 1.2e-2</text>
<path d="M106.0 296 Q106.0 274 120.0 266 Q134.0 274 134.0 296 Q120.0 288 106.0 296 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
