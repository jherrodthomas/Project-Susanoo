<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-001 · HAZ-PIL-002 · alternative A</text>
<text x="20" y="46" font-size="12" fill="#566275">Cockpit drop on loss of leg support, alternative A (centralised hydraulic). Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
