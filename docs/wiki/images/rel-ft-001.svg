<text x="120.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">suddenly</text>
<text x="120.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">or · p 1.2e-2</text>
<path d="M106.0 302 Q106.0 280 120.0 272 Q134.0 280 134.0 302 Q120.0 294 106.0 302 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
