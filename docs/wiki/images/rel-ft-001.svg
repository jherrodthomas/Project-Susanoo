<text x="520.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">demand</text>
<text x="520.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">PT-002-FM2 · p 6.0e-4</text>
<circle cx="520.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/>
<text x="540.0" y="443" font-size="12" font-weight="700" fill="#2a55a8">×6</text>
<rect x="628.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="720.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Every valve fails together</text>
<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">common cause · p 5.1e-6</text>
<circle cx="720.0" cy="438" r="13" fill="#ffffff" stroke="#152033" stroke-width="1.4"/><circle cx="720.0" cy="438" r="8" fill="none" stroke="#152033" stroke-width="1.2"/>
