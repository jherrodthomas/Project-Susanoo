<text x="320.0" y="108" font-size="10.5" fill="#566275" text-anchor="middle">and · p 7.4e-6</text>
<path d="M307.0 146 V128 A13 13 0 0 1 333.0 128 V146 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="498" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: basic event. Diamond: common-cause share. ×n: n identical copies, any one fails.</text>
<g class="terms" data-base-h="520">
<rect x="0" y="520" width="840" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="524" x2="800" y2="524" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="539.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/fault-trees.yaml) · PT-nnn = part with its failure modes in the</text>
<text x="40" y="554.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">reliability pilot (reliability/parts.yaml; PT-nnn-FMn is a failure mode)</text>
</g>
</svg>
