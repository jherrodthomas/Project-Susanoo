<text x="40" y="1248" font-size="10.5" fill="#94A3B8">Generated by tools/figures/wiki_readme.py from the pages in docs/wiki, its sidebar and assets list, and the publish workflow. Publishing a</text>
<text x="40" y="1263" font-size="10.5" fill="#94A3B8">page is not a review: nothing on the wiki is verified or accepted by being there (rule R13).</text>
