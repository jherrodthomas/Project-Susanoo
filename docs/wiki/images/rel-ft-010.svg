<path d="M320.0 304 V320 H320.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 304 V320 H520.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M820.0 304 V320 H720.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M820.0 304 V320 H920.0 V370" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<rect x="28.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="120.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Wrong georeferencing or</text>
<text x="120.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">pointing</text>
<text x="120.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">interface · not quantified</text>
<path d="M120.0 424 L134.0 438 L120.0 452 L106.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="320.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">GNSS degraded or spoofed</text>
<text x="320.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M320.0 424 L334.0 438 L320.0 452 L306.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="428.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="520.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Latency, dropped frames or</text>
<text x="520.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">frozen video</text>
<text x="520.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">interface · not quantified</text>
<path d="M520.0 424 L534.0 438 L520.0 452 L506.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="320.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">UAV picture wrong or stale</text>
<text x="320.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">or · not quantified</text>
<path d="M306.0 302 Q306.0 280 320.0 272 Q334.0 280 334.0 302 Q320.0 294 306.0 302 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="628.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="720.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Pilot does not notice</text>
<text x="720.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M720.0 424 L734.0 438 L720.0 452 L706.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="828.0" y="370" width="184" height="50" rx="3" fill="#ffffff" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="920.0" y="386" font-size="11.5" fill="#152033" text-anchor="middle">Pilot relies on the UAV over</text>
<text x="920.0" y="400" font-size="11.5" fill="#152033" text-anchor="middle">direct view</text>
<text x="920.0" y="414" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M920.0 424 L934.0 438 L920.0 452 L906.0 438 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="728.0" y="220" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="820.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Pilot does not catch it</text>
<text x="820.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">or · not quantified</text>
<path d="M806.0 302 Q806.0 280 820.0 272 Q834.0 280 834.0 302 Q820.0 294 806.0 302 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="478.0" y="70" width="184" height="50" rx="3" fill="#ffffff" stroke="#152033" stroke-width="1.2"/>
<text x="570.0" y="86" font-size="11.5" fill="#152033" text-anchor="middle">Pilot acts on a wrong picture</text>
<text x="570.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">and · not quantified</text>
<path d="M557.0 152 V134 A13 13 0 0 1 583.0 134 V152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<text x="20" y="524" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="546">
<rect x="0" y="546" width="1040" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="550" x2="1000" y2="550" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="565.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · GNSS = global navigation satellite system (GPS and similar) · GPS = Global</text>
<text x="40" y="580.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Positioning System · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · UAV = uncrewed aerial vehicle (drone)</text>
</g>
</svg>
