<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600.6" width="1040" height="600.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1040" height="546" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-010 · HAZ-INT-002</text>
<text x="20" y="46" font-size="12" fill="#566275">Pilot acts on misleading or stale UAV information. Probability over 200 UAV flight hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
<path d="M570.0 154 V170 H320.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M570.0 154 V170 H820.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
