<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480.6" width="820" height="480.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="426" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="700" fill="#152033">FT-016 · HAZ-PIL-005</text>
<text x="20" y="46" font-size="12" fill="#566275">Fall during normal ingress or egress. Probability over 500 walker operating hours; dormant failures checked every 4 h. Illustrative: inputs assumed.</text>
<path d="M320.0 154 V170 H120.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 154 V170 H320.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<path d="M320.0 154 V170 H520.0 V220" fill="none" stroke="#cfd7e2" stroke-width="1.5"/>
<rect x="28.0" y="220" width="184" height="50" rx="3" fill="#fff4e3" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="120.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Misstep, hurry or hands full</text>
<text x="120.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">human · not quantified</text>
<path d="M120.0 274 L134.0 288 L120.0 302 L106.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="220" width="184" height="50" rx="3" fill="#fff4e3" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="320.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Uneven rise, high sill step or</text>
<text x="320.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">missing handholds</text>
<text x="320.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">systematic · not quantified</text>
<path d="M320.0 274 L334.0 288 L320.0 302 L306.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="428.0" y="220" width="184" height="50" rx="3" fill="#fff4e3" stroke="#b54708" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="520.0" y="236" font-size="11.5" fill="#152033" text-anchor="middle">Wet, icy or muddy treads;</text>
<text x="520.0" y="250" font-size="11.5" fill="#152033" text-anchor="middle">darkness; uneven ground</text>
<text x="520.0" y="264" font-size="10.5" fill="#566275" text-anchor="middle">environment · not quantified</text>
<path d="M520.0 274 L534.0 288 L520.0 302 L506.0 288 Z" fill="#ffffff" stroke="#b54708" stroke-width="1.6"/>
<rect x="228.0" y="70" width="184" height="50" rx="3" fill="#fde7e2" stroke="#b42318" stroke-width="2"/>
<text x="320.0" y="86" font-size="11.5" fill="#152033" text-anchor="middle">Fall while climbing in or out</text>
<text x="320.0" y="114" font-size="10.5" fill="#566275" text-anchor="middle">or · not quantified</text>
<path d="M306.0 152 Q306.0 130 320.0 122 Q334.0 130 334.0 152 Q320.0 144 306.0 152 Z" fill="#ffffff" stroke="#2a55a8" stroke-width="1.6"/>
<rect x="20" y="364" width="18" height="12" rx="2" fill="#fde7e2" stroke="#b42318"/><text x="46" y="374" font-size="11.5" fill="#566275">Top event</text>
<rect x="190" y="364" width="18" height="12" rx="2" fill="#eaf2fb" stroke="#152033"/><text x="216" y="374" font-size="11.5" fill="#566275">Failure mode</text>
<rect x="360" y="364" width="18" height="12" rx="2" fill="#fff4e3" stroke="#b54708" stroke-dasharray="4 3"/><text x="386" y="374" font-size="11.5" fill="#566275">Undeveloped cause</text>
<text x="20" y="404" font-size="11.5" fill="#566275">Dome: all inputs (and). Shield: any input (or). Circle: failure mode. Double circle: common-cause share. Diamond: undeveloped cause, not quantified. ×n: n identical copies.</text>
<g class="terms" data-base-h="426">
<rect x="0" y="426" width="820" height="54.6" fill="#FFFFFF"/>
<line x1="40" y1="430" x2="780" y2="430" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="445.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FT-nnn = fault tree in the reliability pilot (reliability/HAZ-*.yaml, one file per hazard) · HAZ-nnn = hazard record</text>
<text x="40" y="460.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(safety/hazards/HAZ-xxx-nnn.yaml)</text>
</g>
</svg>
