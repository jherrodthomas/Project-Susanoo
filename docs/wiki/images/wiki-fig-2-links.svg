<text x="50" y="352" font-size="10" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">rec-acceptance.svg, rec-decision-board.svg, rec-event-risk.svg, rec-l1-l2.svg, rec-mitigations.svg, rec-record-model.svg, rec-ssf.svg, rec-task-tailoring.svg, rec-traceability.svg</text>
