<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 2 · Every link in the wiki, and whether it resolves</text>
<text x="40" y="66" font-size="12.5" fill="#475569">3078 links across the pages, by kind and by where the page comes from. A wiki link must name an existing page, an image must be in images/, a figure must be listed in assets.txt. 0</text>
<text x="40" y="83" font-size="12.5" fill="#475569">links do not resolve; 9 images in images/ are not linked from any page.</text>
<text x="1240" y="44" font-size="11" fill="#475569" text-anchor="end">docs/wiki · assets.txt</text>
