<text x="933.7" y="399" font-size="11" fill="#475569">Links to repository files (work in the repository only)</text>
<text x="40" y="421" font-size="10.5" fill="#94A3B8">Generated by tools/figures/wiki_readme.py from the pages in docs/wiki, its sidebar and assets list, and the publish workflow. Publishing a page is not a review: nothing on the wiki is verified or accepted by being there (rule R13).</text>
