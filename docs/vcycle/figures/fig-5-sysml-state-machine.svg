<text x="40" y="1730.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: AI = artificial intelligence (here, an AI assistant drafting at independence level I0) · I0–I3 = review independence</text>
<text x="40" y="1745.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">level (I0 none, e.g. the author or an AI, to I3 independent organisation) · R01 … = validator rule in tools/pdac (R13 = only</text>
