<text x="40" y="558.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: CR-nnn = change request record (changes/) · EVT-nnn = test or demonstration event record (safety/events/) · G0–G7 = lifecycle gate (G0 concept to G7 change and</text>
<text x="40" y="573.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">sustainment) · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · KB = kilobyte, a file size of 1,024 bytes · R01 … = validator rule in tools/pdac (R13 = only a</text>
<text x="40" y="587.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">named human review accepts anything) · SSF-nnn = safety-significant software function record (safety/software/) · SYS-nnn = system safety requirement record</text>
<text x="40" y="602.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(requirements/SYS-nnn.yaml) · TS-nnn = architecture trade study</text>
</g>
