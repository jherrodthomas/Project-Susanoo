# Folder previews: what every folder shows a reader before they open anything.
# Read by tools/previews/build_previews.py, which writes a README for each folder below that has none, and a
# preview block (<!-- preview:start --> ... <!-- preview:end -->) into a hand-written README.
#
# Every folder in the repository must be listed here, follow its own documentation standard (`own_standard`), or
# be exempt (`exempt`). CI fails on a folder that is none of these, so a new folder gets a preview from day one.
#
#   title    README title (only used when the README is generated)
#   purpose  one or two sentences under the title (generated README only)
#   hero     the main figure: {img, caption, link?}
#   gallery  thumbnails: [{img, caption, link?}]; link defaults to the image
#   links    further pages to open: [{text, href}]
#   planned  a figure that does not exist yet: say what it will show
#
# Paths are repository-relative. Captions use only terms defined in docs/terms.yaml.

schema: susanoo/previews/v0.1

own_standard:            # folders whose READMEs follow framework/documentation-standard.md
  - .
  - concept
  - integrations/px4
  - integrations           # generated README (tools/figures/integrations_readme.py)
  - framework              # generated README top (tools/figures/framework_readme.py)
  - tools                  # generated README (tools/figures/tools_readme.py)
  - safety/mil-std-882e
  - "safety/mil-std-882e/**"
  - cad                  # SUS-CAD-001: renders, drawings and layout tables (partly built by tools/cad/readme.py)
  - cad/concept-art
  - requirements           # generated READMEs with block, boundary, SysML and I/O figures (tools/figures/*_readme.py)
  - verification
  - changes
  - reviews
  - decisions
  - architecture
  - safety
  - sim
  - standards
  - models

exempt:                  # tests, tooling internals, figure stores shown by the README above them
  - "**/figures"
  - "**/figures/**"          # e.g. concept/figures/records (record-driven figures, tools/figures/concept_readme.py)
  - "**/tests"
  - "**/__pycache__"
  - "**/node_modules"
  - ".git"
  - ".github"
  - ".github/**"
  - ".claude"
  - ".claude/**"
  - "tools/**"

folders:
  architecture/trades:
    title: Architecture trade studies
    purpose: >-
      One record per trade study (TS-nnn): question, alternatives, weighted criteria, evidence and scores. The project
      lead confirms the weights and selects an alternative; the Trade Studies wiki page is built from here.
    planned: "Score matrix of each study: alternatives against weighted criteria, with the evidence behind each score."
    links:
      - {text: Trade Studies (wiki page), href: docs/wiki/Trade-Studies.md}
      - {text: Trade-study decision process, href: concept/trade-studies.md}

  cad/drawings:
    title: Concept layout drawing sheets
    purpose: >-
      One drawing sheet per concept layout (SUS-CAD-001-CL-nn), built from the FreeCAD models, plus all sheets in one
      PDF (`concept-layouts.pdf`). Concept layouts, not a design.
    hero: {img: cad/drawings/CL-05.svg, caption: "CL-05, the reference layout"}
    gallery_glob: cad/drawings/*.svg
    links:
      - {text: All sheets (PDF), href: cad/drawings/concept-layouts.pdf}
      - {text: Concept layouts review, href: cad/README.md}

  cad/params:
    title: Concept layout parameters
    purpose: >-
      The parameters of each concept layout (`CL-nn.yaml`) and those they share (`common.yaml`). The FreeCAD models,
      metrics, drawing sheets and renders are all built from these files.
    hero: {img: cad/renders/lineup.png, caption: "All concept layouts side by side"}
    gallery:
      - {img: cad/renders/CL-05-hero.png, caption: "CL-05"}
      - {img: cad/renders/CL-05-kneel-hero.png, caption: "CL-05 kneeling"}
      - {img: cad/drawings/CL-05.svg, caption: "CL-05 drawing sheet"}
    links:
      - {text: Concept layouts review, href: cad/README.md}

  cad/renders:
    title: Concept layout renders
    purpose: >-
      Review renders of every concept layout from five views (hero, iso, side, top, dock), rendered locally from the
      FreeCAD models (`tools/cad/make.sh`). Concept layouts, not a design.
    hero: {img: cad/renders/lineup.png, caption: "All concept layouts side by side"}
    gallery_glob: cad/renders/*-hero.png
    links:
      - {text: Blender renders, href: cad/renders/blender/README.md}
      - {text: Concept layouts review, href: cad/README.md}

  cad/renders/blender:
    title: Blender renders of CL-05
    purpose: >-
      Lit Blender renders and a walk cycle of the CL-05 reference layout, in plain and unarmed military livery.
      Rendered from the CAD; for communication, not engineering.
    hero: {img: cad/renders/blender/CL-05-hero.jpg, caption: "CL-05"}
    gallery_glob: cad/renders/blender/*.{jpg,gif}
    links:
      - {text: Walk cycle video, href: cad/renders/blender/CL-05-walk-military.mp4}

  docs:
    title: Documentation sources
    purpose: >-
      The abbreviations list, the front-page figures, the 3D scene pages, the editable process-map sources and the
      wiki source. Open a subfolder for its gallery.
    hero: {img: docs/readme/at-a-glance.svg, caption: "Project at a glance (front-page figure)"}
    gallery:
      - {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}
      - {img: docs/readme/simulation.svg, caption: "Simulation results summary (synthetic)"}
      - {img: docs/wiki/images/3d-s3-01.png, caption: "3D scene still", link: docs/3d/README.md}
    links:
      - {text: Abbreviations and codes, href: docs/terms.md}
      - {text: Front-page figures, href: docs/readme/README.md}
      - {text: 3D scene pages, href: docs/3d/README.md}
      - {text: Process-map sources, href: docs/diagrams/mil-std-882e/README.md}
      - {text: Wiki images, href: docs/wiki/images/README.md}

  docs/3d:
    title: 3D scene pages
    purpose: >-
      Interactive 3D replays of the simulation scenarios, built by `sim/scenes3d`. Open a page in a browser; each
      still below links to its page. Simulation results are synthetic and are not verification evidence.
    hero: {img: docs/wiki/images/3d-s3-01.png, caption: "S3-01", link: docs/3d/S3-01.html}
    gallery:
      - {img: docs/wiki/images/3d-s3-01-dusk.png, caption: "S3-01 at dusk", link: docs/3d/S3-01-dusk.html}
      - {img: docs/wiki/images/3d-s3-02.png, caption: "S3-02", link: docs/3d/S3-02.html}
      - {img: docs/wiki/images/3d-s3-03.png, caption: "S3-03", link: docs/3d/S3-03.html}
      - {img: docs/wiki/images/3d-s3-04.png, caption: "S3-04", link: docs/3d/S3-04.html}
      - {img: docs/wiki/images/3d-s3-05.png, caption: "S3-05", link: docs/3d/S3-05.html}
      - {img: docs/wiki/images/3d-s3-05-fog.png, caption: "S3-05 in fog", link: docs/3d/S3-05-fog.html}
      - {img: docs/wiki/images/3d-s3-06.png, caption: "S3-06", link: docs/3d/S3-06.html}
    links:
      - {text: Scene index page, href: docs/3d/index.html}
      - {text: 3D scenes (wiki page), href: docs/wiki/3D-Scenes.md}

  docs/diagrams:
    title: Diagram sources
    purpose: Editable sources for the hand-drawn process maps.
    hero: {img: docs/wiki/images/safety-lifecycle.svg, caption: "Safety lifecycle process map (illustrative)", link: docs/diagrams/mil-std-882e/README.md}

  docs/diagrams/mil-std-882e:
    title: MIL-STD-882E process-map sources
    purpose: >-
      Draw.io sources of the illustrative MIL-STD-882E process maps. Edit a `.drawio` file, export it to SVG in
      `docs/wiki/images/`, and the wiki page MIL-STD-882E Process Maps shows it. These maps are draft workflows,
      not normative flowcharts.
    hero: {img: docs/wiki/images/safety-lifecycle.svg, caption: "safety-lifecycle.drawio"}
    gallery:
      - {img: docs/wiki/images/hazard-management.svg, caption: "hazard-management.drawio"}
      - {img: docs/wiki/images/analysis-dependencies.svg, caption: "analysis-dependencies.drawio"}
      - {img: docs/wiki/images/responsibility-swimlanes.svg, caption: "responsibility-swimlanes.drawio"}
      - {img: docs/wiki/images/software-safety.svg, caption: "software-safety.drawio"}
      - {img: docs/wiki/images/verification-change.svg, caption: "verification-change.drawio"}
    links:
      - {text: MIL-STD-882E Process Maps (wiki page), href: docs/wiki/MIL-STD-882E-Process-Maps.md}

  docs/readme:
    title: Front-page figures
    purpose: >-
      Figures on the repository front page, built by `tools/readme/build_readme.py` from the records and the CAD
      renders.
    hero: {img: docs/readme/banner.svg, caption: "Banner"}
    gallery:
      - {img: docs/readme/at-a-glance.svg, caption: "At a glance"}
      - {img: docs/readme/risk-matrix.svg, caption: "Risk matrix"}
      - {img: docs/readme/simulation.svg, caption: "Simulation summary (synthetic)"}

  docs/wiki:
    hero: {img: docs/wiki/images/safety-lifecycle.svg, caption: "Safety lifecycle process map (illustrative)"}
    gallery:
      - {img: docs/wiki/images/sus-i1-boundary.svg, caption: "SUS-I1 boundary and interfaces"}
      - {img: docs/wiki/images/sim-su-01.svg, caption: "UAV simulation SU-01 (synthetic)"}
      - {img: docs/wiki/images/3d-s3-01.png, caption: "3D scene S3-01"}
    links:
      - {text: Wiki home page source, href: docs/wiki/Home.md}
      - {text: All wiki images, href: docs/wiki/images/README.md}

  docs/wiki/images:
    title: Wiki images
    purpose: >-
      Every figure the wiki shows directly. Files named `sus-i1-*`, `sysml-*`, `sim-*` and `3d-*` are generated from
      the records; the process maps are exported from `docs/diagrams/mil-std-882e`. Never edit a generated file.
    hero: {img: docs/wiki/images/sus-i1-boundary.svg, caption: "sus-i1-boundary.svg"}
    gallery_glob: docs/wiki/images/*.{svg,png}

  models/sysml:
    hero: {img: docs/wiki/images/sysml-v02-hierarchy.svg, caption: "Part hierarchy (view V-02)"}
    gallery:
      - {img: docs/wiki/images/sysml-v07-satisfy.svg, caption: "Requirement satisfaction (view V-07)"}
      - {img: docs/wiki/images/sysml-v08-n2.svg, caption: "N2 interface chart (view V-08)"}
    links:
      - {text: SysML v2 model (wiki page), href: docs/wiki/SysML-Model.md}

  models/sysml/model:
    title: SysML v2 model files
    purpose: >-
      The textual SysML v2 model. `Architecture`, `Functions` and `SusanooLibrary` are hand-written and checked against
      the records; `Requirements` and `Satisfaction` are generated from `requirements/`. Every file passes the OMG pilot
      implementation in CI.
    hero: {img: docs/wiki/images/sysml-v02-hierarchy.svg, caption: "Part hierarchy (view V-02)"}
    gallery:
      - {img: docs/wiki/images/sysml-v07-satisfy.svg, caption: "Requirement satisfaction (view V-07)"}
      - {img: docs/wiki/images/sysml-v08-n2.svg, caption: "N2 interface chart (view V-08)"}

  pdac:
    title: PDaC product definition
    purpose: >-
      The Product Development as Code product record and the JSON schemas every record is validated against
      (`python -m tools.pdac.validate`).
    hero: {img: docs/wiki/images/rec-record-model.svg, caption: "Record model: how the record types reference each other", link: pdac/schemas/README.md}

  pdac/schemas:
    title: Record schemas
    purpose: One JSON schema per record type. The validator checks every record against its schema before the MIL-STD-882E rules run.
    hero: {img: docs/wiki/images/rec-record-model.svg, caption: "Record model: how the record types reference each other"}

  safety/events:
    title: Test and simulation events
    purpose: >-
      One `EVT-*.yaml` per bench, test or simulation event, with the event risk of each hazard that applies (Task 303).
      An event proceeds only with a human acceptance of its risk.
    hero: {img: docs/wiki/images/rec-event-risk.svg, caption: "Event risk: the hazards that apply to each event"}
    gallery:
      - {img: safety/mil-std-882e/06-verification/task-303-test-and-evaluation-participation/figures/fig-4-sysml-state-machine.svg, caption: "Task 303: event lifecycle", link: safety/mil-std-882e/06-verification/task-303-test-and-evaluation-participation/README.md}
      - {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}

  safety/generated:
    title: Generated safety exports
    purpose: Exports built from the hazard records by `python -m tools.pdac.report`. Never edit these; edit the records.
    hero: {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}
    gallery:
      - {img: safety/mil-std-882e/hazard-tracking-system/figures/fig-4-sysml-block-definition.svg, caption: "Hazard record structure", link: safety/mil-std-882e/hazard-tracking-system/README.md}

  safety/hazards:
    title: Hazard records
    purpose: >-
      One `HAZ-*.yaml` per hazard: the hazard tracking system (Task 106). Risk is preliminary until the PHA (Task 202),
      and nothing is accepted without a named human review.
    hero: {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}
    gallery:
      - {img: docs/wiki/images/rec-mitigations.svg, caption: "Mitigations by order of precedence"}
      - {img: safety/mil-std-882e/hazard-tracking-system/figures/fig-5-sysml-state-machine.svg, caption: "Hazard lifecycle", link: safety/mil-std-882e/hazard-tracking-system/README.md}
      - {img: safety/mil-std-882e/02-hazard-identification/task-201-preliminary-hazard-list/figures/fig-4-sysml-block-definition.svg, caption: "Task 201: preliminary hazard list structure", link: safety/mil-std-882e/02-hazard-identification/task-201-preliminary-hazard-list/README.md}
      - {img: docs/wiki/images/hazard-management.svg, caption: "Hazard management process map (illustrative)"}
    links:
      - {text: Hazard Tracking Log (wiki page), href: docs/wiki/Hazard-Tracking-Log.md}

  safety/software:
    title: Safety-significant software functions
    purpose: >-
      One `SSF-nnn.yaml` per safety-significant software function, with its software control category, criticality
      index and level-of-rigor status (MIL-STD-882E section 4.4).
    hero: {img: docs/wiki/images/rec-ssf.svg, caption: "SCC, SwCI and level-of-rigor status of every SSF"}
    gallery:
      - {img: docs/wiki/images/software-safety.svg, caption: "Software safety process map (illustrative)"}
      - {img: safety/mil-std-882e/software-safety/figures/fig-4-sysml-block-definition.svg, caption: "SSF record structure", link: safety/mil-std-882e/software-safety/README.md}

  sim/mujoco:
    title: Level-2 multibody simulation (MuJoCo)
    purpose: >-
      The level-2 walker model in MuJoCo and the cross-check that compares it case by case with the level-1 plant.
      Results are synthetic.
    hero: {img: docs/wiki/images/rec-l1-l2.svg, caption: "Level 1 against level 2, case by case (synthetic)"}
    links:
      - {text: Cross-check results, href: sim/results/l2-crosscheck.md}

  sim/trades:
    title: Trade-study evidence
    purpose: >-
      Simulations run as evidence for the architecture trade studies (`fault_response.yaml`, `fault_response.py` for
      TS-001). Results are synthetic and carry no evidence credit.
    planned: "Supply-loss outcome for each TS-001 alternative with load holding working and failed, drawn from sim/results/ts001-fault-response.json."
    links:
      - {text: TS-001 supply-loss evidence, href: sim/results/ts001-fault-response.md}
      - {text: Trade Studies (wiki page), href: docs/wiki/Trade-Studies.md}

  sim/plant:
    title: Level-1 walker plant
    purpose: The level-1 walker plant model and the scenario report it writes. Results are synthetic.
    hero: {img: docs/wiki/images/sim-sc-01.svg, caption: "SC-01 (synthetic)"}
    gallery:
      - {img: docs/wiki/images/sim-sc-02.svg, caption: "SC-02 (synthetic)"}
      - {img: docs/wiki/images/sim-sc-03.svg, caption: "SC-03 (synthetic)"}
      - {img: docs/wiki/images/sim-sc-04.svg, caption: "SC-04 (synthetic)"}
    links:
      - {text: Plant results, href: sim/results/plant-results.md}

  sim/results:
    title: Simulation results
    purpose: >-
      Results written by the simulation track and checked in CI. They are synthetic: they inform the hazard analysis
      and are never verification evidence.
    hero: {img: docs/readme/simulation.svg, caption: "Simulation results summary (synthetic)"}
    gallery:
      - {img: docs/wiki/images/rec-l1-l2.svg, caption: "Level 1 against level 2", link: sim/mujoco/README.md}
      - {img: docs/wiki/images/sim-sc-01.svg, caption: "SC-01"}
      - {img: docs/wiki/images/sim-sc-02.svg, caption: "SC-02"}
      - {img: docs/wiki/images/sim-sc-03.svg, caption: "SC-03"}
      - {img: docs/wiki/images/sim-sc-04.svg, caption: "SC-04"}
    links:
      - {text: UAV results, href: sim/results/uav/README.md}

  sim/results/uav:
    title: UAV simulation results (PX4 SITL)
    purpose: >-
      PX4 SITL failsafe runs written by `sim/uav/harness.py`, one JSON per scenario plus the summary. Synthetic; never
      verification evidence.
    hero: {img: docs/wiki/images/sim-su-01.svg, caption: "SU-01"}
    gallery:
      - {img: docs/wiki/images/sim-su-02.svg, caption: "SU-02"}
      - {img: docs/wiki/images/sim-su-03.svg, caption: "SU-03"}
      - {img: docs/wiki/images/sim-su-04.svg, caption: "SU-04"}
      - {img: docs/wiki/images/sim-su-05.svg, caption: "SU-05"}
      - {img: docs/wiki/images/sim-su-06.svg, caption: "SU-06"}
    links:
      - {text: UAV Simulation (wiki page), href: docs/wiki/UAV-Simulation.md}

  sim/scenes3d:
    title: 3D scene builder
    purpose: >-
      Builds the 3D scene pages in `docs/3d` from the simulation results (`export_scene.py`, `build_pages.py`) and
      renders the stills (`render.mjs`).
    hero: {img: docs/wiki/images/3d-s3-01.png, caption: "S3-01", link: docs/3d/S3-01.html}
    gallery:
      - {img: docs/wiki/images/3d-s3-03.png, caption: "S3-03", link: docs/3d/S3-03.html}
      - {img: docs/wiki/images/3d-s3-05-fog.png, caption: "S3-05 in fog", link: docs/3d/S3-05-fog.html}
      - {img: docs/wiki/images/3d-s3-06.png, caption: "S3-06", link: docs/3d/S3-06.html}

  sim/scenes3d/library:
    title: 3D scene library
    purpose: Environments and conditions (lighting, weather) that the 3D scenes are composed from.
    hero: {img: docs/wiki/images/3d-s3-01-dusk.png, caption: "S3-01 at dusk", link: docs/3d/S3-01-dusk.html}
    gallery:
      - {img: docs/wiki/images/3d-s3-05-fog.png, caption: "S3-05 in fog", link: docs/3d/S3-05-fog.html}

  sim/scenes3d/out:
    title: Exported 3D scene data
    purpose: Scene data exported by `export_scene.py`, one JSON per scene, read by the pages in `docs/3d`. Generated.
    hero: {img: docs/wiki/images/3d-s3-02.png, caption: "S3-02", link: docs/3d/S3-02.html}
    gallery:
      - {img: docs/wiki/images/3d-s3-04.png, caption: "S3-04", link: docs/3d/S3-04.html}

  sim/search:
    title: Failure search
    purpose: >-
      The fault families and the search that samples them for edge cases (`families.yaml`, `search.py`). Results are
      synthetic.
    hero: {img: docs/wiki/images/sim-sc-01.svg, caption: "SC-01, a case the search covers (synthetic)"}
    gallery:
      - {img: docs/wiki/images/sim-sc-02.svg, caption: "SC-02 (synthetic)"}
    links:
      - {text: Search results for SF-01, href: sim/results/search-SF-01.md}
      - {text: Edge cases, href: sim/results/edge-cases.md}

  sim/spec:
    title: Simulation specifications
    purpose: >-
      Walker parameters for the level-1 and level-2 models, each with a unit, range, status and source. Assumed values
      are marked as assumed.
    hero: {img: docs/wiki/images/sim-sc-01.svg, caption: "SC-01, run with these parameters (synthetic)"}
    gallery:
      - {img: docs/readme/simulation.svg, caption: "Simulation results summary (synthetic)"}

  sim/uav:
    title: UAV simulation harness (PX4 SITL)
    purpose: >-
      Runs the PX4 SITL failsafe scenarios in `scenarios.yaml` and writes `sim/results/uav`. Re-running needs a PX4
      build; see `sim/README.md`.
    hero: {img: docs/wiki/images/sim-su-01.svg, caption: "SU-01 (synthetic)"}
    gallery:
      - {img: docs/wiki/images/sim-su-02.svg, caption: "SU-02 (synthetic)"}
      - {img: docs/wiki/images/sim-su-03.svg, caption: "SU-03 (synthetic)"}

  standards/mil-std-882e:
    title: MIL-STD-882E model
    purpose: >-
      MIL-STD-882E (11 May 2012, base edition) as data: process elements, tasks, obligations and tables, used by the
      validator and the conformance pages.
    hero: {img: safety/mil-std-882e/figures/fig-4-sysml-activity.svg, caption: "The eight-element process as a SysML activity", link: safety/mil-std-882e/README.md}
    gallery:
      - {img: docs/wiki/images/safety-lifecycle.svg, caption: "Safety lifecycle process map (illustrative)"}
