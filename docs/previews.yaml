# Folder previews: what every folder shows a reader before they open anything.
# Read by tools/previews/build_previews.py, which writes a README for each folder below that has none, and a
# preview block (<!-- preview:start --> ... <!-- preview:end -->) into a hand-written README.
#
# Every folder in the repository must be listed here, follow its own documentation standard (`own_standard`), or
# be exempt (`exempt`). CI fails on a folder that is none of these, so a new folder gets a preview from day one.
#
#   title    README title (only used when the README is generated)
#   purpose  one or two sentences under the title (generated README only)
#   hero     the main figure: {img, caption, link?}
#   gallery  thumbnails: [{img, caption, link?}]; link defaults to the image
#   links    further pages to open: [{text, href}]
#   planned  a figure that does not exist yet: say what it will show
#
# Paths are repository-relative. Captions use only terms defined in docs/terms.yaml.

schema: susanoo/previews/v0.1

own_standard:            # folders whose READMEs follow framework/documentation-standard.md
  - .
  - concept
  - integrations/px4
  - integrations           # generated README (tools/figures/integrations_readme.py)
  - framework              # generated README top (tools/figures/framework_readme.py)
  - tools                  # generated README (tools/figures/tools_readme.py)
  - docs                   # generated README (tools/figures/docs_readme.py); subfolders keep their previews
  - sim/uav                # generated README (tools/figures/uav_readme.py)
  - sim/plant              # generated README (tools/figures/plant_readme.py)
  - sim/search             # generated README (tools/figures/search_readme.py)
  - sim/mujoco             # generated README (tools/figures/mujoco_readme.py)
  - sim/trades             # generated README (tools/figures/trades_readme.py)
  - sim/spec               # generated README (tools/figures/spec_readme.py)
  - sim/results            # generated README (tools/figures/results_readme.py)
  - sim/results/uav        # generated README (tools/figures/uavresults_readme.py)
  - sim/scenes3d           # generated README (tools/figures/scenes3d_readme.py)
  - sim/scenes3d/library   # generated README (tools/figures/lookslib_readme.py)
  - sim/scenes3d/out       # generated README (tools/figures/sceneout_readme.py)
  - cad/params             # generated README (tools/figures/params_readme.py)
  - cad/drawings           # generated README (tools/figures/drawings_readme.py)
  - cad/renders            # generated README (tools/figures/renders_readme.py); blender/ keeps its preview
  - sim/figures            # generated README (tools/figures/simfigs_readme.py)
  - docs/3d                # generated README (tools/figures/pages3d_readme.py)
  - docs/3d/assets         # generated README (tools/figures/assets3d_readme.py)
  - docs/vcycle            # generated README (tools/figures/vcycle_readme.py)
  - docs/diagrams          # generated README (tools/figures/diagrams_readme.py)
  - docs/diagrams/mil-std-882e   # generated README (tools/figures/maps882e_readme.py)
  - docs/readme            # generated README (tools/figures/frontpage_readme.py)
  - docs/wiki              # generated README top (tools/figures/wiki_readme.py)
  - docs/wiki/images       # generated README (tools/figures/wikiimages_readme.py)
  - safety/mil-std-882e
  - "safety/mil-std-882e/**"
  - cad                  # SUS-CAD-001: renders, drawings and layout tables (partly built by tools/cad/readme.py)
  - cad/concept-art      # hand-written page with a generated section (tools/figures/art_readme.py)
  - requirements           # generated READMEs with block, boundary, SysML and I/O figures (tools/figures/*_readme.py)
  - verification
  - changes
  - reviews
  - decisions
  - architecture
  - safety
  - sim
  - standards
  - models

exempt:                  # tests, tooling internals, figure stores shown by the README above them
  - "**/figures"
  - "**/figures/**"          # e.g. concept/figures/records (record-driven figures, tools/figures/concept_readme.py)
  - docs/wiki/images/readme  # figures of docs/wiki/images/README.md (tools/figures/wikiimages_readme.py)
  - "**/tests"
  - "**/__pycache__"
  - "**/node_modules"
  - ".git"
  - ".github"
  - ".github/**"
  - ".claude"
  - ".claude/**"
  - "tools/**"

folders:
  architecture/trades:
    title: Architecture trade studies
    purpose: >-
      One record per trade study (TS-nnn): question, alternatives, weighted criteria, evidence and scores. The project
      lead confirms the weights and selects an alternative; the Trade Studies wiki page is built from here.
    planned: "Score matrix of each study: alternatives against weighted criteria, with the evidence behind each score."
    links:
      - {text: Trade Studies (wiki page), href: docs/wiki/Trade-Studies.md}
      - {text: Trade-study decision process, href: concept/trade-studies.md}

  cad/renders/blender:
    title: Blender renders of CL-05
    purpose: >-
      Lit Blender renders and a walk cycle of the CL-05 reference layout, in plain and unarmed military livery.
      Rendered from the CAD; for communication, not engineering.
    hero: {img: cad/renders/blender/CL-05-hero.jpg, caption: "CL-05"}
    gallery_glob: cad/renders/blender/*.{jpg,gif}
    links:
      - {text: Walk cycle video, href: cad/renders/blender/CL-05-walk-military.mp4}









  models/sysml:
    hero: {img: docs/wiki/images/sysml-v02-hierarchy.svg, caption: "Part hierarchy (view V-02)"}
    gallery:
      - {img: docs/wiki/images/sysml-v07-satisfy.svg, caption: "Requirement satisfaction (view V-07)"}
      - {img: docs/wiki/images/sysml-v08-n2.svg, caption: "N2 interface chart (view V-08)"}
    links:
      - {text: SysML v2 model (wiki page), href: docs/wiki/SysML-Model.md}

  models/sysml/model:
    title: SysML v2 model files
    purpose: >-
      The textual SysML v2 model. `Architecture`, `Functions` and `SusanooLibrary` are hand-written and checked against
      the records; `Requirements` and `Satisfaction` are generated from `requirements/`. Every file passes the OMG pilot
      implementation in CI.
    hero: {img: docs/wiki/images/sysml-v02-hierarchy.svg, caption: "Part hierarchy (view V-02)"}
    gallery:
      - {img: docs/wiki/images/sysml-v07-satisfy.svg, caption: "Requirement satisfaction (view V-07)"}
      - {img: docs/wiki/images/sysml-v08-n2.svg, caption: "N2 interface chart (view V-08)"}

  pdac:
    title: PDaC product definition
    purpose: >-
      The Product Development as Code product record and the JSON schemas every record is validated against
      (`python -m tools.pdac.validate`).
    hero: {img: docs/wiki/images/rec-record-model.svg, caption: "Record model: how the record types reference each other", link: pdac/schemas/README.md}

  pdac/schemas:
    title: Record schemas
    purpose: One JSON schema per record type. The validator checks every record against its schema before the MIL-STD-882E rules run.
    hero: {img: docs/wiki/images/rec-record-model.svg, caption: "Record model: how the record types reference each other"}

  reliability:
    title: Reliability pilot records
    purpose: >-
      Parts, failure modes, shared parameters and one fault-tree file per hazard for the reliability pilot
      (`tools/reliability`). Hardware causes are quantified against the tailored probability bands; software, human
      and environmental causes are undeveloped events, traced but not given a number. Every value is still assumed,
      so every result is illustrative: not evidence and not a probability rating.
    hero: {img: docs/wiki/images/rel-bands.svg, caption: "Quantified hardware paths against the bands (illustrative)"}
    gallery:
      - {img: docs/wiki/images/rel-ft-001.svg, caption: "FT-001: alternative A"}
      - {img: docs/wiki/images/rel-ft-002.svg, caption: "FT-002: alternative B-EHA"}
      - {img: docs/wiki/images/rel-ft-003.svg, caption: "FT-003: alternative B-EMA"}
      - {img: docs/wiki/images/rel-ft-009.svg, caption: "FT-009: UAV launch or recovery outside the envelope"}
      - {img: docs/wiki/images/rel-ft-021.svg, caption: "FT-021: protective stop not reaching a safe state"}
    links:
      - {text: Reliability Pilot (wiki page), href: docs/wiki/Reliability-Pilot.md}
      - {text: Engine and record format, href: tools/reliability/README.md}

  safety/events:
    title: Test and simulation events
    purpose: >-
      One `EVT-*.yaml` per bench, test or simulation event, with the event risk of each hazard that applies (Task 303).
      An event proceeds only with a human acceptance of its risk.
    hero: {img: docs/wiki/images/rec-event-risk.svg, caption: "Event risk: the hazards that apply to each event"}
    gallery:
      - {img: safety/mil-std-882e/06-verification/task-303-test-and-evaluation-participation/figures/fig-4-sysml-state-machine.svg, caption: "Task 303: event lifecycle", link: safety/mil-std-882e/06-verification/task-303-test-and-evaluation-participation/README.md}
      - {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}

  safety/generated:
    title: Generated safety exports
    purpose: Exports built from the hazard records by `python -m tools.pdac.report`. Never edit these; edit the records.
    hero: {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}
    gallery:
      - {img: safety/mil-std-882e/hazard-tracking-system/figures/fig-4-sysml-block-definition.svg, caption: "Hazard record structure", link: safety/mil-std-882e/hazard-tracking-system/README.md}

  safety/hazards:
    title: Hazard records
    purpose: >-
      One `HAZ-*.yaml` per hazard: the hazard tracking system (Task 106). Risk is preliminary until the PHA (Task 202),
      and nothing is accepted without a named human review.
    hero: {img: docs/readme/risk-matrix.svg, caption: "Current hazard risk on the MIL-STD-882E matrix"}
    gallery:
      - {img: docs/wiki/images/rec-mitigations.svg, caption: "Mitigations by order of precedence"}
      - {img: safety/mil-std-882e/hazard-tracking-system/figures/fig-5-sysml-state-machine.svg, caption: "Hazard lifecycle", link: safety/mil-std-882e/hazard-tracking-system/README.md}
      - {img: safety/mil-std-882e/02-hazard-identification/task-201-preliminary-hazard-list/figures/fig-4-sysml-block-definition.svg, caption: "Task 201: preliminary hazard list structure", link: safety/mil-std-882e/02-hazard-identification/task-201-preliminary-hazard-list/README.md}
      - {img: docs/wiki/images/hazard-management.svg, caption: "Hazard management process map (illustrative)"}
    links:
      - {text: Hazard Tracking Log (wiki page), href: docs/wiki/Hazard-Tracking-Log.md}

  safety/software:
    title: Safety-significant software functions
    purpose: >-
      One `SSF-nnn.yaml` per safety-significant software function, with its software control category, criticality
      index and level-of-rigor status (MIL-STD-882E section 4.4).
    hero: {img: docs/wiki/images/rec-ssf.svg, caption: "SCC, SwCI and level-of-rigor status of every SSF"}
    gallery:
      - {img: docs/wiki/images/software-safety.svg, caption: "Software safety process map (illustrative)"}
      - {img: safety/mil-std-882e/software-safety/figures/fig-4-sysml-block-definition.svg, caption: "SSF record structure", link: safety/mil-std-882e/software-safety/README.md}












  standards/mil-std-882e:
    title: MIL-STD-882E model
    purpose: >-
      MIL-STD-882E (11 May 2012, base edition) as data: process elements, tasks, obligations and tables, used by the
      validator and the conformance pages.
    hero: {img: safety/mil-std-882e/figures/fig-4-sysml-activity.svg, caption: "The eight-element process as a SysML activity", link: safety/mil-std-882e/README.md}
    gallery:
      - {img: docs/wiki/images/safety-lifecycle.svg, caption: "Safety lifecycle process map (illustrative)"}
      - {img: docs/wiki/images/analysis-dependencies.svg, caption: "Analysis dependencies (illustrative)"}
    links:
      - {text: MIL-STD-882E Conformance (wiki page), href: docs/wiki/MIL-STD-882E-Conformance.md}

  standards/tailoring:
    title: Project tailoring
    purpose: >-
      How the project tailors MIL-STD-882E: risk definitions, roles and acceptance authority, task selection and ID
      conventions. Proposed until approved on a review record.
    hero: {img: docs/wiki/images/rec-task-tailoring.svg, caption: "Task tailoring: every MIL-STD-882E task by gate and disposition"}
    gallery:
      - {img: docs/wiki/images/rec-acceptance.svg, caption: "Who may accept which risk", link: reviews/README.md}
      - {img: docs/wiki/images/responsibility-swimlanes.svg, caption: "Responsibility swimlanes (illustrative)"}
      - {img: safety/mil-std-882e/01-safety-approach/figures/fig-4-sysml-block-definition.svg, caption: "Safety approach records", link: safety/mil-std-882e/01-safety-approach/README.md}
      - {img: docs/readme/risk-matrix.svg, caption: "Risk matrix with the tailored definitions"}
    links:
      - {text: Task Applicability (wiki page), href: docs/wiki/MIL-STD-882E-Applicability.md}

