<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 5 · SysML state machine — GeneratedFile</text>
<text x="40" y="66" font-size="12.5" fill="#475569">The life of a generated documentation file, generated into Documentation.sysml. All 259</text>
