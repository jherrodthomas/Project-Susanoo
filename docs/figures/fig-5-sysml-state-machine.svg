<text x="193" y="814" font-size="11" fill="#475569">Initial / final</text>
<text x="40" y="836" font-size="10.5" fill="#94A3B8">Generated by tools/figures/docs_readme.py from the files in docs/ and their GENERATED markers. A generated file is never edited by</text>
<text x="40" y="851" font-size="10.5" fill="#94A3B8">hand; it is rebuilt from the records and checked in CI.</text>
