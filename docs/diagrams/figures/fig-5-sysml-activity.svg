<g class="terms" data-base-h="1581">
<rect x="0" y="1581" width="760" height="141.6" fill="#FFFFFF"/>
<line x1="40" y1="1585" x2="720" y2="1585" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="1600.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: ARP4754B = SAE guidelines for development of civil aircraft and systems · ARP4761A = SAE guidelines for the safety</text>
<text x="40" y="1615.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">assessment process on civil aircraft · CONOPS = concept of operations · DoD = US Department of Defense · FHA = functional</text>
<text x="40" y="1629.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">hazard analysis (MIL-STD-882E Task 208; also ARP4761A aircraft FHA) · MIL-STD-882E = US DoD Standard Practice for System</text>
<text x="40" y="1644.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Safety (11 May 2012, base edition) · PHA = preliminary hazard analysis (MIL-STD-882E Task 202) · PHL = preliminary hazard</text>
<text x="40" y="1658.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">list (MIL-STD-882E Task 201) · SAE = SAE International, publisher of ARP4754B and ARP4761A · SHA = system hazard analysis</text>
<text x="40" y="1673.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(MIL-STD-882E Task 205) · SRHA = system requirements hazard analysis (MIL-STD-882E Task 203) · SSHA = subsystem hazard</text>
<text x="40" y="1687.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">analysis (MIL-STD-882E Task 204) · SSPP = system safety program plan (MIL-STD-882E Task 102) · SVG = Scalable Vector</text>
<text x="40" y="1702.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Graphics, the figure file format · SysML = Systems Modeling Language (SysML v2) · US = United States</text>
</g>
</svg>
