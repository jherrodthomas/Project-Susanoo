schema: susanoo/requirement/v0.1
id: SYS-020
title: Emergency egress without power or kneeling
statement: The pilot shall be able to leave the walker from the standing posture without platform power and without
  kneeling, through an exit other than the front opening, with a descent aid and handholds that keep three points
  of contact to the ground.
