schema: susanoo/requirement/v0.1
id: SYS-017
title: Arm stow interlock for walking
statement: The walker shall inhibit walking until both manipulator arms are confirmed stowed and locked, or locked
  in the carry pose under the loaded-walking conditions of SYS-019, shall hold the arms in that pose until walking
  has stopped, and shall inhibit manipulation while the exclusion zone around the arms' reach is not confirmed clear.
