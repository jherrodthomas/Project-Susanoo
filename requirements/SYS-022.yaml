schema: susanoo/requirement/v0.1
id: SYS-022
title: Dock charging protection and isolation
statement: The dock shall charge the UAV battery only when the aircraft is seated and confirmed, shall stop charging
  on over-voltage, over-current or over-temperature independently of the charging software, and shall keep its charging
  contacts de-energised and shrouded whenever no UAV is seated or charging has been isolated for handling.
