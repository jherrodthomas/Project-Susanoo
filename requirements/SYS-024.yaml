schema: susanoo/requirement/v0.1
id: SYS-024
title: External extraction of an incapacitated pilot
statement: Trained crew shall be able to release the hatch and the pilot restraint from outside the walker without
  platform power, and to remove an incapacitated pilot from a standing, kneeling or fallen walker within a defined
  time, with fall protection for the rescuers.
