schema: susanoo/requirement/v0.1
id: SYS-021
title: UAV data validity and staleness annunciation
statement: The pilot display shall mark UAV imagery, position and telemetry as not valid when they fail validity
  checks, and as not current when they have not updated within a defined time, so that they are never shown as current
  and valid when they are not.
