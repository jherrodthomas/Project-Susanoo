schema: susanoo/requirement/v0.1
id: SYS-018
title: Loaded walking limits
statement: The walker shall permit walking with a payload only while the payload is confirmed secured, both arms
  are locked in a defined carry pose and payload mass and centre of gravity are within defined limits, and shall
  then limit walking speed, step height and terrain slope to defined loaded values inside the stability envelope
  of SYS-008.
