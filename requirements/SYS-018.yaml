schema: susanoo/requirement/v0.1
id: SYS-018
title: Controlled lowered posture for ingress and egress
statement: The walker shall provide a controlled lowered posture for ingress and egress, with the cockpit floor at
  or below a defined height, entered and left at a controlled speed only while the area under and around the pod
  and legs is confirmed clear, and shall inhibit walking while an access ladder is deployed.
