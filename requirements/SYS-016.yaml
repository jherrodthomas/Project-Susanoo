schema: susanoo/requirement/v0.1
id: SYS-016
title: Actuator torque reserve against supply loss
statement: Each ankle actuator shall deliver at least 1.5 m g L_foot of torque at full actuator supply and at least
  0.6 m g L_foot at the supply at which load holding engages, and each knee actuator at least 94 kN m at full
  supply (SPEC-WLK-001 mass and geometry, the reference layout CL-05), so that a loss of supply inside the operating envelope does not tip the
  walker before load holding engages.
status: candidate
source:
  documents:
  - sim/results/sizing-cf4.md
  - sim/results/l2-crosscheck.md
  hazard_ids:
  - HAZ-WLK-002
allocated_to:
- SUS-M1-WLK
safety_significant: true
verification:
  method:
  - analysis
  - test
  evidence_ids: []
  disposition: open
tbd:
- 'Knee re-sized on the reverse-knee level-2 model (DQ-027): in CL-05''s stance (1.018 rad) and its walking bends
  (about 0.6 to 1.0 rad) the knee needs 62.5 kN m to clear the envelope, and 94 kN m is 1.5 times that; a straighter
  stance clears 26.5 kN m only while the knee stays within about 0.4 rad, which the walk does not
  (sim/results/sizing-cf4.md)'
- Values are preliminary (sizing SZ-01, level 2 only, synthetic), re-sized for the 4,590 kg reference layout
  (DQ-023) and adopted in the level-2 spec by DQ-024 (knee raised to 94 kN m by DQ-027); they assume torque falls in proportion to supply;
  confirm with the selected actuator's torque-supply characteristic in the actuation trade (TS-001, DQ-006)
