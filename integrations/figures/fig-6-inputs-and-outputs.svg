<text x="40" y="544.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: DoD = US Department of Defense · DQ-nnn = decision question for the project lead (decisions/register.yaml) · IF-nnn = interface in the item definition</text>
<text x="40" y="559.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(architecture/item-definition.yaml) · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · PX4 = PX4 Autopilot, the open-source</text>
<text x="40" y="573.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">flight-control software candidate for SUS-A1 · SHA = system hazard analysis (MIL-STD-882E Task 205) · SITL = software-in-the-loop simulation · SSF-nnn =</text>
<text x="40" y="588.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">safety-significant software function record (safety/software/) · SUS-A1 = dockable observation UAV · SYS-nnn = system safety requirement record</text>
<text x="40" y="602.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(requirements/SYS-nnn.yaml) · UAV = uncrewed aerial vehicle (drone) · US = United States</text>
</g>
</svg>
