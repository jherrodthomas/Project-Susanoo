      - {id: PX4, code: SUS-A1-FC, title: PX4 Autopilot (pinned), sub: "stabilisation, navigation, modes, failsafes", tone: software, parent: A1}
      - {id: PRP, code: SUS-A1-PROP, title: "Motors, ESCs, propellers", parent: A1}
