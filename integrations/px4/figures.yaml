      - {id: DCK, code: SUS-M1-DCK, title: Dock, sub: "retention, charge, rotor inhibit", tone: interface, parent: M1}
      - {id: SUP, code: SUS-I1-INT, title: Integration manager, sub: "readiness, launch / recovery permit", tone: safety, parent: I1}
      - {id: A1, title: "SUS-A1 · Observation UAV", parent: I1}
