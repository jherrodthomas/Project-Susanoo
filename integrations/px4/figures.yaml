  - file: fig-4-sysml-state-machine.svg
    number: "4"
    title: SysML state machine — fail-closed launch permit
    subtitle: >-
      Launch is denied by default and any stale or inconsistent input returns to denied. Once airborne PX4 owns the
      flight; a walker emergency stop does not cut UAV motors. Drawn from PX4Integration::LaunchPermit.
    ref: PX4Integration.sysml
    stm_from:
      file: PX4Integration.sysml
      state_def: LaunchPermit
      package: PX4Integration
      tones: {denied: safety, contingency: safety}
    legend:
      - ["line:#475569", "#475569", "Transition (trigger)"]
      - ["#FFF7ED", "#C2410C", "Safe / contingency state"]

