# Level-1 (sim/plant/walker.py) vs level-2 (sim/mujoco/l2.py) cross-check. Every case runs on both models; the
# report lists agreement of outcome classes and differences in mishap time and impact speed. Edge cases of each
# search family are added automatically from sim/results/search-*.json. A disagreement is a finding about the
# models, not something to tune away. Notes are AI drafts (I0) explaining a known disagreement.
schema: susanoo/sim-crosscheck/v0.1
families:
  NOM: No fault (capability by slope)
  CAT: Fault catalogue (sim/faults.yaml)
  CAP: Actuator-capacity boundary (outside the operating envelope)
  STOP: Protective stop on a slope (no fault)
cases:
  - {id: NOM-00, family: NOM, case: {slope_deg: 0}}
  - {id: NOM-08, family: NOM, case: {slope_deg: 8}}
  - {id: NOM-12, family: NOM, case: {slope_deg: 12}}
  - {id: NOM-15, family: NOM, case: {slope_deg: 15}}
  - {id: NOM-20, family: NOM, case: {slope_deg: 20}}
  - {id: NOM-25, family: NOM, case: {slope_deg: 25}}
  - {id: CAT-STOP, family: CAT, case: {stop_request_s: 1.0}}
  - {id: CAT-01-HOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: works}}
  - {id: CAT-01-NOHOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: fails}}
  - {id: CAT-01-SLOW-8, family: CAT, case: {fault: FLT-01, tau_leak_s: 2.0, slope_deg: 8, load_holding: works}}
  - {id: CAT-02-MON, family: CAT, case: {fault: FLT-02, monitor: true}}
  - {id: CAT-02-NOMON, family: CAT, case: {fault: FLT-02, monitor: false}}
  - {id: CAT-03, family: CAT, case: {fault: FLT-03}}
  - {id: CAT-04-BRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: works}}
  - {id: CAT-04-NOBRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: fails}}
  - {id: STOP-16, family: STOP, case: {slope_deg: 16, stride_offset_m: 0.12, stop_request_s: 1.0}}
  - {id: STOP-20, family: STOP, case: {slope_deg: 20, stride_offset_m: 0.12, stop_request_s: 1.0}}
  - {id: CAP-16, family: CAP, case: {fault: FLT-01, slope_deg: 16, tau_leak_s: 2.56, pilot_reaction_s: 2.4, stride_offset_m: 0.16, load_holding: works}}
notes:
  CAT-01-SLOW-8: "A slow leak at 8 degrees with load holding working. Level 1 sags (A4) but stays balanced until the lock. Level 2 is reverse-kneed (CL-05): standing on one leg takes about 25 kN m at the knee, so with the adopted 26.5 kN m (DQ-026) the knee gives way as supply falls, before load holding engages at 0.4, and the cockpit sinks (hard drop at 1.8 m/s). With the knee at 62.5 kN m or more (sim/results/sizing-cf4.md) level 2 locks at 2.9 s and holds, as level 1 does."
  CAP-16: "A slow leak at 16 degrees with a 0.16 m CoM offset (above the 0.12 m limit, DQ-011) and load holding working. Level 1 loses balance as its centre-of-pressure limit (L cos(slope) x capacity, A3) shrinks and tips after the hold engages. Level 2 is reverse-kneed (CL-05): standing on one leg takes about 25 kN m at the knee, so with the adopted 26.5 kN m (DQ-026) the knee gives way as supply falls, before load holding engages at 0.4, and the cockpit sinks, crossing the rest height at 1.0 m/s, just above the safe drop speed. With the knee at 62.5 kN m or more level 2 locks at 3.4 s and holds."
  SF-01/EC-07: "Load holding fails during a slow leak at 20 degrees, so the walker is lost either way unless the joints outlast the leak; the models differ in which actuator gives out first. Level 1 ties leg force and centre-of-pressure authority to the same capacity (A3, A4) and tips. Level 2 is reverse-kneed (CL-05): standing on one leg takes about 25 kN m at the knee, so with the adopted 26.5 kN m (DQ-026) the knee gives way as supply falls, before load holding engages at 0.4, and the cockpit sinks, at 1.0 m/s; it still drops with the knee at 62.5 kN m and holds through the run at 94 kN m."
  SF-01/EC-08: "A slow leak at 19.5 degrees with load holding working; level 1 locks at about 2.9 s, but its centre-of-pressure limit (A3) and leg sag (A4) have let its CoM drift to the foot edge, so the locked body tips (A5) at 3.6 s. Level 2 is reverse-kneed (CL-05): standing on one leg takes about 25 kN m at the knee, so with the adopted 26.5 kN m (DQ-026) the knee gives way as supply falls, before load holding engages at 0.4, and the cockpit sinks (hard drop at 1.6 m/s). With the knee at 62.5 kN m or more level 2 locks at 2.9 s and holds: there level 1's assumptions, not the actuators, decide."
