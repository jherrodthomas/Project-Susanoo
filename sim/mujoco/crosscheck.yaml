# Level-1 (sim/plant/walker.py) vs level-2 (sim/mujoco/l2.py) cross-check. Every case runs on both models; the
# report lists agreement of outcome classes and differences in mishap time and impact speed. Edge cases of each
# search family are added automatically from sim/results/search-*.json. A disagreement is a finding about the
# models, not something to tune away. Notes are AI drafts (I0) explaining a known disagreement.
schema: susanoo/sim-crosscheck/v0.1
families:
  NOM: No fault (capability by slope)
  CAT: Fault catalogue (sim/faults.yaml)
  CAP: Actuator-capacity boundary (outside the operating envelope)
  STOP: Protective stop on a slope (no fault)
cases:
  - {id: NOM-00, family: NOM, case: {slope_deg: 0}}
  - {id: NOM-08, family: NOM, case: {slope_deg: 8}}
  - {id: NOM-12, family: NOM, case: {slope_deg: 12}}
  - {id: NOM-15, family: NOM, case: {slope_deg: 15}}
  - {id: NOM-20, family: NOM, case: {slope_deg: 20}}
  - {id: NOM-25, family: NOM, case: {slope_deg: 25}}
  - {id: CAT-STOP, family: CAT, case: {stop_request_s: 1.0}}
  - {id: CAT-01-HOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: works}}
  - {id: CAT-01-NOHOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: fails}}
  - {id: CAT-01-SLOW-8, family: CAT, case: {fault: FLT-01, tau_leak_s: 2.0, slope_deg: 8, load_holding: works}}
  - {id: CAT-02-MON, family: CAT, case: {fault: FLT-02, monitor: true}}
  - {id: CAT-02-NOMON, family: CAT, case: {fault: FLT-02, monitor: false}}
  - {id: CAT-03, family: CAT, case: {fault: FLT-03}}
  - {id: CAT-04-BRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: works}}
  - {id: CAT-04-NOBRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: fails}}
  - {id: STOP-16, family: STOP, case: {slope_deg: 16, stride_offset_m: 0.12, stop_request_s: 1.0}}
  - {id: STOP-20, family: STOP, case: {slope_deg: 20, stride_offset_m: 0.12, stop_request_s: 1.0}}
  - {id: CAP-16, family: CAP, case: {fault: FLT-01, slope_deg: 16, tau_leak_s: 2.56, pilot_reaction_s: 2.4, stride_offset_m: 0.16, load_holding: works}}
notes:
  CAT-02-NOMON: "Frozen posture feedback with no staleness monitor: the walker is lost at both levels. Level 1's CoM runs ahead and tips at 2.8 s. Level 2's runs ahead too, then the walker sinks about 0.7 m and staggers, which meets neither outcome definition (tip, or a drop below the kneeling height) within the 6 s horizon; run longer, it ends in a hard drop at 6.9 s. The difference is in when the run crosses an outcome threshold, not in whether control is lost (HAZ-WLK-001)."
  CAT-04-NOBRAKE: "A bus undervoltage to 35% capacity with no brakes: the walker is lost at both levels. Level 1 scales leg force with capacity (A4), so its legs cannot carry the 4,590 kg walker and it drops at 2.6 s. Level 2's nearly straight legs carry it, but during the protective stop the CoM drifts behind the foot until it tips at 5.8 s with the adopted ankle (26.5 kN m), or drops at 5.6 s with the re-sized ankle (40.5 kN m)."
  CAP-16: "A slow leak at 16 degrees with a 0.16 m CoM offset (above the 0.12 m limit, DQ-011) and load holding working. Level 1 loses balance as its centre-of-pressure limit (L cos(slope) x capacity, A3) shrinks and its legs sink (A4), and tips after the hold engages. Level 2 holds it with the ankle at 26 kN m or more, drops the cockpit at 20 kN m and tips at 15 kN m: the actuator-capacity boundary now lies below the adopted ankle torque (sim/results/sizing-cf4.md)."
  SF-01/EC-07: "Load holding fails during a slow leak at 20 degrees, so the walker is lost either way; the models differ in which actuator gives out first. Level 1 ties leg force and centre-of-pressure authority to the same capacity (A3, A4) and tips. Level 2 tips with ankle 20 and knee 60 kN m, holds through the run with ankle 26.5 and knee 60 kN m, and drops the cockpit with the adopted torques (26.5 and 22.5 kN m, 2.0 m/s) and with the re-sized ones (40.5 and 26.5 kN m, 2.7 m/s): weaker knees turn the tip into a drop (HAZ-PIL-002)."
  SF-01/EC-08: "A slow leak at 19.5 degrees with load holding working; both levels lock at about 2.9 s. Before the lock, level 1's centre-of-pressure limit (A3) and leg sag (A4, 0.12 m) let its CoM drift to the foot edge, so the locked body tips (A5) at 3.6 s. Level 2 keeps its CoM 0.32 m ahead of the foot until the lock and holds, with the ankle at any torque from 15 kN m up: here level 1's assumptions, not the actuators, decide."
