# Level-1 (sim/plant/walker.py) vs level-2 (sim/mujoco/l2.py) cross-check. Every case runs on both models; the
# report lists agreement of outcome classes and differences in mishap time and impact speed. Edge cases of each
# search family are added automatically from sim/results/search-*.json. A disagreement is a finding about the
# models, not something to tune away. Notes are AI drafts (I0) explaining a known disagreement.
schema: susanoo/sim-crosscheck/v0.1
families:
  NOM: No fault (capability by slope)
  CAT: Fault catalogue (sim/faults.yaml)
  CAP: Actuator-capacity boundary (outside the operating envelope)
cases:
  - {id: NOM-00, family: NOM, case: {slope_deg: 0}}
  - {id: NOM-08, family: NOM, case: {slope_deg: 8}}
  - {id: NOM-12, family: NOM, case: {slope_deg: 12}}
  - {id: NOM-15, family: NOM, case: {slope_deg: 15}}
  - {id: NOM-20, family: NOM, case: {slope_deg: 20}}
  - {id: NOM-25, family: NOM, case: {slope_deg: 25}}
  - {id: CAT-STOP, family: CAT, case: {stop_request_s: 1.0}}
  - {id: CAT-01-HOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: works}}
  - {id: CAT-01-NOHOLD, family: CAT, case: {fault: FLT-01, tau_leak_s: 0.05, load_holding: fails}}
  - {id: CAT-01-SLOW-8, family: CAT, case: {fault: FLT-01, tau_leak_s: 2.0, slope_deg: 8, load_holding: works}}
  - {id: CAT-02-MON, family: CAT, case: {fault: FLT-02, monitor: true}}
  - {id: CAT-02-NOMON, family: CAT, case: {fault: FLT-02, monitor: false}}
  - {id: CAT-03, family: CAT, case: {fault: FLT-03}}
  - {id: CAT-04-BRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: works}}
  - {id: CAT-04-NOBRAKE, family: CAT, case: {variant: electric, fault: FLT-04, load_holding: fails}}
  - {id: CAP-16, family: CAP, case: {fault: FLT-01, slope_deg: 16, tau_leak_s: 2.56, pilot_reaction_s: 2.4, stride_offset_m: 0.16, load_holding: works}}
notes:
  NOM-25: "Level 2 tips the no-fault gait from about 24 degrees, level 1 from about 27 (both hold at 20). The level-2 controller keeps the commanded centre of pressure within 90% of the foot, a margin the level-1 limit (A3) does not have: with the full foot, level 2 holds 25 and tips at 26. The ankle stays below its torque limit (15.5 of 20 kN m at 25 degrees). Level 2 is the more pessimistic; the slope limit should rest on it."
  CAP-16: "A slow leak at 16 degrees with a 0.16 m CoM offset (above the 0.12 m limit, DQ-011) and load holding working. Level 1 loses balance as its centre-of-pressure limit (L cos(slope) x capacity, A3) shrinks and its legs sink 0.2 m (A4), and tips 30 ms after the hold engages. Level 2's ankle (20 kN m) gives about 18% more centre-of-pressure authority than A3 as capacity falls, and it holds; with the ankle limited to m g L cos(slope) it tips as level 1 does. Ankle torque and leg force are design values to size against CF4 (HAZ-WLK-002)."
  CAT-04-NOBRAKE: "Level 1 scales leg support force linearly with capacity (assumption A4), so 35% capacity cannot hold the body. In level 2 nearly straight legs need little knee torque, so 35% of the knee torque still holds. A4 is pessimistic for straight-legged stance and optimistic for a deep crouch."
