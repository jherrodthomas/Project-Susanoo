# Actuator sizing against HAZ-WLK-002 CF4 (supply loss shrinks the balance capacity before load holding engages).
# Runs on level 2 (sim/mujoco/l2.py): level 1 has no joint torques (its centre-of-pressure limit A3 and leg force A4
# stand in for them). Every value in a sweep is run on the whole envelope grid with load holding working; a failure
# is any outcome other than safe. The proposal is an AI draft (I0); the level-2 spec holds what the lead adopted
# (DQ-024, DQ-026) on the stance the lead chose (DQ-027). It becomes a design value only through the actuation trade (TS-001, DQ-006) and a reviewed requirement (SYS-016).
schema: susanoo/sim-sizing/v0.1
id: SZ-01
title: Ankle and knee torque against supply loss on a slope
hazard: HAZ-WLK-002
causal_factor: CF4
base: {fault: FLT-01, variant: hydraulic, fault_onset_s: 1.0, monitor: true, load_holding: works}
# The operating envelope (CONOPS section 4: 20 degrees, CoM offset at most 0.12 m; DQ-010, DQ-011) and the SF-01 leak
# and pilot ranges.
grid:
  slope_deg: [0, 10, 14, 16, 18, 20]
  stride_offset_m: [0.0, 0.06, 0.12]
  tau_leak_s: [0.05, 0.5, 1.0, 1.5, 2.0, 3.0, 5.0]
  pilot_reaction_s: [0.5, 1.5, 3.0]
# Denser grid at the envelope corner, where the failures are; run for the proposal and the lowest clear ankle value.
corner_grid:
  slope_deg: [17, 18, 19, 20]
  stride_offset_m: [0.09, 0.105, 0.12]
  tau_leak_s: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.0]
  pilot_reaction_s: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
sweeps:
  - {id: ankle, param: ankle_torque_max_nm, values: [12000, 15000, 18000, 21000, 23000, 26500, 30500, 40500], with: {}}
  - {id: knee, param: knee_torque_max_nm, values: [12500, 15000, 17500, 20000, 22500, 26500], with: {ankle_torque_max_nm: 40500}}
  # Standing knee bend at the adopted torques (knee 26.5 kN m, DQ-026): a straighter stance shortens the knee's moment
  # arm. CL-05 was drawn at -1.018 rad and stands at -0.3 rad since DQ-027.
  - {id: posture, param: knee_stance_rad, values: [-1.018, -0.8, -0.6, -0.5, -0.4, -0.35, -0.3, -0.25, -0.2], with: {}}
proposal:
  ankle_torque_max_nm: 40500
  knee_torque_max_nm: 26500
  rationale: >-
    Preliminary. Ankle 1.5 m g L_foot at full supply (0.6 m g L_foot at the 0.4 load-holding threshold) and knee
    26.5 kN m, as adopted (DQ-024, DQ-026), with CL-05 standing on a knee bent 0.3 rad (DQ-027) instead of the
    1.018 rad it was drawn with. That deep stance puts the knee 0.46 m behind the line of the ground force, so one leg needs about
    25 kN m at the knee and the knee must still give it at the 0.4 load-holding threshold: in that stance the knee
    needs 62.5 kN m to clear the grid (knee sweep). Straightening the stance shortens that moment arm: the adopted knee
    clears the grid from 0.4 rad and both grids from 0.35 to 0.25 rad, and fails again at 0.2 rad, where the nearly
    straight knee has no travel left to absorb the load (posture sweep); 0.3 rad is the middle of that band, and there
    every ankle value in the sweep clears (ankle sweep). The straighter stance raised the hips by 0.23 m (CL-05 redrawn, cad/metrics.json). Joint torque is taken
    to fall in proportion to supply (level-2 assumption, as A4 at level 1).
