<text x="40" y="850.9" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: 1A–4F = risk assessment code, severity 1–4 plus probability A–F (e.g. 1C) · CI = continuous integration (the automated checks GitHub runs on every</text>
<text x="40" y="865.4" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">change) · F-nnn = system function in the item definition · PX4 = PX4 Autopilot, the open-source flight-control software candidate for SUS-A1 · SITL =</text>
<text x="40" y="879.9" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">software-in-the-loop simulation · SU-nnn = UAV PX4 SITL scenario · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial vehicle (drone)</text>
</g>
