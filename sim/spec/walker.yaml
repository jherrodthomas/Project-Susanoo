# SUS-M1 reduced-order plant parameters. Every value has a unit, an allowed range, a status and a source;
# sim/plant/spec.py refuses a value that is unsourced or outside its range (pattern from LionDriver's
# vehicle_spec.py). status: assumed (engineering assumption, no design yet) | derived (computed from other
# values) | published (from a cited external source). Nothing here is a design value: SUS-M1 has no selected
# hardware (concept stage), and the actuation architecture is open (decisions/register.yaml DQ-006).
schema: susanoo/sim-spec/v0.1
id: SPEC-WLK-001
revision: 0.1-draft
params:
  mass_kg:            {value: 3000,  unit: kg,    range: [1500, 6000], status: assumed, source: "Concept scale: open-frame walker with protected operator station (README)"}
  com_height_m:       {value: 3.0,   unit: m,     range: [2.0, 4.5],   status: assumed, source: "Concept scale; CoM roughly at hip height of a ~5 m walker"}
  crouch_height_m:    {value: 1.8,   unit: m,     range: [1.0, 2.5],   status: assumed, source: "Kneeling/supported posture (CONOPS MOD-03 stable pose)"}
  foot_half_length_m: {value: 0.6,   unit: m,     range: [0.3, 1.0],   status: assumed, source: "Single-support foot, along the direction of travel"}
  stance_half_length_m: {value: 1.4, unit: m,     range: [0.8, 2.5],   status: assumed, source: "Double-support polygon after planting the swing foot"}
  tip_offset_m:       {value: 1.0,   unit: m,     range: [0.6, 2.0],   status: assumed, source: "CoM horizontal offset beyond which tipping is taken as irrecoverable (contact and rotation not modelled)"}
  leg_force_ratio:    {value: 2.0,   unit: "-",   range: [1.2, 4.0],   status: assumed, source: "Leg actuator peak force as a multiple of body weight at full supply"}
  step_time_s:        {value: 0.5,   unit: s,     range: [0.2, 1.5],   status: assumed, source: "Time to plant the swing foot when a protective stop starts"}
  crouch_rate_mps:    {value: 0.3,   unit: m/s,   range: [0.1, 1.0],   status: assumed, source: "Commanded descent rate to the crouch posture during a protective stop"}
  safe_drop_speed_mps: {value: 1.0,  unit: m/s,   range: [0.5, 3.0],   status: assumed, source: "Vertical cockpit impact speed treated as injurious to a restrained seated pilot; placeholder pending HHA (Task 207)"}
  slope_lean:         {value: 0.25,  unit: "-",   range: [0.0, 1.0],   status: assumed, source: "Fraction of the slope-induced CoM lean (z tan slope) the gait does not compensate"}
  sway_amplitude_m:   {value: 0.1,   unit: m,     range: [0.0, 0.4],   status: assumed, source: "CoM fore-aft sway over the stance foot while walking"}
  sway_period_s:      {value: 1.2,   unit: s,     range: [0.6, 3.0],   status: assumed, source: "Gait cycle period at walking pace"}
  balance_gain:       {value: 1.5,   unit: "-",   range: [0.5, 5.0],   status: assumed, source: "Capture-point feedback gain"}
  height_kp:          {value: 25.0,  unit: 1/s2,  range: [5, 100],     status: assumed, source: "Height loop stiffness"}
  height_kd:          {value: 10.0,  unit: 1/s,   range: [2, 40],      status: assumed, source: "Height loop damping"}
  low_supply_alarm:   {value: 0.7,   unit: "-",   range: [0.3, 0.95],  status: assumed, source: "Supply fraction that raises the pilot alarm"}
  lock_threshold:     {value: 0.4,   unit: "-",   range: [0.1, 0.8],   status: assumed, source: "Supply fraction below which load-holding valves or brakes engage (HAZ-SAF-001 M1)"}
  lock_delay_s:       {value: 0.1,   unit: s,     range: [0.0, 1.0],   status: assumed, source: "Engagement delay of load-holding valves or brakes"}
  monitor_detect_s:   {value: 0.15,  unit: s,     range: [0.01, 1.0],  status: assumed, source: "Feedback staleness monitor detection time (SSF-004); no design yet"}
  electric_sag_floor: {value: 0.35,  unit: "-",   range: [0.0, 0.9],   status: assumed, source: "Electric variant: residual torque capacity after a bus undervoltage"}
  dt_s:               {value: 0.005, unit: s,     range: [0.001, 0.01], status: assumed, source: "Integration step (semi-implicit Euler)"}
  horizon_s:          {value: 6.0,   unit: s,     range: [3, 20],      status: assumed, source: "Simulated time after the start of the case"}
  gravity_mps2:       {value: 9.81,  unit: m/s2,  range: [9.8, 9.82],  status: published, source: "Standard gravity"}
