<text x="40" y="770.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: CONOPS = concept of operations · DQ-nnn = decision question for the project lead (decisions/register.yaml) · HAZ-nnn = hazard record</text>
