<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 1 · PX4 SITL failsafe scenarios</text>
<text x="40" y="66" font-size="12.5" fill="#475569">The 6 scenarios run on PX4 v1.16.2 (SIH quadrotor): what each sets and injects, the outcome class the harness scored, and the closest approach to the pilot below the</text>
<text x="40" y="83" font-size="12.5" fill="#475569">keep-out altitude (keep-out 3 m). Synthetic findings for the safety lead, not verification evidence.</text>
