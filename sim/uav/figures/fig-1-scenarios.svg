<text x="40" y="537.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: GCS = ground control station · GPS = Global Positioning System · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · PX4 = PX4 Autopilot, the open-source flight-control software candidate for</text>
<text x="40" y="552.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">SUS-A1 · SIH = simulation-in-hardware, PX4's built-in headless simulator · SITL = software-in-the-loop simulation · SU-nnn = UAV PX4 SITL scenario · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial</text>
<text x="40" y="566.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">vehicle (drone)</text>
