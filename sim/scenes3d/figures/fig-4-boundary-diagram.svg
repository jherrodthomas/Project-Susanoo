<text x="40" y="924.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: 3D = three-dimensional · CAD = computer-aided design · CI = continuous integration (the automated checks GitHub runs on every change) · CL-nnn = concept layout (cad/params/CL-nn.yaml; CL-01 to CL-05, CL-05 the reference</text>
<text x="40" y="939.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">layout) · SHA-256 = a cryptographic hash used to pin a downloaded file · SITL = software-in-the-loop simulation · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial vehicle (drone)</text>
