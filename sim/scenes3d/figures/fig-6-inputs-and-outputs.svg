<text x="40" y="544.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: 3D = three-dimensional · CL-nnn = concept layout (cad/params/CL-nn.yaml; CL-01 to CL-05, CL-05 the reference layout) · PX4 = PX4 Autopilot, the open-source</text>
<text x="40" y="559.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">flight-control software candidate for SUS-A1 · SHA-256 = a cryptographic hash used to pin a downloaded file · SITL = software-in-the-loop simulation · SUS-A1 =</text>
<text x="40" y="573.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">dockable observation UAV · SUS-M1 = piloted walker · UAV = uncrewed aerial vehicle (drone)</text>
