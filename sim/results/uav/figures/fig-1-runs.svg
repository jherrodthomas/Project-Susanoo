<text x="40" y="498" font-size="10.5" fill="#94A3B8">Generated by tools/figures/uavresults_readme.py from the PX4 SITL result files, their summary and the harness that writes them. Synthetic simulation output; design aid only, no evidence credit (sim/README.md, evidence gate).</text>
<g class="terms" data-base-h="527">
<rect x="0" y="527" width="1280" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="531" x2="1240" y2="531" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="546.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: FND-UAV-nnn = finding from the UAV simulations, for the safety lead · GCS = ground control station · GPS = Global Positioning System · HAZ-nnn = hazard record (safety/hazards/HAZ-xxx-nnn.yaml) · JSON = JavaScript</text>
<text x="40" y="561.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Object Notation, a data file format · KB = kilobyte, a file size of 1,024 bytes · PX4 = PX4 Autopilot, the open-source flight-control software candidate for SUS-A1 · SIH = simulation-in-hardware, PX4's built-in headless</text>
<text x="40" y="575.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">simulator · SITL = software-in-the-loop simulation · SU-nnn = UAV PX4 SITL scenario · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial vehicle (drone)</text>
</g>
</svg>
