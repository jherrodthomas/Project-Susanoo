    title: "Uncommanded or runaway joint motion"
    mishap: "A leg or arm strikes or crushes the pilot, the observer or a bystander."
    causes: ["control or software fault", "loss or corruption of joint feedback", "valve or drive failure", "command corruption"]
    energy_sources: [kinetic, hydraulic-pressure, electrical]
    exposed: [ACT-PILOT, ACT-OBSERVER, ACT-BYSTANDER]
    scenarios: [SCN-101, SCN-002]
    modes: [MOD-04, MOD-05]
    components: [SUS-M1-WLK, SUS-M1-MAN, SUS-M1-SAF]
    risk: {initial: {severity: catastrophic, probability: occasional, level: high}, rating_status: proposed}
    mitigated_by: [SYS-002, SYS-004]
    status: open
    applicability: [SUS-M1, SUS-I1]
    source: SUS-CONOPS-001

