# Preliminary Hazard List (PHL), MIL-STD-882E method. Source of truth for safety/preliminary-hazard-list.md,
# which tools/pdac/generate.py writes from this file.
#
# Ratings are INITIAL risk (before the candidate mitigations take effect), rated by an AI assistant from
# the concept description alone. They are proposals for the safety lead to review, not assessed values,
# and no risk has been accepted. MIL-STD-882E severity/probability/risk level live only on hazards;
# ARP4761A failure-condition classes live only on failure-condition records (check P5).
file: hazards
owner: safety-lead
revision: "0.1"
provenance: {author: "Claude (AI-drafted)", independence: I0, date: "2026-11-11", reviewed: false}
items:
