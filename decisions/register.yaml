# Decision register: every question for the project lead (the safety authority).
# Rules: CLAUDE.md "Decisions". Lifecycle: queued -> open -> answered -> applied (or withdrawn).
# decider: lead = only the lead can decide (risk acceptance, scope, money/hardware, authorities, gate go/no-go);
#          claude = reversible technical choice; Claude decides, applies and records it, never asks.
# Keep about ten open. The recommended option is listed first. Checked by tools/pdac rule D01;
# the inbox page docs/wiki/Decision-Inbox.md is generated from this file.
schema: susanoo/decision-register/v0.1
decisions:
  - id: DQ-001
    question: Which edition of MIL-STD-882E is the project baseline?
    context: >-
      The repository cited "MIL-STD-882E with Change 1" in 25 files, but the controlled copy held is the
      **11 May 2012 base edition**. Tables, task text and DIDs must come from one edition.
    options:
      - {key: base, title: 2012 base edition, detail: "Use the copy we hold; correct the citations. Change 1 can be adopted later as a change request."}
      - {key: change1, title: Change 1, detail: "Obtain the Change 1 controlled copy first; model work waits until then."}
    recommendation: base
    reversibility: revisit
    blocks: [standards/mil-std-882e/model.yaml]
    gate: G0
    decider: lead
    status: applied
    asked: 2026-11-11
    answer: {choice: base, by: lead, at: 2026-11-11, via: chat, note: "use the 2012 base edition, go ahead and build it"}
    applied_in: [standards/mil-std-882e/model.yaml, framework/882e-conformance-review.md]
    sources: [framework/882e-conformance-review.md]

  - id: DQ-002
    question: What monetary thresholds should the tailored severity categories use?
    context: >-
      Table I uses $10M / $1M / $100K. For a simulation-and-bench demonstrator that would put **every equipment
      loss in Negligible**. The proposal keeps the injury and environmental criteria and scales money by 1/100.
      4.3.3d requires tailored definitions to be derived from Table I and formally approved.
    options:
      - {key: scale-100, title: "Scale by 1/100 ($100K / $10K / $1K)", detail: "Equipment damage registers at a sensible level. Injury criteria unchanged."}
      - {key: table-i, title: Keep Table I values, detail: "No tailoring to justify; equipment losses all rate Negligible."}
      - {key: no-money, title: Drop the monetary criterion, detail: "Rate on injury and environment only; loses the equipment-damage dimension."}
    recommendation: scale-100
    reversibility: revisit
    blocks: [SUS-RISKDEF-001 approval, every hazard risk assessment]
    gate: G0
    decider: lead
    status: applied
    asked: 2026-11-11
    answer: {choice: scale-100, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    applied_in: [standards/tailoring/mil-std-882e.yaml]
    sources: [standards/tailoring/mil-std-882e.yaml, "MIL-STD-882E Table I, 4.3.3d"]

  - id: DQ-003
    question: What exposure basis should the probability levels use?
    context: >-
      4.3.3e requires numerical probability definitions to be documented. The proposal applies the Table A-II
      bands per item over a planned demonstrator life of **500 walker hours, 2,000 docking cycles and 200 UAV
      flight hours**, with one walker and two UAVs. These numbers are placeholders until the test programme exists.
    options:
      - {key: proposed, title: Use the proposed item life, detail: "Lets PHA (Task 202) start now; revisit at G2."}
      - {key: per-hour, title: Per operating hour, detail: "Simpler to compare across subsystems; less intuitive for docking-cycle hazards."}
      - {key: wait, title: Wait for the test programme, detail: "Probabilities stay qualitative until G2."}
    recommendation: proposed
    reversibility: easy
    blocks: [SUS-RISKDEF-001 approval]
    gate: G0
    decider: lead
    status: applied
    asked: 2026-11-11
    answer: {choice: proposed, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    applied_in: [standards/tailoring/mil-std-882e.yaml]
    sources: [standards/tailoring/mil-std-882e.yaml, "MIL-STD-882E 4.3.3e, Appendix A Table A-II"]

  - id: DQ-004
    question: Who holds each risk-acceptance role, and is the proposed authority mapping right?
    context: >-
      The proposal: High by a Program Executive, Serious by the Program Lead, Medium by the Chief Engineer, Low by
      the Safety Lead; a Test Operations representative concurs on High and Serious (4.3.7). All roles are
      **simulated**. Rule R13 now requires a named human in the right role on a review record before any risk
      is accepted, so no acceptance can happen until these roles are filled.
    options:
      - {key: lead-all, title: "You hold PE, PL and CE; name a separate user representative", detail: "Quickest; the review records show one person in several roles."}
      - {key: named, title: Name a different person for each role, detail: "More independence; needs volunteers."}
      - {key: remap, title: Change the mapping, detail: "For example, the Safety Lead accepts Medium as well as Low."}
    recommendation: lead-all
    reversibility: revisit
    blocks: [any risk acceptance, EVT-BENCH-001]
    gate: G4
    decider: lead
    status: answered
    asked: 2026-11-11
    answer: {choice: lead-all, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    applied_in: [standards/tailoring/mil-std-882e.yaml]
    sources: [standards/tailoring/mil-std-882e.yaml, "MIL-STD-882E 4.3.7"]

  - id: DQ-005
    question: Should a passing PDaC validation be required before merging to main?
    context: >-
      The workflow "PDaC / MIL-STD-882E validation" runs on every pull request, but **nothing stops a merge when it
      fails**. Making it a required check is a repository setting only you can change.
    options:
      - {key: required, title: Make it a required status check, detail: "Records on main always validate. A broken rule blocks merging until fixed."}
      - {key: advisory, title: Keep it advisory, detail: "Faster merges; drift can reach main."}
    recommendation: required
    reversibility: easy
    blocks: []
    gate: G0
    decider: lead
    status: answered
    asked: 2026-11-11
    answer: {choice: required, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    sources: [.github/workflows/pdac-validate.yml]

  - id: DQ-006
    question: What power and actuation architecture is the baseline for analysis?
    context: >-
      The records disagree. README.md and the seeded hazards assume **hydraulic actuation**. The wiki architecture
      page assumes a **series-hybrid engine-generator with battery and electric or electrohydraulic joints**. Trade
      study TS-001 covers actuation but not the power source. The power sub-elements and IF-002/IF-003 are marked
      candidate until this is decided. The choice changes hazards (stored hydraulic energy vs fuel, battery
      thermal runaway) and the simulation plant.
    options:
      - {key: open-both, title: Analyse both until TS-001 closes, detail: "Keep hydraulic and hybrid-electric as named alternatives; hazards tagged per alternative. More analysis now, no rework later."}
      - {key: hydraulic, title: Centralised hydraulic, detail: "Matches the README and current hazards; the sim plant models a hydraulic power unit."}
      - {key: hybrid, title: Series-hybrid electric or electrohydraulic, detail: "Matches the wiki architecture page; adds fuel and battery hazards, removes most stored-pressure hazards."}
    recommendation: open-both
    reversibility: hard
    blocks: [SUS-M1-PWR sub-elements, IF-002, IF-003, sim plant model]
    gate: G2
    decider: lead
    status: applied
    asked: 2026-11-11
    answer: {choice: open-both, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    applied_in: [architecture/item-definition.yaml, models/sysml/model/Architecture.sysml, concept/trade-studies.md, safety/hazards/HAZ-PWR-001.yaml, safety/hazards/HAZ-PWR-002.yaml, safety/hazards/HAZ-PWR-003.yaml, requirements/SYS-014.yaml, requirements/SYS-015.yaml]
    sources: [README.md, docs/wiki/SUS-M1-Architecture-and-Boundaries.md, concept/trade-studies.md, framework/liondriver-port-plan.md]

  - id: DQ-007
    question: Which engine should the higher-fidelity legged-dynamics simulation use?
    context: >-
      Step 4 of the LionDriver port plan needs a multibody engine. **MuJoCo** installs with pip and runs on CI CPUs;
      Project Chrono needs an 80-minute source build (LionDriver caches it); Drake is heavier. Reversible: the plant
      sits behind an interface file.
    options:
      - {key: mujoco, title: MuJoCo, detail: "Apache-2.0, pip install, fast on CPU."}
      - {key: chrono, title: Project Chrono, detail: "Better granular terrain; long build."}
      - {key: drake, title: Drake, detail: "Strong analysis tooling; heavy dependency."}
    recommendation: mujoco
    reversibility: easy
    blocks: [port plan step 4]
    gate: G3
    decider: claude
    status: applied
    asked: null
    answer: {choice: mujoco, by: lead, at: 2026-11-11, via: chat, note: "start the MuJoCo legged dynamics sim"}
    applied_in: [sim/mujoco/model.py, sim/mujoco/l2.py, sim/results/l2-crosscheck.md]
    sources: [framework/liondriver-port-plan.md]

  - id: DQ-008
    question: What should the UAV do when it loses the link to the integration manager?
    context: >-
      In PX4 SITL (sim/results/uav/summary.md), return-to-launch on link loss **flies the aircraft back to the dock and
      descends 1.9 m from the pilot station**, inside the 3 m keep-out, with no recovery permit (SU-01). If the walker
      has moved, it lands 20 m away where the dock used to be (SU-02). Land-in-place keeps it 48 m clear (SU-03).
      The interface contract requires a defined, analysed contingency and an explicit permit for recovery.
    options:
      - {key: land, title: "Hold briefly, then land in place (NAV_DLL_ACT = Land)", detail: "Keeps the aircraft away from people at the walker; the UAV must be recovered by hand. Proven clear in SU-03."}
      - {key: rally, title: Return to a rally point away from the walker, detail: "Keeps the aircraft recoverable; needs rally points kept up to date as the walker moves, and a permit before the final approach. More work in the integration manager."}
      - {key: rtl, title: Return to the dock (PX4 default return), detail: "Recovers the aircraft automatically, but breaches the pilot keep-out in SU-01 and lands at a stale home in SU-02."}
    recommendation: land
    reversibility: easy
    blocks: [PX4 parameter baseline for SUS-A1, HAZ-INT-001 mitigation M4]
    gate: G2
    decider: lead
    status: applied
    asked: 2026-11-11
    answer: {choice: land, by: lead, at: 2026-11-12, via: chat, note: "go with your recommendations on all of them"}
    applied_in: [safety/hazards/HAZ-INT-001.yaml, safety/software/SSF-008.yaml, requirements/SYS-013.yaml]
    sources: [sim/results/uav/summary.md, integrations/px4/interface-contract.md, safety/hazards/HAZ-INT-001.yaml]

  - id: DQ-009
    question: How should the level-1 walker start each case, now that the level-2 cross-check disagrees with it on EC-07 and EC-08?
    context: >-
      Level 1 started every case on the gait reference with the reference sway velocity (0.52 m/s). **That put the
      capture point at or beyond the foot edge at t = 0, a state its own balance loop never reaches** (its steady sway
      velocity is about 0.08 m/s). The old EC-07 and EC-05 tipped with no fault, and EC-08 sat on the foot edge, so a
      slow leak tipped it; level 2, starting near the foot centre, held all three. Started in the same state, the
      two models agree on every SF-01 edge case, and the CF4 tips found by the new search are reproduced at both levels.
    options:
      - {key: periodic-orbit, title: Start both models on level 1's periodic orbit, detail: "Analytic, shared by both levels (walker.initial_state, assumption A8). Re-runs the search: the no-fault terrain limit moves from 12-15 to about 24 degrees (level 2), and the new edge cases change IDs."}
      - {key: level-2-start, title: Start level 2 in level 1's old state, detail: "The models would agree by sharing an initial state the gait never reaches; the 12-15 degree finding would stay an artefact."}
      - {key: keep, title: Keep both and document the disagreement, detail: "No re-run, but CF4 and the slope limit keep resting on a start-up transient."}
    recommendation: periodic-orbit
    reversibility: easy
    blocks: [HAZ-WLK-002 CF4 simulation basis, CONOPS section 4 slope limit]
    gate: G2
    decider: claude
    status: applied
    asked: null
    answer: {choice: periodic-orbit, by: claude, at: 2026-11-12, via: chat, note: "lead asked to resolve the EC-07 and EC-08 model disagreement; the slope limit itself stays with the lead (HAZ-WLK-002 open action)"}
    applied_in: [sim/plant/walker.py, sim/mujoco/l2.py, sim/results/search-SF-01.md, sim/results/l2-crosscheck.md, safety/hazards/HAZ-WLK-002.yaml]
    sources: [sim/results/l2-crosscheck.md, sim/results/plant-results.md]

  - id: DQ-010
    question: What slope limit should CONOPS section 4 set for the walker?
    context: >-
      Under SPEC-WLK-001 assumptions the no-fault gait holds to 20 degrees at both model levels and **tips from about
      24 degrees at level 2** (27 at level 1; sim/results/l2-crosscheck.md, NOM-20 and NOM-25). The failure search
      covered only 0-15 degrees.
    options:
      - {key: "20", title: 20 degrees, detail: "About 4 degrees below the level-2 no-fault tip; the failure search is widened to 20 degrees."}
      - {key: "15", title: 15 degrees, detail: "More margin; less terrain."}
    recommendation: "20"
    reversibility: easy
    blocks: [HAZ-WLK-002 slope-limit action, SYS-008 envelope]
    gate: G2
    decider: lead
    status: applied
    asked: null
    answer: {choice: "20", by: lead, at: 2026-11-12, via: chat, note: "set the slope limit to 20 degrees"}
    applied_in: [concept/CONOPS.md, architecture/item-definition.yaml, requirements/SYS-008.yaml, safety/hazards/HAZ-WLK-002.yaml, sim/search/families.yaml]
    sources: [sim/results/l2-crosscheck.md, sim/results/plant-results.md]

  - id: DQ-011
    question: How far may payload and gait move the walker's centre of mass ahead of the stance foot when it is on a 20 degree slope?
    context: >-
      With the 20 degree slope limit (DQ-010) the failure search now covers 0-20 degrees and finds the walker **tipping
      with no fault at 19-20 degrees when the CoM sits 0.24-0.26 m ahead of the foot** (SF-01 EC-04, EC-05, EC-08).
      The no-fault gait holds a CoM offset of up to 0.165 m at 20 degrees at level 2 (0.226 m at level 1), 0.20 m at
      18 degrees and 0.25 m at 15 degrees; the nominal gait uses 0.10 m. The search samples offsets up to 0.30 m.
    options:
      - {key: offset-012, title: "Keep 20 degrees and limit the CoM offset to 0.12 m", detail: "0.045 m below the level-2 no-fault limit at 20 degrees; payload placement and gait must stay inside it (SYS-008, HAZ-WLK-002 M3). The search space is narrowed to 0-0.12 m."}
      - {key: sliding, title: Limit the CoM offset by slope, detail: "0.20 m up to 15 degrees, 0.12 m at 20 degrees; more usable payload, but the limit becomes a table the envelope protection must enforce."}
      - {key: slope-15, title: Lower the slope limit to 15 degrees, detail: "Keeps offsets up to 0.20 m usable with margin; less terrain. Reopens DQ-010."}
    recommendation: offset-012
    reversibility: easy
    blocks: [SYS-008 envelope, HAZ-WLK-002 M3, failure-search space for SF-01]
    gate: G2
    decider: lead
    status: applied
    asked: 2026-11-12
    answer: {choice: offset-012, by: lead, at: 2026-11-12, via: chat, note: "cap the CoM offset at 0.12 m"}
    applied_in: [concept/CONOPS.md, architecture/item-definition.yaml, models/sysml/model/Architecture.sysml, requirements/SYS-008.yaml, safety/hazards/HAZ-WLK-002.yaml, sim/search/families.yaml]
    sources: [sim/results/search-SF-01.md, sim/results/l2-crosscheck.md, safety/hazards/HAZ-WLK-002.yaml]

  - id: DQ-012
    question: Should the level-2 walker spec adopt the ankle and knee torques sized against supply loss?
    context: >-
      Sizing SZ-01 (sim/results/sizing-cf4.md) finds **the assumed 20 kN m ankle leaves four tips at the envelope corner
      (20 degrees, 0.12 m) under a slow supply leak; 24 kN m clears it**. The draft proposal is ankle 26.5 kN m
      (1.5 m g L_foot) and knee 22.5 kN m (the assumed 60 kN m knee is far above what CF4 needs), drafted as SYS-016.
    options:
      - {key: adopt, title: Adopt the sized values in sim/spec/walker_l2.yaml, detail: "Level 2 then models a walker that meets SYS-016; the cross-check and sizing are re-run. The actuation trade still has to confirm a real actuator."}
      - {key: keep, title: Keep the assumed values until the actuation trade closes, detail: "No change; the level-2 results keep showing the four corner tips."}
    recommendation: adopt
    reversibility: easy
    blocks: [level-2 walker spec, SYS-016]
    gate: G2
    decider: lead
    status: applied
    asked: null
    answer: {choice: adopt, by: lead, at: 2026-11-12, via: chat, note: "adopt the sized ankle and knee torques in the spec"}
    applied_in: [sim/spec/walker_l2.yaml, sim/results/l2-crosscheck.md, sim/results/sizing-cf4.md, safety/hazards/HAZ-WLK-002.yaml]
    sources: [sim/results/sizing-cf4.md, requirements/SYS-016.yaml]

