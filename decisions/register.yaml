  - id: DQ-015
    question: May the walker carry a payload while walking?
    context: >-
      An arm-stow interlock for walking (SYS-017) would rule out carrying while walking, and the scenarios keep travel
      (SCN-002) and payload handling (SCN-003) apart. **One concept-art image shows CL-05 walking with a pallet in its
      claws.** Carrying while walking adds load swing, stability under load and a load dropped on the move.
    options:
      - {key: no-carry, title: No carrying while walking, detail: "Arms stowed and locked to walk; loads handled only at a standstill. Simplest and safest; easy to relax later."}
      - {key: conditional, title: Allow carrying while walking under conditions, detail: "Arms locked in a carry pose, payload limits and reduced speed; needs a new hazard, a loaded-walking requirement and a different interlock."}
      - {key: open, title: Leave it open, detail: "Stays TBD until a trade study."}
    recommendation: no-carry
    reversibility: easy
    blocks: [SYS-017 interlock, SYS-019, HAZ-MAN-002]
    gate: G2
    decider: lead
    status: applied
    asked: 2026-11-12
    answer: {choice: conditional, by: lead, at: 2026-11-12, via: chat, note: "2"}
    applied_in: [requirements/SYS-017.yaml, requirements/SYS-019.yaml, safety/hazards/HAZ-MAN-002.yaml, safety/hazards/HAZ-WLK-002.yaml, cad/README.md]
    sources: [cad/README.md, cad/concept-art/README.md]

  - id: DQ-016
    question: How should the actuation trade study (TS-001) weigh its twelve criteria?
    context: >-
      TS-001 compares centralised hydraulic, series-hybrid with electrohydraulic joints, and series-hybrid with
      electromechanical joints (architecture/trades/TS-001.yaml). **The weights decide the ranking once evidence is
      scored**, and choosing them is a value judgement for the decision authority. The draft gives the four
      safety-related criteria (controllability, leakage and fire, stored energy, fault response) 45 of 100 points,
      with fault response highest at 15; cost and power density get 10 each.
    options:
      - {key: draft, title: Confirm the drafted weights, detail: "Safety-related criteria 45 points, fault response 15, cost 10. Scoring can start as evidence arrives."}
      - {key: equal, title: Weigh every criterion equally (8.33 each), detail: "No judgement built in; safety criteria count for a third, and noise counts as much as fault response."}
      - {key: lead, title: Give your own weights, detail: "Tell Claude the weights in chat; they replace the draft."}
    recommendation: draft
    reversibility: easy
    blocks: [TS-001 scoring]
    gate: G2
    decider: lead
    status: applied
    asked: 2026-11-12
    answer: {choice: draft, by: lead, at: 2026-11-12, via: chat, note: "confirm the drafted weights"}
    applied_in: [architecture/trades/TS-001.yaml]
    sources: [architecture/trades/TS-001.yaml, concept/trade-studies.md]

  - id: DQ-017
    question: Should a hazard tied to specific hardware stop applying to test events that do not contain that hardware?
    context: >-
      Rule R06 decided which hazards apply to an event from its configuration, modes and subsystems only. **The
      battery and fuel hazards (tagged SUS-M1-PWR-BAT and SUS-M1-PWR-GEN) therefore applied to the hydraulic bench
      rig EVT-BENCH-001, which has neither**, and each needed an event risk and an acceptance. Probability F is not
      available for them (rule R02).
    options:
      - {key: hardware, title: Honour the hardware tag, detail: "Events list the hardware present; a hazard tagged with hardware applies only where that hardware is listed. An event that lists none keeps every hazard (conservative)."}
      - {key: keep, title: Keep the rule as it is, detail: "Absent hazards stay at probability E and each still needs an acceptance."}
    recommendation: hardware
    reversibility: easy
    blocks: [EVT-BENCH-001 event risk]
    gate: G4
    decider: lead
    status: applied
    asked: 2026-11-12
    answer: {choice: hardware, by: lead, at: 2026-11-12, via: chat, note: "yes, check the hardware tag"}
    applied_in: [tools/pdac/rules.py, tools/pdac/rules_ext.py, pdac/schemas/event.schema.json, safety/events/EVT-BENCH-001.yaml, safety/hazards/HAZ-PWR-002.yaml, safety/hazards/HAZ-PWR-003.yaml, tools/pdac/README.md]
    sources: [safety/events/EVT-BENCH-001.yaml, tools/pdac/rules.py]

  - id: DQ-018
    question: Should the manipulator-arm hazards be tied to the arms, so they stop applying to events without arms?
    context: >-
      After DQ-017 a hazard tagged with hardware applies only to events that contain it. **HAZ-MAN-001 (person struck
      by the arms) and HAZ-MAN-002 (carried load) carried no hardware tag, so they still applied to the bench rig
      EVT-BENCH-001, which has no arms.** Tagging them with SUS-M1-MAN narrows where they apply; it does not change
      their risk on the walker.
    options:
      - {key: tag, title: Tag both with SUS-M1-MAN, detail: "They drop out of events without arms; every event with arms, or that lists no hardware, keeps them."}
      - {key: keep, title: Leave them untagged, detail: "They stay on the bench rig at probability E and each needs an acceptance."}
    recommendation: tag
    reversibility: easy
    blocks: [EVT-BENCH-001 event risk]
    gate: G4
    decider: lead
    status: applied
    asked: 2026-11-12
    answer: {choice: tag, by: lead, at: 2026-11-12, via: chat, note: "yes, tag the arm hazards with SUS-M1-MAN"}
    applied_in: [safety/hazards/HAZ-MAN-001.yaml, safety/hazards/HAZ-MAN-002.yaml]
    sources: [safety/events/EVT-BENCH-001.yaml, decisions/register.yaml]

  - id: DQ-019
    question: How should the six hazards raised from the FHA gaps be rated?
    context: >-
      HAZ-PIL-004, HAZ-INT-002, HAZ-INT-003, HAZ-DCK-003, HAZ-DCK-004 and HAZ-DCK-005 came from the FHA with AI-drafted
