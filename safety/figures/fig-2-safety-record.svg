<text x="40" y="853.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: DoD = US Department of Defense · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · R01 … = validator rule in tools/pdac (R13 = only a</text>
