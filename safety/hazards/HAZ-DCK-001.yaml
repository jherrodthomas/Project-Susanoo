  software: []
hazardous_condition: UAV motors spin up while the aircraft is mechanically retained or while a maintainer or pilot
  is within rotor reach.
modes:
- MOD-06
- MOD-10
causal_factors:
- id: CF1
  type: software
  description: Arming check or dock interlock permits arming while retained
