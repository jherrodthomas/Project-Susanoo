schema: susanoo/hazard/v0.2
id: HAZ-PIL-002
title: Uncontrolled vertical drop of the cockpit on loss of leg support
status: open
system: SUS-I1
subsystems:
- SUS-M1-PIL
- SUS-M1-WLK
- SUS-M1-PWR
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: Leg support force is lost faster than load holding can engage (supply burst with failed or slow
  load-holding valves or brakes), so the cockpit falls freely to its rest height with the pilot aboard and no
  protective stop under way.
modes:
- MOD-04
- MOD-05
- MOD-09
causal_factors:
- id: CF1
  type: hardware
  description: Loss of actuator supply (hydraulic line burst or bus loss) together with load-holding valves or brakes
    that fail to engage (latent failure)
- id: CF2
  type: hardware
  description: Load holding engages, but slower than the cockpit falls from operating height (engagement delay longer
    than the free-fall time)
effects:
- Cockpit strikes its rest stops at about 4.8 m/s after a 1.2 m fall (simulation SF-01 EC-01, synthetic)
mishap: Spinal compression, head or neck injury to the restrained pilot
initial_risk:
  severity: 2
  probability: C
  rac: 2C
  risk_level: Serious
  rationale: Preliminary, drafted from failure search SF-01 edge cases EC-01 to EC-05 (synthetic, no evidence credit). A drop of about
    1.2 m onto rest stops can cause permanent partial disability; supply loss is credible over the item life and
    nothing yet prevents the fall.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 2
  probability: E
  rac: 2E
  risk_level: Medium
  rationale: Preliminary; fail-safe load holding that needs no signal or supply to engage, plus an energy-absorbing
    seat, makes the uncontrolled drop improbable.
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Select self-locking (non-backdrivable) joint actuation in the actuation trade, so loss of supply cannot
    lower the structure (TS-001, decision DQ-006)
  precedence: a
  state: identified
  verification:
    method:
    - analysis
    - test
    evidence_ids: []
- id: M2
  description: Normally-engaged load holding (spring-applied, supply-released valves or brakes), so loss of supply engages
    it without any signal
  precedence: b
  state: identified
  requirement_ids:
  - SYS-009
  verification:
    method:
    - test
    - inspection
    evidence_ids: []
- id: M3
  description: Load-holding engagement time verified shorter than the free-fall time from the highest operating posture
  precedence: c
  state: identified
  requirement_ids:
  - SYS-009
  verification:
    method:
    - test
    - analysis
    evidence_ids: []
- id: M4
  description: Energy-absorbing seat and cockpit suspension sized for the residual drop
  precedence: c
  state: identified
  verification:
    method:
    - analysis
    - test
    evidence_ids: []
requirement_ids:
- SYS-009
owner:
  role: ROLE-WLK
  person: null
  org: Walker / mechanical
reviewer: null
acceptances: []
reassessments: []
source:
  task: 202
  scenario_ids:
  - SCN-102
  - SCN-103
  documents:
  - sim/results/search-SF-01.md
  - sim/results/plant-results.md
hazmat: not-applicable
assumptions:
- Concept configuration SUS-I1-C001; no hardware design selected
- Drop height and speed come from the reduced-order plant (sim/plant/walker.py); they rank the risk, they are not evidence
- The level-2 MuJoCo model reproduces the drop in every cross-checked case (about 4.1 m/s against 4.8 m/s at level 1;
  sim/results/l2-crosscheck.md); still synthetic
open_actions:
- Set the engagement time and holding load in SYS-009 once the actuation trade closes (Task 203)
- Set the injurious vertical impact speed in the Health Hazard Analysis (Task 207); the simulation uses a 1.0 m/s placeholder
- Confirm severity and probability in PHA (Task 202) at G2
