schema: susanoo/hazard/v0.2
id: HAZ-PIL-001
title: Unintended leg motion during pilot ingress or egress
status: open
system: SUS-I1
subsystems:
- SUS-M1-PIL
- SUS-M1-WLK
- SUS-M1-SAF
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: Leg or chassis actuators move while the pilot or ground crew is in the ingress path or partially
  restrained.
modes:
- MOD-02
- MOD-03
- MOD-10
causal_factors:
- id: CF1
  type: software
  description: Motion-enable logic enables actuation before readiness conditions are met
  ssf_ids:
  - SSF-001
- id: CF2
  type: hardware
  description: Valve or drive fault produces motion with enable removed
- id: CF3
  type: human
  description: Pilot inadvertently deflects a control while entering
effects:
- Pilot or crew caught between moving leg/chassis structure
mishap: Crush or fall injury to pilot or ground crew during ingress/egress
initial_risk:
  severity: 1
  probability: C
  rac: 1C
  risk_level: High
  rationale: Preliminary qualitative judgement at concept stage (no design); crush between multi-tonne structure
    can be fatal; ingress occurs every sortie.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design); independent hardware enable chain plus
    supported posture make occurrence improbable.
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Mechanical supports carry the chassis in OFF/SECURED and STARTUP so actuator motion cannot lower
    the structure
  precedence: b
  state: identified
  verification:
    method:
    - inspection
    - demonstration
    evidence_ids: []
- id: M2
  description: 'Readiness interlock: actuation enabled only with restraint, hatch, neutral controls and exclusion-zone
    confirmation'
  precedence: c
  state: identified
  requirement_ids:
  - SYS-001
  ssf_ids:
  - SSF-001
  verification:
    method:
    - test
    evidence_ids: []
- id: M3
  description: Independent hardware enable chain in series with the software interlock
  precedence: c
  state: identified
  requirement_ids:
  - SYS-001
  verification:
    method:
    - test
    - analysis
    evidence_ids: []
- id: M4
  description: Ingress procedure with observer and exclusion zone
  precedence: e
  state: identified
  verification:
    method:
    - demonstration
    evidence_ids: []
- id: M5
  description: 'Ingress and egress from a controlled lowered (kneel) posture with a fold-down ladder and grab handles,
    the ladder interlocked against walking (CL-05: cockpit floor from 2.41 m to about 1.0 m, four treads, largest
