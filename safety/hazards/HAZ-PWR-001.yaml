hazardous_condition: Stored hydraulic pressure remains in actuators or accumulators when a maintainer opens a line
  or works in a crush zone.
modes:
- MOD-01
- MOD-10
causal_factors:
- id: CF1
  type: hardware
  description: Accumulator or trapped volume not vented by isolation
- id: CF2
  type: human
  description: Maintainer skips isolation or verification step
effects:
- Sudden limb movement; high-pressure fluid release
mishap: Crush or fluid-injection injury to maintainer
initial_risk:
  severity: 1
  probability: D
  rac: 1D
  risk_level: Serious
  rationale: Preliminary qualitative judgement at concept stage (no design); hydraulic injection and crush injuries
    can be fatal; maintenance is periodic.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design); lockable isolation with gauge-verified
    zero energy and mechanical supports.
  definitions: SUS-RISKDEF-001
event_risks: []
