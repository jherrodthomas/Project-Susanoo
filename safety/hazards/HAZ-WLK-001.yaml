schema: susanoo/hazard/v0.2
id: HAZ-WLK-001
title: Stale or lost feedback causes runaway motion
status: open
system: SUS-I1
subsystems:
- SUS-M1-WLK
- SUS-M1-SAF
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: Actuator or posture feedback is lost, frozen or delayed and closed-loop control drives a joint
  beyond its intended motion.
modes:
- MOD-04
- MOD-05
causal_factors:
- id: CF1
  type: hardware
  description: Sensor, connector or bus failure
- id: CF2
  type: software
  description: Monitor fails to detect stale data or detection is too slow
  ssf_ids:
  - SSF-004
- id: CF3
  type: software
  description: Locomotion controller acts on stale state
  ssf_ids:
  - SSF-007
effects:
- Joint runaway, loss of balance
mishap: Walker fall or limb strike injuring pilot or bystanders
initial_risk:
  severity: 1
  probability: C
  rac: 1C
  risk_level: High
  rationale: Preliminary qualitative judgement at concept stage (no design); feedback loss is a common failure class;
    consequence includes fall with pilot.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design); redundant sensing, staleness monitor
    and mechanical joint limits.
  definitions: SUS-RISKDEF-001
event_risks:
- event_id: EVT-BENCH-001
  configuration: SUS-I1-C001
  severity: 1
  probability: D
  rac: 1D
  risk_level: Serious
  rationale: "Preliminary event risk (AI draft, I0), not accepted. EVT-BENCH-001 is one leg on a rigid support frame driven
    by a hydraulic power unit, test crew in the room, no pilot, cockpit, arms, battery or engine. Feedback-monitor
    characterisation means feedback faults will be injected, so runaway motion is an expected test condition
    rather than a rare failure. Assumes mechanical end-stops and pressure relief on the rig, crew outside the
    guarded envelope and fault injection only from outside it. Without them, C."
  definitions: SUS-RISKDEF-001
mitigations:
- id: M1
  description: Mechanical joint end-stops and pressure relief limit runaway travel and force
