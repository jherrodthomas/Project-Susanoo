schema: susanoo/hazard/v0.2
id: HAZ-INT-003
title: Pilot acts on stale or frozen UAV imagery
status: open
system: SUS-I1
subsystems:
- SUS-A1
- SUS-I1-INT
- SUS-M1-PIL
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: UAV imagery or telemetry stops updating or arrives late, but the display keeps showing the last
  picture as if it were current.
modes:
- MOD-04
- MOD-07
causal_factors:
- id: CF1
  type: interface
  description: Link latency, dropped frames or a frozen video stream on the integration link
- id: CF2
  type: human
  description: Pilot does not notice that the picture is not updating
effects:
- Pilot acts on an out-of-date picture of people and obstacles
mishap: Person who moved into the walker's path after the picture froze is struck or stepped on
initial_risk:
  severity: 1
  probability: D
  rac: 1D
  risk_level: Serious
  rationale: Preliminary qualitative judgement at concept stage (no design; AI-drafted, I0, for the safety lead to
    rate); people near the walker move faster than a frozen picture reveals; imagery is secondary to direct view
    and the observer
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design; AI-drafted, I0, for the safety lead to
    rate); staleness detection with a clear stale-data indication, and procedures that keep direct view primary
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Stale or frozen imagery detected within a defined time and shown as not current
  precedence: c
  state: identified
  verification:
    method:
    - test
    evidence_ids: []
  requirement_ids:
  - SYS-021
- id: M2
  description: 'Procedure: UAV imagery is advisory; walking decisions rest on direct view and the safety observer'
  precedence: e
  state: identified
  verification:
    method:
    - demonstration
    evidence_ids: []
requirement_ids:
- SYS-021
owner:
  role: ROLE-UAV
  person: null
  org: Air vehicle
reviewer: null
acceptances: []
reassessments: []
source:
  task: 208
  scenario_ids:
  - SCN-105
  documents:
  - safety/mil-std-882e/02-hazard-identification/task-208-functional-hazard-analysis/fha.yaml
hazmat: not-applicable
assumptions:
- Concept configuration SUS-I1-C001; raised from the FHA gap row F-06 untimely (AI-drafted, I0)
- UAV flight functions are classified in the ARP4761A aircraft FHA; this record covers the walker-side consequence
  only
open_actions:
