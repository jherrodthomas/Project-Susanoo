schema: susanoo/hazard/v0.2
id: HAZ-DCK-004
title: Exposure to energised dock charging contacts
status: open
system: SUS-I1
subsystems:
- SUS-M1-DCK
- SUS-A1
- SUS-I1-INT
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: 'The dock charging circuit is energised when it should not be: when the UAV is released or launched,
  so the connector separates under load, or while a maintainer or the pilot handles the UAV or the dock.'
modes:
- MOD-06
- MOD-08
- MOD-10
causal_factors:
- id: CF1
  type: interface
  description: Launch or release permit does not require charging to be off
- id: CF2
  type: hardware
  description: Charge contactor welded or slow to open
- id: CF3
  type: human
  description: Maintainer handles the UAV or connector without isolating charging
- id: CF4
  type: hardware
  description: Exposed or damaged contacts on the dock or UAV
effects:
- Arcing at the connector on separation; damage to the dock or the UAV
- Contact with energised charging contacts
mishap: Electric shock or burn to a maintainer, the pilot or crew near the dock; equipment damage
initial_risk:
  severity: 3
  probability: C
  rac: 3C
  risk_level: Medium
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): hundreds of launches with
    only a procedure to stop charging first; arcing, minor injury and dock or UAV damage in the $1,000-$10,000 band
    (DQ-002); equally, frequent handling at the dock with contacts not yet designed (DQ-020).'
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 3
  probability: D
  rac: 3D
  risk_level: Medium
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): launch and release permits
    that require charging confirmed off.'
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Launch and release permits require charging de-energised and confirmed off
  precedence: c
  state: identified
  requirement_ids:
  - SYS-006
  verification:
    method:
    - test
    evidence_ids: []
- id: M2
  description: Connector rated to break under load, or mechanically prevented from separating while energised
  precedence: b
  state: identified
  verification:
    method:
    - analysis
    evidence_ids: []
- id: M3
  description: Contacts shrouded and de-energised unless a UAV is seated and confirmed
  precedence: b
  state: identified
  requirement_ids:
  - SYS-022
  verification:
    method:
    - inspection
    - test
    evidence_ids: []
- id: M4
  description: Charging isolated before any handling at the dock (maintenance procedure)
  precedence: e
  state: identified
  verification:
    method:
    - demonstration
    evidence_ids: []
requirement_ids:
- SYS-006
- SYS-022
owner:
  role: ROLE-UAV
  person: null
  org: Air vehicle
reviewer: null
acceptances: []
reassessments: []
source:
  task: 208
  scenario_ids:
  - SCN-004
  - SCN-005
  documents:
  - safety/mil-std-882e/02-hazard-identification/task-208-functional-hazard-analysis/fha.yaml
hazmat: not-applicable
assumptions:
- Concept configuration SUS-I1-C001; raised from the FHA gap rows F-08 untimely and F-08 unintended (AI-drafted,
  I0)
- Charging voltage and current are TBD until the UAV battery and dock are selected
- 'Merged by the project lead''s decision DQ-020 (2026-11-13): HAZ-DCK-005 (electrical exposure while charging with
  a person present) folded in. Both had initial 3C Medium (DQ-019); the merged target keeps the weaker of the two
  targets, 3D (DCK-005 alone had 3E), so no rating is lowered'
open_actions:
- Confirm severity and probability in PHA (Task 202) at G2
- Re-rate severity once the charging voltage is known
- Confirm whether SYS-006 (launch and recovery envelope inhibit) should name charging state explicitly
