schema: susanoo/hazard/v0.2
id: HAZ-PIL-004
title: Normal egress blocked when the walker cannot lower
status: open
system: SUS-I1
subsystems:
- SUS-M1-WLK
- SUS-M1-PIL
- SUS-M1-SAF
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: The walker cannot reach the lowered (kneel) posture, so the front-opening egress is not available
  when the pilot must leave.
modes:
- MOD-03
- MOD-09
causal_factors:
- id: CF1
  type: hardware
  description: Leg actuator, supply or load-holding fault prevents lowering
- id: CF2
  type: software
  description: Lowering inhibited by a fault response or a stuck interlock
  ssf_ids:
  - SSF-002
- id: CF3
  type: environment
  description: Terrain or slope does not allow the kneel posture
effects:
- Pilot remains at height; leaving needs the side-hatch emergency exit
mishap: Pilot trapped during a fire, medical emergency or other event that needs prompt egress; or injured by an
  improvised descent
initial_risk:
  severity: 1
  probability: D
  rac: 1D
  risk_level: Serious
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): being trapped is fatal only
    together with another emergency such as a fire, so the mishap needs a lowering failure and an emergency at once.'
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): an emergency exit that needs
    neither power nor kneeling, plus annunciated lowering faults, adds an independent way out.'
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Emergency exit through a side hatch that needs neither platform power nor the kneel posture (CL-05
    side hatches)
  precedence: b
  state: identified
  requirement_ids:
  - SYS-020
  verification:
    method:
    - analysis
    - demonstration
    evidence_ids: []
- id: M2
  description: Lowered posture with defined lowering limits and a confirmed clear zone
  precedence: c
  state: identified
  requirement_ids:
