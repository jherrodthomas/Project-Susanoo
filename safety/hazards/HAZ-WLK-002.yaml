assumptions:
- Concept configuration SUS-I1-C001; no hardware design selected
- 'Simulation basis for CF4 and the slope limit: level 1 starts each case on its balance loop''s periodic orbit
  (walker assumption A8). The earlier start on the sway reference put the capture point at the foot edge at t = 0
  and produced no-fault tips at 12-15 degrees that level 2 did not reproduce; with both models started in the same
  state they agree on the SF-01 edge cases inside the envelope except EC-07 and EC-08, each explained in
  sim/results/l2-crosscheck.md'
- 'Simulated mass and geometry are the reference layout''s (CL-05, cad/metrics.json, decision DQ-023): 4,590 kg,
  centre of mass 2.72 m, hips 2.34 m, 1.49 m kneeling; placeholder geometry, not a design. Level 2 takes each
  link''s mass, centre of mass and pitch inertia from CL-05 (cad/links.json): torso 3,474 kg and 2,452 kg m^2, each
  leg 558 kg; it still has forward-bending knees and the torso centre of mass over the hips'
- 'Envelope: slope limit 20 degrees with the CoM no more than 0.12 m ahead of the stance foot (CONOPS section 4,
  lead decisions DQ-010 and DQ-011); the failure search covers this envelope and finds no tip without a fault'
- 'Reference layout CL-05 (cad/README.md, decision DQ-014): reverse-jointed legs with the knees behind the hips and
  the centre of gravity 0.33 m behind the ankles, so a backward fall puts the knees first; heel spurs give a standstill
  static margin of 0.38 m standing and 0.35 m kneeling on placeholder mass'
open_actions:
- Confirm severity and probability in PHA (Task 202) at G2
- 'Confirm the SYS-016 torque reserve in the actuation trade (TS-001, DQ-006): the level-2 spec holds ankle 40.5 and
  knee 26.5 kN m, re-sized for the 4,590 kg reference layout (DQ-023) and adopted by the lead (DQ-024). With the CL-05 link inertias the lowest clearing knee torque is 20 kN m, so the knee reserve is 1.33 rather than 1.5 times it; a real actuator must show that torque falls no faster than supply down
  to the load-holding threshold (sim/results/sizing-cf4.md)'
- Derive a safety requirement for margin-based load holding (M5) (Task 203)
- 'Check carried loads against the 0.12 m CoM offset cap: on placeholder CL-05 mass (4,590 kg) and flat ground, a
  load at the carry pose centre (1.15 m ahead of the ankles) brings the combined CoM 0.12 m ahead of the ankles at
  about 2,000 kg; indicative only, to be replaced by the dynamic analysis on a 20 degree slope (SYS-019)'

