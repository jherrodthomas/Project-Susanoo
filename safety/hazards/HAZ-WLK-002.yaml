open_actions:
- Confirm severity and probability in PHA (Task 202) at G2
- 'Set the CONOPS section 4 slope limit with margin: under SPEC-WLK-001 assumptions the no-fault gait tips between 12
  and 15 degrees (failure search SF-01, edge cases EC-05 and EC-07)'
- Derive a safety requirement for margin-based load holding (M5) (Task 203)
- 'Resolve the model disagreement before relying on CF4 or the slope limit: the level-2 MuJoCo cross-check
  (sim/results/l2-crosscheck.md) does not reproduce the EC-07 and EC-08 tips or the no-fault tips at 12-15 degrees'

