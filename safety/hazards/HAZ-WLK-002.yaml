schema: susanoo/hazard/v0.2
id: HAZ-WLK-002
title: Walker tip-over or fall with pilot aboard
status: open
system: SUS-I1
subsystems:
- SUS-M1-WLK
- SUS-M1-PIL
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: The walker leaves its stability envelope on slope, uneven terrain or with an offset payload
  and falls or overturns.
modes:
- MOD-04
- MOD-05
- MOD-09
causal_factors:
- id: CF1
  type: software
  description: Balance controller fails to recover or commands an unstable gait
  ssf_ids:
  - SSF-007
- id: CF2
  type: environment
  description: Terrain gives way or slope exceeds envelope
- id: CF3
  type: human
  description: Pilot commands manoeuvre or payload beyond limits
- id: CF4
  type: hardware
  description: Loss of actuator supply (hydraulic pressure or bus voltage) shrinks the balance capacity before load
    holding engages; a slow leak on a slope tips the walker, and a hold that engages with the capture point outside
    the foot tips it too (simulation SF-01 EC-07 and EC-08 at level 1; at level 2 EC-07 drops the cockpit instead and
    EC-08 holds; with the torques re-sized for the 4,590 kg reference layout (DQ-024) level 2 keeps every envelope case
    safe while load holding works, TS-001-E01; sizing SZ-01; synthetic)
effects:
- Overturn or fall of the platform
mishap: Pilot fatal or disabling injury in fall; crush of bystanders
initial_risk:
  severity: 1
  probability: C
  rac: 1C
  risk_level: High
  rationale: Preliminary qualitative judgement at concept stage (no design); legged platforms have frequent balance-loss
    events during development.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design); envelope limiting, rollover protection
    and restraint.
  definitions: SUS-RISKDEF-001
event_risks:
- event_id: EVT-BENCH-001
  configuration: SUS-I1-C001
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: "Preliminary event risk (AI draft, I0), not accepted. EVT-BENCH-001 is one leg on a rigid support frame driven
    by a hydraulic power unit, test crew in the room, no pilot, cockpit, arms, battery or engine. No pilot, and
    the leg is held by a rigid frame, so the walker cannot tip over. The residual is the frame or its anchors
    failing under dynamic leg loads; assumes the frame is designed and proof-loaded for the maximum actuator
    force."
  definitions: SUS-RISKDEF-001
mitigations:
- id: M1
  description: Low centre of gravity and wide stance selected in the architecture trade
  precedence: b
  state: identified
  verification:
