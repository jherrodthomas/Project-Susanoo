  - concept/CONOPS.md
  - sim/results/search-SF-01.md
hazmat: not-applicable
assumptions:
- Concept configuration SUS-I1-C001; no hardware design selected
- 'Simulation basis for CF4 and the slope limit: level 1 starts each case on its balance loop''s periodic orbit
  (walker assumption A8). The earlier start on the sway reference put the capture point at the foot edge at t = 0
  and produced no-fault tips at 12-15 degrees that level 2 did not reproduce; with both models started in the same
  state they agree on the SF-01 edge cases except EC-07, which sits on the actuator-capacity boundary
  (sim/results/l2-crosscheck.md)'
- Slope limit 20 degrees (CONOPS section 4, lead decision DQ-010); the failure search covers 0-20 degrees
open_actions:
- Confirm severity and probability in PHA (Task 202) at G2
- 'Set the CoM offset allowed at the 20 degree slope limit (decision DQ-011): the no-fault gait tips at 19-20 degrees
  with the CoM 0.24-0.26 m ahead of the foot (failure search SF-01, EC-04, EC-05 and EC-08) and holds up to 0.165 m
  at 20 degrees at level 2'
- 'Size ankle torque and leg force against CF4: at 16 degrees a slow leak tips the walker at level 2 when the ankle
  torque is no more than m g L cos(slope), and holds with 20 kN m (SF-01 EC-07, sim/results/l2-crosscheck.md)'
- Derive a safety requirement for margin-based load holding (M5) (Task 203)

