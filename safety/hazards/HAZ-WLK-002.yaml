    - test
    evidence_ids: []
- id: M3
  description: Command and payload limiting to a verified stability envelope
  precedence: c
  state: identified
  requirement_ids:
  - SYS-008
  ssf_ids:
  - SSF-007
  verification:
    method:
    - test
    - analysis
    evidence_ids: []
- id: M4
