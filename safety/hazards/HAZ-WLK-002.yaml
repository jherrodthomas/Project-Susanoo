schema: susanoo/hazard/v0.2
id: HAZ-WLK-002
title: Walker tip-over or fall with pilot aboard
status: open
system: SUS-I1
subsystems:
- SUS-M1-WLK
- SUS-M1-PIL
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: The walker leaves its stability envelope on slope, uneven terrain or with an offset payload
  and falls or overturns.
modes:
- MOD-04
- MOD-05
- MOD-09
causal_factors:
- id: CF1
  type: software
  description: Balance controller fails to recover or commands an unstable gait
  ssf_ids:
  - SSF-007
- id: CF2
  type: environment
  description: Terrain gives way or slope exceeds envelope
- id: CF3
  type: human
  description: Pilot commands manoeuvre or payload beyond limits
- id: CF4
  type: hardware
  description: Loss of actuator supply (hydraulic pressure or bus voltage) shrinks the balance capacity before load
    holding engages; a slow leak on a slope tips the walker, and a hold that engages with the capture point outside
    the foot tips it too (simulation SF-01 EC-07 and EC-08 at level 1; at level 2 with the adopted torques EC-07 drops
    the cockpit instead and EC-08 tips only with the ankle at or below about 12 kN m; sizing SZ-01; synthetic)
effects:
- Overturn or fall of the platform
mishap: Pilot fatal or disabling injury in fall; crush of bystanders
initial_risk:
  severity: 1
  probability: C
  rac: 1C
  risk_level: High
  rationale: Preliminary qualitative judgement at concept stage (no design); legged platforms have frequent balance-loss
    events during development.
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 1
  probability: E
  rac: 1E
  risk_level: Medium
  rationale: Preliminary qualitative judgement at concept stage (no design); envelope limiting, rollover protection
    and restraint.
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Low centre of gravity and wide stance selected in the architecture trade
  precedence: b
  state: identified
  verification:
    method:
    - analysis
    evidence_ids: []
- id: M2
  description: Rollover/fall protective structure and restraint at the pilot station
  precedence: c
  state: identified
  requirement_ids:
  - SYS-008
  verification:
    method:
    - analysis
    - test
    evidence_ids: []
- id: M3
  description: Command and payload limiting to a verified stability envelope
  precedence: c
  state: identified
  requirement_ids:
  - SYS-008
  ssf_ids:
  - SSF-007
  verification:
    method:
    - test
    - analysis
    evidence_ids: []
- id: M4
  description: Stability margin warning to the pilot
  precedence: d
  state: identified
  requirement_ids:
  - SYS-008
  verification:
    method:
    - test
    evidence_ids: []
- id: M5
  description: Start the protective crouch and engage load holding on falling balance margin (capture point against the
    support still available), not only on a supply-pressure threshold, and only in a statically stable posture
  precedence: c
  state: identified
  verification:
    method:
    - test
    - analysis
    evidence_ids: []
- id: M6
  description: Size ankle and knee torque so that the balance capacity left as supply falls holds the walker until load
    holding engages, anywhere in the operating envelope (sizing SZ-01)
  precedence: b
  state: identified
  requirement_ids:
  - SYS-016
  verification:
    method:
    - analysis
    - test
    evidence_ids: []
requirement_ids:
- SYS-008
- SYS-016
owner:
  role: ROLE-WLK
  person: null
  org: Walker / mechanical
reviewer: null
acceptances: []
reassessments: []
source:
  task: 201
  scenario_ids:
  - SCN-002
  - SCN-003
  - SCN-103
  documents:
  - concept/CONOPS.md
  - sim/results/search-SF-01.md
hazmat: not-applicable
assumptions:
- Concept configuration SUS-I1-C001; no hardware design selected
- 'Simulation basis for CF4 and the slope limit: level 1 starts each case on its balance loop''s periodic orbit
  (walker assumption A8). The earlier start on the sway reference put the capture point at the foot edge at t = 0
  and produced no-fault tips at 12-15 degrees that level 2 did not reproduce; with both models started in the same
  state they agree on the SF-01 edge cases inside the envelope except EC-08, which sits on the actuator-capacity
  boundary (sim/results/l2-crosscheck.md, sim/results/sizing-cf4.md)'
- 'Envelope: slope limit 20 degrees with the CoM no more than 0.12 m ahead of the stance foot (CONOPS section 4,
  lead decisions DQ-010 and DQ-011); the failure search covers this envelope and finds no tip without a fault'
open_actions:
- Confirm severity and probability in PHA (Task 202) at G2
- 'Confirm the SYS-016 torque reserve in the actuation trade (TS-001, DQ-006): the level-2 spec adopts the sized ankle
  26.5 kN m and knee 22.5 kN m (DQ-012); a real actuator must show that torque falls no faster than supply down to the
  load-holding threshold (sim/results/sizing-cf4.md)'
- Derive a safety requirement for margin-based load holding (M5) (Task 203)

