schema: susanoo/hazard/v0.2
id: HAZ-DCK-003
title: UAV battery thermal event while charging on the dock
status: open
system: SUS-I1
subsystems:
- SUS-M1-DCK
- SUS-A1
applicability:
  configurations:
  - SUS-I1-C001
  hardware: []
  software: []
hazardous_condition: The UAV battery is overcharged, charged with a wrong profile or charged while damaged on the
  walker-mounted dock.
modes:
- MOD-03
- MOD-06
causal_factors:
- id: CF1
  type: hardware
  description: Charger or UAV battery management fault
- id: CF2
  type: interface
  description: Wrong charge profile or cell data exchanged between dock and UAV
- id: CF3
  type: environment
  description: High ambient temperature or a battery damaged in a hard landing
effects:
- Battery venting, fire or smoke on the dock, close to the pod
mishap: Burns or smoke inhalation for the pilot or crew; fire spreading to the walker
initial_risk:
  severity: 2
  probability: C
  rac: 2C
  risk_level: Serious
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): over 2,000 charge cycles
    a charge-induced lithium-polymer thermal event is plausible; a fire on the dock behind the pod can seriously
    burn the pilot or crew.'
  definitions: SUS-RISKDEF-001
target_risk:
  severity: 2
  probability: D
  rac: 2D
  risk_level: Medium
  rationale: 'Preliminary; rated by the project lead (DQ-019, 2026-11-13) on SUS-RISKDEF-001 with the DQ-003 exposure
    basis (per item over 500 walker hours, 2,000 docking cycles, 200 UAV flight hours): independent charger cut-offs
    and a fire-separated dock reduce, but over 2,000 cycles do not make improbable, a thermal event.'
  definitions: SUS-RISKDEF-001
event_risks: []
mitigations:
- id: M1
  description: Charger with independent over-voltage, over-current and over-temperature cut-off
  precedence: c
  state: identified
  verification:
    method:
    - test
    evidence_ids: []
  requirement_ids:
  - SYS-022
- id: M2
  description: Dock separated from the pod by a fire barrier, with venting away from the pilot
  precedence: b
  state: identified
  verification:
    method:
    - analysis
    - inspection
    evidence_ids: []
- id: M3
  description: Do not charge a battery after a hard landing until inspected
  precedence: e
  state: identified
  verification:
    method:
    - demonstration
    evidence_ids: []
requirement_ids:
- SYS-022
owner:
