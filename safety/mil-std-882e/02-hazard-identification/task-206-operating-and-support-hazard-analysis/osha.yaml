# Operating and Support Hazard Analysis (MIL-STD-882E Task 206) worksheet source: the operating and support tasks of
# the CONOPS (scenarios SCN-001 to SCN-006, maintenance and emergency) broken into steps, each with the people exposed
# and the hazards the step exposes them to. osha.csv, osha.svg and the O&SHA tab of safety/generated/worksheets.xlsx
# are generated from this file (python -m tools.worksheets.build).
#
# AI-drafted (I0), not reviewed. No severity or probability is assigned here: the worksheet shows the initial risk of
# the most severe linked hazard, read from its record, and the requirements of the linked hazards. "gap" rows expose
# people to a hazard that has no record yet and need analysis. Personnel are the item definition's externals.
schema: susanoo/osha-worksheet/v0.1
provenance: {author: "Claude (AI-drafted)", independence: I0, date: "2026-11-13", reviewed: false}
tasks:
  T1: {title: "Pre-use inspection and startup", scenario: SCN-001}
  T2: {title: "Travel", scenario: SCN-002}
  T3: {title: "Payload handling", scenario: SCN-003}
  T4: {title: "UAV observation", scenario: SCN-004}
  T5: {title: "UAV recovery and charging", scenario: SCN-005}
  T6: {title: "Shutdown and egress", scenario: SCN-006}
  T7: {title: "Maintenance", scenario: null}
  T8: {title: "Emergency", scenario: SCN-104}
rows:
  - {task: T1, step: "Walk-around inspection with the mechanical supports fitted", modes: [MOD-01], personnel: [EXT-CREW], hazards: [HAZ-PWR-001], cause: "Pressure retained in accumulators or trapped lines", effect: "Fluid injection or whip injury to the inspector", controls: "Zero-energy check before contact; supports fitted", status: drafted}
  - {task: T1, step: "Energise power and run the self-test", modes: [MOD-02], personnel: [EXT-CREW, EXT-PILOT], hazards: [HAZ-PWR-002, HAZ-PWR-003], cause: "Battery or fuel fault present at start-up", effect: "Fire near the pilot station", controls: "Self-test of battery and fuel systems before ingress", status: drafted}
  - {task: T1, step: "Climb the fold-down ladder into the kneeling pod", modes: [MOD-03], personnel: [EXT-PILOT], hazards: [HAZ-PIL-001], cause: "Leg motion enabled while the pilot is on the ladder", effect: "Pilot caught or thrown off by moving structure", controls: "Motion inhibited until readiness is confirmed; ladder interlocked against walking", status: drafted}
  - {task: T1, step: "Climb the ladder or sill with the walker still", modes: [MOD-03], personnel: [EXT-PILOT, EXT-CREW], hazards: [], cause: "Slip or misstep on the ladder or the 0.62 m sill", effect: "Fall of about 1 to 1.6 m during normal ingress", controls: "Three points of contact (grab handles); non-slip treads", status: gap, note: "No hazard record for a fall during normal ingress or egress; HAZ-PIL-003 covers only the emergency exit"}
  - {task: T1, step: "Fasten the restraint and confirm readiness", modes: [MOD-02], personnel: [EXT-PILOT], hazards: [HAZ-PIL-001], cause: "Readiness reported with restraint, hatch or controls not ready", effect: "Motion enabled with the pilot unrestrained", controls: "Readiness interlock", status: drafted}
  - {task: T1, step: "Rise from the kneel to standing", modes: [MOD-03], personnel: [EXT-PILOT, EXT-OBSERVER, EXT-CREW], hazards: [HAZ-WLK-003], cause: "Person inside the folding zone of the pod and legs", effect: "Person under the pod or beside the legs crushed", controls: "Clear zone confirmed by the observer before rising", status: drafted}
  - {task: T2, step: "Confirm the exclusion zone and the arms stowed", modes: [MOD-04], personnel: [EXT-PILOT, EXT-OBSERVER], hazards: [HAZ-MAN-001], cause: "Walking enabled with the arms out or a person in reach", effect: "Person struck by the claws", controls: "Arm stow interlock; observer with an independent stop", status: drafted}
  - {task: T2, step: "Walk on prepared ground within the slope limit", modes: [MOD-04], personnel: [EXT-PILOT, EXT-OBSERVER, EXT-BYSTANDER], hazards: [HAZ-WLK-002, HAZ-WLK-001], cause: "Terrain, slope or a feedback fault beyond the envelope", effect: "Fall or runaway motion with the pilot aboard", controls: "Stability envelope protection; feedback fault detection", status: drafted}
  - {task: T2, step: "Stop on command or by protective stop", modes: [MOD-09], personnel: [EXT-PILOT, EXT-OBSERVER], hazards: [HAZ-SAF-001, HAZ-PIL-002], cause: "Stop does not reach a safe state, or support is lost on stopping", effect: "Collapse or uncontrolled drop of the cockpit", controls: "Independent protective stop; fail-safe load holding", status: drafted}
  - {task: T3, step: "Approach and grip the load with the zone confirmed clear", modes: [MOD-05], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-MAN-001], cause: "Arm moves before the zone is clear", effect: "Crew member struck or pinned", controls: "Manipulation inhibited until the zone is confirmed clear", status: drafted}
  - {task: T3, step: "Crew guide the load near the claws", modes: [MOD-05], personnel: [EXT-CREW], hazards: [HAZ-MAN-001], cause: "Crew inside the arms' reach by working method", effect: "Crew member struck or pinned", controls: "Taglines from outside the reach, if crew guidance is allowed at all", status: drafted, note: "Decide whether any crew task may be inside the arms' reach (SYS-017 exclusion-zone TBD)"}
  - {task: T3, step: "Carry the load while walking", modes: [MOD-04, MOD-05], personnel: [EXT-PILOT, EXT-OBSERVER, EXT-BYSTANDER], hazards: [HAZ-MAN-002, HAZ-WLK-002], cause: "Load swing, grip failure or a centre-of-mass shift", effect: "Load strikes a person or upsets the walker", controls: "Loaded-walking limits and carry pose; exclusion zone for a loaded walker", status: drafted}
  - {task: T3, step: "Set the load down", modes: [MOD-05], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-MAN-002], cause: "Load released before it rests", effect: "Load falls onto crew", controls: "Release only with the load confirmed resting", status: drafted}
  - {task: T4, step: "Pre-flight at the dock with crew handling the UAV", modes: [MOD-06], personnel: [EXT-CREW], hazards: [HAZ-DCK-001, HAZ-DCK-004], cause: "Rotor start or energised contacts while crew handle the aircraft", effect: "Rotor strike or electric shock", controls: "Docked rotor inhibit; contacts de-energised for handling", status: drafted}
  - {task: T4, step: "Launch from the dock", modes: [MOD-06, MOD-07], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-INT-001, HAZ-DCK-004], cause: "Launch outside the envelope or with charging on", effect: "Rotor or airframe strike; arcing at the connector", controls: "Launch permit requires a stationary walker and charging off", status: drafted}
  - {task: T4, step: "Pilot uses UAV imagery while walking", modes: [MOD-04, MOD-07], personnel: [EXT-PILOT, EXT-BYSTANDER], hazards: [HAZ-INT-002], cause: "Misleading or stale imagery shown as valid", effect: "Walker steered toward an unseen person", controls: "Validity and staleness annunciation; imagery advisory only", status: drafted}
  - {task: T5, step: "Recovery approach and capture", modes: [MOD-08], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-INT-001, HAZ-DCK-002], cause: "Approach to a moving or unready dock; false retained state", effect: "Collision or the aircraft thrown off the walker", controls: "Recovery permit; positive retention sensing", status: drafted}
  - {task: T5, step: "Charge the UAV on the dock", modes: [MOD-03, MOD-06], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-DCK-003], cause: "Overcharge or a damaged battery", effect: "Battery fire behind the pod", controls: "Independent charge cut-offs; fire-separated dock", status: drafted}
  - {task: T5, step: "Remove the UAV or its battery by hand", modes: [MOD-10], personnel: [EXT-CREW], hazards: [HAZ-DCK-004, HAZ-DCK-001], cause: "Charging or arming not isolated before handling", effect: "Electric shock or rotor strike", controls: "Isolate charging and confirm the rotor inhibit before handling", status: drafted}
  - {task: T6, step: "Lower to the kneel", modes: [MOD-03], personnel: [EXT-PILOT, EXT-CREW], hazards: [HAZ-WLK-003, HAZ-PIL-004], cause: "Person in the folding zone; lowering fault", effect: "Crush under the pod; pilot unable to leave normally", controls: "Clear zone before lowering; side-hatch emergency exit", status: drafted}
  - {task: T6, step: "Unfasten and climb down the ladder", modes: [MOD-03], personnel: [EXT-PILOT], hazards: [HAZ-PIL-001], cause: "Motion enabled before the pilot is clear", effect: "Pilot caught by moving structure", controls: "Motion inhibited until the pilot is clear and the ladder stowed", status: drafted}
  - {task: T6, step: "Isolate energy and fit the supports", modes: [MOD-01], personnel: [EXT-CREW], hazards: [HAZ-PWR-001], cause: "Stored pressure left in the system", effect: "Injection or crush injury after shutdown", controls: "Stored-energy isolation and zero-energy verification", status: drafted}
  - {task: T7, step: "Work on hydraulic lines and actuators", modes: [MOD-10], personnel: [EXT-CREW], hazards: [HAZ-PWR-001], cause: "Residual pressure", effect: "Fluid injection or actuator motion", controls: "Lock-out, bleed-down and gauge-verified zero energy", status: drafted}
  - {task: T7, step: "Service the traction battery", modes: [MOD-10], personnel: [EXT-CREW], hazards: [HAZ-PWR-002], cause: "Damaged cell or short during handling", effect: "Thermal runaway or burns", controls: "Independent battery isolation", status: drafted}
  - {task: T7, step: "Refuel the engine-generator (power alternative B)", modes: [MOD-01, MOD-10], personnel: [EXT-CREW], hazards: [HAZ-PWR-003], cause: "Spill or vapour near a hot surface", effect: "Fuel fire", controls: "Engine off and cool; fuel shut-off", status: drafted}
  - {task: T7, step: "Work at height on the pod, dock or roll bar", modes: [MOD-10], personnel: [EXT-CREW], hazards: [], cause: "Slip or loss of balance on the walker, 3 to 4.5 m up", effect: "Fall from height", controls: "Access platform and fall arrest (TBD)", status: gap, note: "No hazard record for a fall from height during maintenance"}
  - {task: T7, step: "Function test after maintenance, walker supported", modes: [MOD-10], personnel: [EXT-CREW], hazards: [HAZ-PIL-001, HAZ-PWR-001], cause: "Unexpected motion or pressure while crew are close", effect: "Crew caught by moving structure or fluid injection", controls: "Supports fitted; motion enable only with crew clear", status: drafted}
  - {task: T8, step: "Emergency egress through a side hatch", modes: [MOD-09], personnel: [EXT-PILOT], hazards: [HAZ-PIL-003], cause: "Descent from about 3.2 m without power or the kneel", effect: "Fall injury to the pilot", controls: "Shoulder step, davit ladder and fall arrest", status: drafted}
  - {task: T8, step: "Crew extract an incapacitated pilot", modes: [MOD-09], personnel: [EXT-CREW, EXT-PILOT], hazards: [], cause: "Pilot cannot leave unaided; walker standing or fallen", effect: "Delayed extraction; injury to the pilot or the rescuers", controls: "Extraction procedure and equipment (TBD)", status: gap, note: "No hazard record for extraction of an incapacitated pilot (SCN-104)"}
