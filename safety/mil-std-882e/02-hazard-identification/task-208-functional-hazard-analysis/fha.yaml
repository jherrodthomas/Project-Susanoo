# Functional Hazard Analysis (MIL-STD-882E Task 208) worksheet source: each function of the item definition
# (architecture/item-definition.yaml) against five functional failure types. fha.csv, fha.svg and the FHA tab
# of safety/generated/worksheets.xlsx are generated from this file (python -m tools.worksheets.build).
#
# AI-drafted (I0), not reviewed. Rows link existing hazard records only where the failure leads to that
# hazard; "gap" rows have no hazard record yet and need analysis. No severity or probability is assigned
# here: the worksheet shows the worst initial severity of the linked hazards, read from their records.
# UAV flight functions (F-06) are classified separately in the ARP4761A aircraft FHA; this sheet only
# records how a UAV functional failure reaches the walker and the people around it.
schema: susanoo/fha-worksheet/v0.1
provenance: {author: "Claude (AI-drafted)", independence: I0, date: "2026-11-12", reviewed: false}
failure_types:
  loss: Function not provided when needed
  erroneous: Function provided with a wrong output
  untimely: Function provided too early or too late
  unintended: Function provided when not demanded
  degraded: Function provided with reduced performance
rows:
  # F-01 Piloted locomotion
  - {function: F-01, failure: loss, condition: "Gait or balance control stops mid-step", effect: "Walker loses balance and may fall with the pilot aboard", hazards: [HAZ-WLK-002], status: drafted}
  - {function: F-01, failure: erroneous, condition: "Wrong joint commands or a wrong state estimate", effect: "Unstable gait or runaway leg motion; tip-over", hazards: [HAZ-WLK-001, HAZ-WLK-002], status: drafted}
  - {function: F-01, failure: untimely, condition: "Balance correction acts late on stale feedback", effect: "Capture point leaves the support before recovery; fall", hazards: [HAZ-WLK-001, HAZ-WLK-002], status: drafted}
  - {function: F-01, failure: unintended, condition: "Leg motion without a pilot command, including kneel or rise", effect: "People near the legs or under the pod are struck or crushed", hazards: [HAZ-WLK-001, HAZ-PIL-001, HAZ-WLK-003], status: drafted}
  - {function: F-01, failure: degraded, condition: "Reduced actuator capacity as supply falls", effect: "Balance capacity shrinks before load holding engages; fall or drop", hazards: [HAZ-WLK-002, HAZ-PIL-002], status: drafted}
  # F-02 Payload manipulation
  - {function: F-02, failure: loss, condition: "Grip or arm hold lost", effect: "Load falls; while walking it can strike people or upset the walker", hazards: [HAZ-MAN-002], status: drafted, note: "A load dropped at a standstill has no hazard record yet"}
  - {function: F-02, failure: erroneous, condition: "Arm moves to a wrong position or with wrong force", effect: "Person in reach struck or pinned", hazards: [HAZ-MAN-001], status: drafted}
  - {function: F-02, failure: untimely, condition: "Arm moves before the exclusion zone is confirmed clear", effect: "Person in reach struck or pinned", hazards: [HAZ-MAN-001], status: drafted}
  - {function: F-02, failure: unintended, condition: "Arm leaves the stowed or carry pose while walking", effect: "Claws or load swing into the walking envelope", hazards: [HAZ-MAN-001, HAZ-MAN-002], status: drafted}
  - {function: F-02, failure: degraded, condition: "Reduced arm force or speed under load", effect: "Load shifts and moves the centre of mass ahead of the stance foot", hazards: [HAZ-MAN-002, HAZ-WLK-002], status: drafted}
  # F-03 Pilot readiness, ingress and egress
  - {function: F-03, failure: loss, condition: "Walker cannot lower to the egress posture", effect: "Normal egress blocked; only the side-hatch emergency exit remains", hazards: [HAZ-PIL-003], status: gap, note: "Blocked normal egress (SCN-104) has no hazard record of its own"}
  - {function: F-03, failure: erroneous, condition: "Readiness reported true with restraint, hatch or controls not ready", effect: "Leg motion enabled during ingress or egress", hazards: [HAZ-PIL-001], status: drafted}
  - {function: F-03, failure: untimely, condition: "Motion enabled before ingress is complete", effect: "Pilot or crew caught by moving structure", hazards: [HAZ-PIL-001], status: drafted}
  - {function: F-03, failure: unintended, condition: "Kneel or rise without a confirmed clear zone", effect: "Person under the pod or beside the legs crushed", hazards: [HAZ-WLK-003], status: drafted}
  - {function: F-03, failure: degraded, condition: "Uncontrolled or too-fast lowering", effect: "Crush under the pod; drop loads on the restrained pilot", hazards: [HAZ-WLK-003, HAZ-PIL-002], status: drafted}
  # F-04 Protective stop and fault response
  - {function: F-04, failure: loss, condition: "Protective stop not executed on demand", effect: "Hazardous motion continues", hazards: [HAZ-SAF-001, HAZ-WLK-001], status: drafted}
  - {function: F-04, failure: erroneous, condition: "Stop drives the walker to an unstable posture", effect: "Fall or collapse with the pilot aboard", hazards: [HAZ-SAF-001, HAZ-WLK-002], status: drafted}
  - {function: F-04, failure: untimely, condition: "Stop completes later than the reaction time", effect: "Motion continues into the person or obstacle", hazards: [HAZ-SAF-001], status: drafted}
  - {function: F-04, failure: unintended, condition: "Spurious stop while walking or carrying a load", effect: "Abrupt stop can upset the walker or shake the load loose", hazards: [HAZ-WLK-002, HAZ-MAN-002], status: drafted}
  - {function: F-04, failure: degraded, condition: "Stop reaches only part of the actuators", effect: "Safe state not reached", hazards: [HAZ-SAF-001], status: drafted}
  # F-05 Power generation, storage, distribution and isolation
  - {function: F-05, failure: loss, condition: "Actuator supply lost while walking", effect: "Balance lost before load holding engages; cockpit drop", hazards: [HAZ-WLK-002, HAZ-PIL-002], status: drafted}
  - {function: F-05, failure: erroneous, condition: "Isolation reported complete with energy still stored", effect: "Maintainer exposed to stored pressure or energy", hazards: [HAZ-PWR-001], status: drafted}
  - {function: F-05, failure: untimely, condition: "Isolation or shut-off late on a thermal or fuel fault", effect: "Fire or thermal event near the pilot grows", hazards: [HAZ-PWR-002, HAZ-PWR-003], status: drafted}
  - {function: F-05, failure: unintended, condition: "System energised during maintenance", effect: "Unexpected pressure or motion injures a maintainer", hazards: [HAZ-PWR-001], status: drafted}
  - {function: F-05, failure: degraded, condition: "Reduced pressure or bus voltage", effect: "Reduced balance authority (slow leak on a slope)", hazards: [HAZ-WLK-002], status: drafted}
  # F-06 Aerial observation (aircraft-level classification: ARP4761A FHA, not here)
  - {function: F-06, failure: loss, condition: "UAV link or imagery lost", effect: "Lost-link contingency must keep the aircraft clear of the walker", hazards: [HAZ-INT-001], status: drafted}
  - {function: F-06, failure: erroneous, condition: "Misleading imagery or position shown to the pilot", effect: "Pilot decisions based on wrong information", hazards: [], status: gap, note: "No walker-side hazard record for misleading UAV information yet"}
  - {function: F-06, failure: untimely, condition: "Stale or frozen imagery", effect: "Pilot acts on an out-of-date picture", hazards: [], status: gap, note: "No walker-side hazard record for stale UAV information yet"}
  - {function: F-06, failure: unintended, condition: "UAV flies into the pilot keep-out", effect: "Rotor or airframe strike on pilot or crew", hazards: [HAZ-INT-001], status: drafted}
  - {function: F-06, failure: degraded, condition: "Degraded navigation (GNSS loss)", effect: "Position error of the aircraft near people", hazards: [HAZ-INT-001], status: drafted}
  # F-07 UAV launch, recovery and retention
  - {function: F-07, failure: loss, condition: "Retention lost on the dock", effect: "UAV released while the walker moves", hazards: [HAZ-DCK-002], status: drafted}
  - {function: F-07, failure: erroneous, condition: "Dock reports retained when it is not", effect: "Walker moves with an unretained aircraft", hazards: [HAZ-DCK-002], status: drafted}
  - {function: F-07, failure: untimely, condition: "Release during walker motion", effect: "Aircraft strikes pilot or crew", hazards: [HAZ-DCK-002, HAZ-INT-001], status: drafted}
  - {function: F-07, failure: unintended, condition: "Rotor start while retained or a person is at the dock", effect: "Rotor strike on maintainer or pilot", hazards: [HAZ-DCK-001], status: drafted}
  - {function: F-07, failure: degraded, condition: "Recovery outside the safe envelope", effect: "Collision during capture", hazards: [HAZ-INT-001], status: drafted}
  # F-08 UAV charging
  - {function: F-08, failure: loss, condition: "UAV not charged", effect: "Reduced flight endurance; lost-link and low-battery contingencies more likely", hazards: [HAZ-INT-001], status: drafted}
  - {function: F-08, failure: erroneous, condition: "Overcharge or wrong charge profile", effect: "UAV battery thermal event at the dock", hazards: [], status: gap, note: "No hazard record for a UAV battery thermal event at the dock"}
  - {function: F-08, failure: untimely, condition: "Charging continues during launch preparation", effect: "Energised connector at release", hazards: [], status: gap, note: "To analyse with the dock interface"}
  - {function: F-08, failure: unintended, condition: "Charging energised with a person at the dock", effect: "Electrical exposure during handling", hazards: [], status: gap, note: "To analyse with the dock interface"}
  - {function: F-08, failure: degraded, condition: "Partial charge reported as full", effect: "Flight starts with less endurance than shown", hazards: [HAZ-INT-001], status: drafted}
  # F-09 Maintenance support and energy isolation
  - {function: F-09, failure: loss, condition: "Isolation points unavailable", effect: "Maintenance with stored energy present", hazards: [HAZ-PWR-001], status: drafted}
  - {function: F-09, failure: erroneous, condition: "Zero-energy check passes wrongly", effect: "Maintainer exposed to stored pressure", hazards: [HAZ-PWR-001], status: drafted}
  - {function: F-09, failure: untimely, condition: "Residual pressure released late", effect: "Injection or crush injury during work", hazards: [HAZ-PWR-001], status: drafted}
  - {function: F-09, failure: unintended, condition: "Unexpected motion during maintenance", effect: "Maintainer caught by moving structure", hazards: [HAZ-PWR-001, HAZ-PIL-001], status: drafted}
  - {function: F-09, failure: degraded, condition: "Mechanical supports carry only part of the load", effect: "Structure settles onto the maintainer", hazards: [HAZ-PWR-001], status: drafted}
