      views:
        - kind: bdd
          title: SAR structure
          blocks:
            - name: SafetyAssessmentReport
              stereotype: item
              attributes: ["configurationId : String", "revision : String"]
              parts:
                - {name: hazards, type: Hazard, mult: "0..*"}
                - {name: evidence, type: VerificationEvidence, mult: "0..*"}
                - {name: limitations, type: OperatingLimitation, mult: "0..*"}
