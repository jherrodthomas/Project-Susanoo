# MIL-STD-882E work-product tree catalog (PDaC source of truth).
#
# Every folder under safety/mil-std-882e, its README diagrams (flow position,
# block, boundary, SysML, inputs/outputs) and its generated SysML v2 view are
# produced from this file by tools/gen_safety_docs.py. Edit here, regenerate,
# and commit both. CI (tools/check_readme_diagrams.py) fails on drift.
schema: susanoo/safety-tree/v0.1-draft
base: safety/mil-std-882e
default_status: Scaffold v0.1 — structure, diagrams and model views only
disclaimer: >-
  Planning artifact. No completed hazard analysis, verified mitigation, risk
  acceptance, certification or MIL-STD-882E compliance is claimed. Category
  names follow MIL-STD-882E; confirm definitions against the controlled
  standard and the approved SSPP before formal use.

# --------------------------------------------------------------------------
# Eight iterative system safety process elements (MIL-STD-882E, 4.3)
elements:
  - {n: 1, short: Document approach, name: Document the system safety approach}
  - {n: 2, short: Identify hazards, name: Identify and document hazards}
  - {n: 3, short: Assess risk, name: Assess and document risk}
  - {n: 4, short: Identify mitigations, name: Identify and document risk mitigation measures}
  - {n: 5, short: Reduce risk, name: Reduce risk}
  - {n: 6, short: Verify risk reduction, name: "Verify, validate and document risk reduction"}
  - {n: 7, short: Accept risk, name: Accept risk and document}
  - {n: 8, short: Manage life-cycle risk, name: Manage life-cycle risk}

# --------------------------------------------------------------------------
# System element registry; mirrors 00-system-definition/sysml/SusanooSystem.sysml
system:
  nodes:
    SUS-I1:      {label: Integrated mech + UAV system, sysml: IntegratedSystem, usage: susanoo}
    SUS-M1:      {label: Piloted walker, parent: SUS-I1, sysml: PilotedWalker, usage: susanoo.m1}
    SUS-M1-WLK:  {label: "Structure, legs, joints & brakes", parent: SUS-M1, sysml: WalkerStructure, usage: susanoo.m1.wlk}
    SUS-M1-MAN:  {label: Manipulator arms & end effectors, parent: SUS-M1, sysml: Manipulators, usage: susanoo.m1.man}
    SUS-M1-PIL:  {label: "Pilot station, restraints & HMI", parent: SUS-M1, sysml: PilotStation, usage: susanoo.m1.pil}
    SUS-M1-PWR:  {label: Series-hybrid power & isolation, parent: SUS-M1, sysml: PowerSystem, usage: susanoo.m1.pwr}
    SUS-M1-CTL:  {label: Motion & balance control SW, parent: SUS-M1, sysml: MotionControl, usage: susanoo.m1.ctl}
    SUS-M1-SAF:  {label: Safety monitor & protective stop, parent: SUS-M1, kind: safety, sysml: SafetyMonitor, usage: susanoo.m1.saf}
    SUS-M1-DCK:  {label: "UAV dock - retention, power, data", parent: SUS-M1, kind: interface, sysml: UAVDock, usage: susanoo.m1.dck}
    SUS-A1:      {label: Observation UAV, parent: SUS-I1, sysml: ObservationUAV, usage: susanoo.a1}
    SUS-A1-FCS:  {label: Flight control - PX4 candidate, parent: SUS-A1, sysml: FlightControl, usage: susanoo.a1.fcs}
    SUS-A1-PRP:  {label: "Motors, ESCs & propellers", parent: SUS-A1, sysml: Propulsion, usage: susanoo.a1.prp}
    SUS-A1-PWR:  {label: UAV battery & power mgmt, parent: SUS-A1, sysml: UAVPower, usage: susanoo.a1.pwr}
    SUS-A1-NAV:  {label: Navigation & telemetry link, parent: SUS-A1, sysml: NavTelemetry, usage: susanoo.a1.nav}
    SUS-A1-PLD:  {label: Observation payload, parent: SUS-A1, sysml: ObservationPayload, usage: susanoo.a1.pld}
    SUS-GSE:     {label: Ground support equipment, parent: SUS-I1, sysml: GroundSupport, usage: susanoo.gse}
    SUS-GSE-SUP: {label: Maintenance supports & lockout, parent: SUS-GSE, sysml: MaintenanceSupports, usage: susanoo.gse.sup}
    SUS-GSE-CHG: {label: Charging & fuelling equipment, parent: SUS-GSE, sysml: ChargingEquipment, usage: susanoo.gse.chg}
    SUS-GSE-TST: {label: "Test rigs, HIL & simulation", parent: SUS-GSE, sysml: TestRigs, usage: susanoo.gse.tst}
    EXT-PILOT:   {label: Pilot / operator, kind: external}
    EXT-CREW:    {label: Ground crew & maintainers, kind: external}
    EXT-BYST:    {label: Bystanders & nearby workers, kind: external}
    EXT-TERRAIN: {label: Terrain & obstacles, kind: external}
    EXT-AIR:     {label: "Airspace, GNSS & RF environment", kind: external}
    EXT-SITE:    {label: Site infrastructure & logistics, kind: external}
    EXT-ENV:     {label: Natural environment & receptors, kind: external}
    EXT-AUTH:    {label: Risk acceptance authority, kind: external}
  links:
    - [SUS-M1-PIL, SUS-M1-CTL, commands]
    - [SUS-M1-CTL, SUS-M1-WLK, joint actuation]
    - [SUS-M1-CTL, SUS-M1-MAN, arm actuation]
    - [SUS-M1-PWR, SUS-M1-WLK, DC power]
    - [SUS-M1-SAF, SUS-M1-CTL, torque inhibit]
    - [SUS-M1-SAF, SUS-M1-PWR, energy isolation]
    - [SUS-M1-DCK, SUS-A1-PWR, dock charging]
    - [SUS-M1-DCK, SUS-A1-FCS, dock data / rotor inhibit]
    - [SUS-A1-NAV, SUS-A1-FCS, state estimate]
    - [SUS-A1-FCS, SUS-A1-PRP, thrust command]
    - [SUS-GSE-SUP, SUS-M1-WLK, mechanical support]
    - [SUS-GSE-CHG, SUS-M1-PWR, shore charging]

# --------------------------------------------------------------------------
# Folders. `parent` builds the tree; `path` is relative to `base`.
folders:

  # ======================================================== ROOT
  - id: ROOT
    path: .
    title: MIL-STD-882E System Safety Work Products
    crosscut: hts
    role: Safety lead
    procedure: docs/wiki/MIL-STD-882E-Handbook.md
    purpose: |
      Controlled work-product tree for the SUS-I1 system safety program, organised by the
      eight MIL-STD-882E process elements (folders `01`–`08`) with the 25 tasks nested under the
      element they primarily serve. `00-system-definition` holds the analysis baseline and canonical
      SysML models; `hazard-tracking-system` (Task 106) and `software-safety` (Section 4.4) cut
      across all elements. Procedures live in the [Wiki handbook](../../docs/wiki/MIL-STD-882E-Handbook.md);
      this tree holds the actual records and evidence.
    scope: [SUS-I1]
    boundary:
      name: SUS-I1 system safety program
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [EXT-PILOT, EXT-CREW, EXT-BYST, EXT-TERRAIN, EXT-AIR, EXT-ENV, EXT-AUTH]
      flows:
        - [EXT-PILOT, SUS-M1, commands / feedback]
        - [EXT-CREW, SUS-GSE, maintenance / lockout]
        - [SUS-M1, EXT-BYST, motion / contact hazards]
        - [EXT-TERRAIN, SUS-M1, ground contact loads]
        - [EXT-AIR, SUS-A1, navigation / RF link]
        - [SUS-M1, EXT-ENV, emissions / fluids]
        - [SUS-M1, SUS-A1, dock / undock]
        - ["@boundary", EXT-AUTH, residual risk for decision]
    model:
      package: SafetyProgramFlow
      views:
        - kind: act
          name: SystemSafetyProcess
          title: eight-element iterative process
          doc: Iterative MIL-STD-882E process applied to SUS-I1 configurations.
          steps:
            - {name: documentApproach, label: "1 Document approach - SSPP, HMP"}
            - {name: identifyHazards, label: "2 Identify hazards - PHL, PHA, SSHA, SHA..."}
            - {name: assessRisk, label: "3 Assess risk - severity x probability", safety: true}
            - {name: identifyMitigations, label: "4 Identify mitigations - order of precedence"}
            - {name: reduceRisk, label: "5 Reduce risk - safety requirements in design"}
            - {name: verifyRiskReduction, label: "6 Verify risk reduction - Task 401 evidence"}
            - {name: acceptRisk, label: "7 Accept risk - authorized human decision", safety: true}
            - {name: manageLifecycleRisk, label: "8 Manage life-cycle risk - changes, mishaps"}
          loops:
            - [manageLifecycleRisk, identifyHazards, change or new hazard]
            - [verifyRiskReduction, identifyMitigations, verification failed]
    inputs:
      - {doc: concept/CONOPS.md, item: CONOPS and operating scenarios}
      - {doc: concept/architecture.md, item: Preliminary architecture}
      - {doc: framework/standards-applicability.md, item: Standards applicability}
    outputs:
      - {ext: Release evidence manifest (pdac/product.yaml), item: Safety case and risk dispositions}
      - {ext: Risk acceptance authority, item: Residual risk decision requests}
    contents:
      - {name: catalog.yaml, desc: Source of truth for this tree; regenerate READMEs after editing}
    notes_md: |
      ## Folder map

      | Folder | 882E element | Tasks |
      |---|---|---|
      | `00-system-definition/` | Prerequisite to all | System baseline, canonical SysML |
      | `01-safety-approach/` | 1 | 101, 102, 103, 104, 105, 108 |
      | `02-hazard-identification/` | 2 | 201–210 |
      | `03-risk-assessment/` | 3 | Risk matrix (Table I–III usage) |
      | `04-mitigation-identification/` | 4 | Design order of precedence |
      | `05-risk-reduction/` | 5 | Safety requirements |
      | `06-verification/` | 6 | 303, 401, 402, 403 |
      | `07-risk-acceptance/` | 7 | 301, 302, acceptance records |
      | `08-lifecycle-risk-management/` | 8 | 107, 304 |
      | `hazard-tracking-system/` | Cross-cutting | 106 |
      | `software-safety/` | Cross-cutting | Section 4.4 |
      | `templates/` | — | Record templates |

      ## Documentation rule

      Every folder README in this tree must carry the diagram set defined in
      [`framework/documentation-standard.md`](../../framework/documentation-standard.md). Generate with
      `python3 tools/gen_safety_docs.py`; CI runs `python3 tools/check_readme_diagrams.py`.

  # ======================================================== 00
  - id: SYSDEF
    parent: ROOT
    path: 00-system-definition
    title: 00 · System Definition and Analysis Baseline
    gate: G0 (refreshed at every gate)
    role: Systems lead with safety lead
    canonical_model:
      - safety/mil-std-882e/00-system-definition/sysml/SusanooSystem.sysml
      - safety/mil-std-882e/00-system-definition/sysml/SusanooSafety.sysml
    purpose: |
      Defines the system of interest, its decomposition, interfaces and external context that every
      hazard analysis uses as its baseline. Holds the canonical SysML v2 models: `SusanooSystem`
      (structure, ports, dock interface) and `SusanooSafety` (severity, probability, risk, SwCI,
      mitigation precedence, hazard record). Per-folder SysML views import these packages.
    scope: [SUS-I1]
    boundary:
      name: SUS-I1 system of interest
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [EXT-PILOT, EXT-CREW, EXT-BYST, EXT-TERRAIN, EXT-AIR, EXT-SITE, EXT-ENV]
      flows:
        - [EXT-PILOT, SUS-M1, intent / alerts]
        - [EXT-CREW, SUS-GSE, servicing / lockout]
        - [SUS-GSE, SUS-M1, support / charging]
        - [SUS-M1, SUS-A1, "dock power, data, retention"]
        - [SUS-M1, EXT-TERRAIN, foot contact loads]
        - [SUS-M1, EXT-BYST, motion envelope]
        - [EXT-AIR, SUS-A1, GNSS / RF link]
        - [EXT-SITE, SUS-GSE, "fuel, power, transport"]
        - [SUS-M1, EXT-ENV, "exhaust, noise, fluids"]
      excluded: [weapons or armament of any kind, public-road operation, autonomous walker operation without a pilot]
    inputs:
      - {doc: concept/CONOPS.md, item: "Missions, phases, users"}
      - {doc: concept/architecture.md, item: Decomposition and interfaces}
      - {doc: docs/wiki/SUS-M1-Architecture-and-Boundaries.md, item: "Power, control and dock diagrams"}
      - {doc: pdac/product.yaml, item: Configuration ID SUS-I1-C001}
    outputs:
      - {ref: E2, item: Analysis baseline}
      - {ref: SWS, item: Software-controlled functions}
      - {ref: HTS, item: Subsystem IDs for hazard records}
    contents:
      - {name: sysml/SusanooSystem.sysml, desc: Canonical structure model (parts, ports, dock interface)}
      - {name: sysml/SusanooSafety.sysml, desc: Canonical safety vocabulary (enums, Hazard item)}
      - {name: interface-register.csv, desc: Controlled interface list with hazard links}

  # ======================================================== 01
  - id: E1
    parent: ROOT
    path: 01-safety-approach
    title: 01 · Document the System Safety Approach
    element: 1
    gate: G0–G1, updated at each gate
    applicability: Selected
    role: Safety lead
    purpose: |
      Plans and governs the program: how hazards will be identified, assessed, mitigated, verified,
      accepted and tracked for SUS-I1, who holds which authority, and which tasks are selected.
      Management tasks 101–105 and 108 live here.
    scope: [SUS-I1]
    boundary:
      name: Safety program management
      inside: [SSPP and HMP, Task selection and tailoring, IPT and roles]
      outside: [EXT-AUTH, Program management, Suppliers, Standards bodies]
      flows:
        - [Program management, SSPP and HMP, "schedule, resources, contract terms"]
        - [Standards bodies, Task selection and tailoring, controlled standard editions]
        - [SSPP and HMP, EXT-AUTH, risk acceptance authority matrix]
        - [IPT and roles, Suppliers, safety data requirements]
    model:
      package: SafetyApproach
      views:
        - kind: bdd
          title: safety program plan set
          blocks:
            - name: SafetyProgram
              doc: Plans and agreements that document the SUS-I1 safety approach.
              attributes: ["configurationId : String", "standardEdition : String"]
              parts:
                - {name: sspp, type: SystemSafetyProgramPlan}
                - {name: hmp, type: HazardManagementPlan}
                - {name: hmmp, type: HazMatManagementPlan, mult: "0..1"}
                - {name: ipt, type: SafetyIPT}
            - {name: SystemSafetyProgramPlan, stereotype: item, attributes: ["revision : String", "approvalRecord : String"]}
            - {name: HazardManagementPlan, stereotype: item, attributes: ["riskMatrixRef : String", "closureCriteria : String"]}
            - {name: HazMatManagementPlan, stereotype: item, attributes: ["inventoryRef : String"]}
            - {name: SafetyIPT, stereotype: part, attributes: ["charter : String"]}
    inputs:
      - {ref: SYSDEF, item: System baseline}
      - {doc: framework/standards-applicability.md, item: Standards and tailoring}
      - {doc: framework/lifecycle.md, item: Gates G0–G7}
    outputs:
      - {ref: E2, item: Selected analysis tasks and methods}
      - {ref: E3, item: Approved risk matrix reference}
      - {ref: E7, item: Acceptance authority matrix}
    contents:
      - {name: task-applicability.yaml, desc: Task selection and tailoring decisions (see Wiki applicability page)}

  - id: T101
    parent: E1
    path: 01-safety-approach/task-101-hazard-identification-and-mitigation-effort
    title: Task 101 · Hazard Identification and Mitigation Effort
    element: 1
    tasks: [{id: 101, name: Hazard Identification and Mitigation Effort}]
    gate: G0 onward
    applicability: Selected
    role: Safety lead
    purpose: |
      Establishes the integrated, iterative effort that runs the eight elements across SUS-M1,
      SUS-A1 and their interfaces, using the systems engineering process rather than a parallel one.
    scope: [SUS-I1]
    boundary:
      name: Integrated hazard effort
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [Systems engineering process, EXT-AUTH, Test program]
      flows:
        - [Systems engineering process, SUS-M1, requirements and design baselines]
        - [SUS-A1, Systems engineering process, ARP4761A safety assessment results]
        - [Test program, SUS-M1, verification evidence]
        - ["@boundary", EXT-AUTH, risk status]
    model:
      package: Task101_HazardEffort
      views:
        - kind: act
          name: HazardIdentificationAndMitigationEffort
          title: integrated effort loop
          steps:
            - {name: defineScope, label: Confirm configuration and boundary}
            - {name: identify, label: Identify hazards per selected tasks}
            - {name: assess, label: Assess initial risk, safety: true}
            - {name: mitigate, label: Allocate mitigations and requirements}
            - {name: verify, label: Verify mitigation effectiveness}
            - {name: report, label: Report status and request decisions}
          loops: [[report, identify, design or CONOPS change]]
    inputs:
      - {ref: SYSDEF, item: Configuration baseline}
      - {ref: T102, item: Approved SSPP}
    outputs:
      - {ref: E2, item: Analysis tasking}
      - {ref: T107, item: Effort status}
    contents:
      - {name: effort-record.yaml, desc: Task record using templates/task-record.yaml}

  - id: T102
    parent: E1
    path: 01-safety-approach/task-102-system-safety-program-plan
    title: Task 102 · System Safety Program Plan (SSPP)
    element: 1
    tasks: [{id: 102, name: System Safety Program Plan}]
    gate: G0, revised at G2 and G6
    applicability: Selected
    role: Safety lead; approval by program authority
    purpose: |
      The SSPP: scope, organisation, authority, selected tasks, methods, risk matrix, hazard tracking,
      software approach, verification and acceptance. Start from `templates/sspp-outline.md`.
    scope: [SUS-I1]
    boundary:
      name: SSPP scope
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [EXT-AUTH, Program management, PX4 upstream project]
      flows:
        - [Program management, "@boundary", resources and schedule]
        - ["@boundary", EXT-AUTH, acceptance requests per risk level]
        - [PX4 upstream project, SUS-A1, COTS / open-source software baseline]
    model:
      package: Task102_SSPP
      views:
        - kind: req
          title: plan-level requirements
          requirements:
            - {id: SSPP-001, name: DefineRiskAuthority, text: SSPP shall name the risk acceptance authority for each risk level, risk: High, verify: Inspection}
            - {id: SSPP-002, name: DefineTaskSelection, text: SSPP shall record selected and tailored tasks with rationale, risk: Medium, verify: Inspection}
            - {id: SSPP-003, name: SeparateRiskScales, text: SSPP shall keep 882E risk and ARP4761A failure-condition scales distinct, risk: Medium, verify: Inspection}
            - {id: SSPP-004, name: DefineSoftwareApproach, text: SSPP shall define the software contribution to system risk approach, risk: High, verify: Inspection}
          verified_by:
            - [SSPP-REVIEW, SSPP-001]
            - [SSPP-REVIEW, SSPP-002]
            - [SSPP-REVIEW, SSPP-003]
            - [SSPP-REVIEW, SSPP-004]
    inputs:
      - {doc: safety/mil-std-882e/templates/sspp-outline.md, item: SSPP outline}
      - {ref: E1, item: Task applicability}
    outputs:
      - {ref: T103, item: Plan baseline}
      - {ref: E3, item: Risk matrix definition}
      - {ref: SWS, item: Software safety approach}
    contents:
      - {name: sspp.md, desc: System Safety Program Plan (draft until approved)}

  - id: T103
    parent: E1
    path: 01-safety-approach/task-103-hazard-management-plan
    title: Task 103 · Hazard Management Plan (HMP)
    element: 1
    tasks: [{id: 103, name: Hazard Management Plan}]
    gate: G0–G1
    applicability: Selected
    role: Safety lead
    purpose: |
      Defines how hazards move through their lifecycle, closure criteria, who may change status,
      and how the hazard tracking system is operated.
    scope: [SUS-I1]
    boundary:
      name: Hazard management process
      inside: [Hazard lifecycle rules, Closure criteria, HTS operation]
      outside: [EXT-AUTH, Change control board, Verification program]
      flows:
        - [Verification program, Closure criteria, evidence of effectiveness]
        - [Closure criteria, EXT-AUTH, acceptance request]
        - [Change control board, Hazard lifecycle rules, reopen triggers]
    model:
      package: Task103_HMP
      views:
        - kind: stm
          name: HazardLifecycle
          title: hazard status lifecycle
          doc: Status transitions governed by the HMP; values match SusanooSafety::HazardStatus.
          initial: Open
          states:
            - {name: Open, doc: identified and recorded}
            - {name: Mitigated, doc: controls allocated and implemented}
            - {name: Verified, doc: effectiveness evidenced}
            - {name: PendingAcceptance, doc: residual risk awaiting decision}
            - {name: Accepted, doc: authorized decision recorded}
            - {name: Closed}
            - {name: Monitor, doc: tracked in service}
          transitions:
            - [Open, Mitigated, mitigation recorded]
            - [Mitigated, Verified, evidence accepted]
            - [Verified, Mitigated, verification failed]
            - [Verified, PendingAcceptance, acceptance requested]
            - [PendingAcceptance, Accepted, authority approves]
            - [PendingAcceptance, Mitigated, authority rejects]
            - [Accepted, Monitor, fielded]
            - [Monitor, Open, change or mishap]
            - [Accepted, Closed, hazard eliminated or retired]
          final: [Closed]
    inputs:
      - {ref: T102, item: SSPP}
      - {ref: E3, item: Risk matrix}
    outputs:
      - {ref: HTS, item: Hazard workflow rules}
      - {ref: E7, item: Closure criteria}
    contents:
      - {name: hmp.md, desc: Hazard Management Plan}

  - id: T104
    parent: E1
    path: 01-safety-approach/task-104-government-reviews-and-audits
    title: Task 104 · Government Reviews and Audits
    element: 1
    tasks: [{id: 104, name: Government Reviews and Audits}]
    gate: As scheduled
    applicability: Conditional — only if a government customer or authority is engaged
    role: Safety lead
    purpose: |
      Supports external safety reviews and audits. Currently conditional: no government contract or
      authority is assumed. Record the applicability decision and re-evaluation trigger here.
    scope: [SUS-I1]
    boundary:
      name: Audit interface
      inside: [Audit package, Action item log]
      outside: [EXT-AUTH, Government or customer reviewer]
      flows:
        - [Audit package, Government or customer reviewer, evidence and analyses]
        - [Government or customer reviewer, Action item log, findings]
        - [Action item log, EXT-AUTH, closure status]
    model:
      package: Task104_Reviews
      views:
        - kind: act
          name: ReviewAndAudit
          steps:
            - {name: confirmApplicability, label: Confirm task is applicable}
            - {name: preparePackage, label: Prepare configuration-specific evidence package}
            - {name: conductReview, label: Conduct review or audit}
            - {name: trackActions, label: Track findings to closure}
    inputs:
      - {ref: HTS, item: Hazard status}
      - {ref: T301, item: SAR}
    outputs:
      - {ref: T304, item: Audit findings}
    contents:
      - {name: applicability-decision.yaml, desc: Conditional applicability record}

  - id: T105
    parent: E1
    path: 01-safety-approach/task-105-integrated-product-team-support
    title: Task 105 · Integrated Product Team (IPT) Support
    element: 1
    tasks: [{id: 105, name: Integrated Product Team Support}]
    gate: G0 onward
    applicability: Selected
    role: Safety lead
    purpose: |
      Embeds safety in the walker, UAV, controls, human factors and test teams so hazards and controls
      are worked inside design decisions, not after them.
    scope: [SUS-I1]
    boundary:
      name: Safety IPT
      inside: [Safety lead, Systems lead, Software safety lead, Human factors lead, Test lead]
      outside: [Suppliers, EXT-AUTH]
      flows:
        - [Suppliers, Systems lead, supplier safety data]
        - [Safety lead, EXT-AUTH, escalations]
        - [Human factors lead, Safety lead, MIL-STD-1472 findings]
        - [Test lead, Safety lead, test hazards and results]
    model:
      package: Task105_IPT
      views:
        - kind: bdd
          title: IPT composition
          blocks:
            - name: SafetyIPT
              parts:
                - {name: safetyLead, type: Role}
                - {name: systemsLead, type: Role}
                - {name: softwareSafetyLead, type: Role}
                - {name: humanFactorsLead, type: Role}
                - {name: testLead, type: Role}
            - {name: Role, stereotype: part, attributes: ["name : String", "authority : String", "independent : Boolean"]}
    inputs:
      - {ref: T102, item: Organisation and authority}
    outputs:
      - {ref: E2, item: Analysis participation}
    contents:
      - {name: ipt-charter.md, desc: Charter, members and meeting record index}

  - id: T108
    parent: E1
    path: 01-safety-approach/task-108-hazardous-materials-management-plan
    title: Task 108 · Hazardous Materials Management Plan (HMMP)
    element: 1
    tasks: [{id: 108, name: Hazardous Materials Management Plan}]
    gate: G1–G3
    applicability: Selected
    role: Environmental / HSE lead
    purpose: |
      Inventories and manages hazardous materials: engine fuel, hydraulic fluid (if electrohydraulic
      actuation is chosen), lithium-ion cells in SUS-M1 and SUS-A1, coolants and lubricants.
    scope: [SUS-M1-PWR, SUS-M1-WLK, SUS-A1-PWR, SUS-GSE-CHG]
    boundary:
      name: Hazardous materials
      inside: [SUS-M1-PWR, SUS-A1-PWR, SUS-M1-WLK, SUS-GSE-CHG]
      outside: [EXT-CREW, EXT-ENV, EXT-SITE]
      flows:
        - [SUS-GSE-CHG, SUS-M1-PWR, fuel and charge transfer]
        - [SUS-M1-WLK, EXT-ENV, hydraulic leak or spill]
        - [SUS-A1-PWR, EXT-CREW, cell thermal event exposure]
        - [EXT-SITE, SUS-GSE-CHG, storage and disposal]
    model:
      package: Task108_HMMP
      views:
        - kind: bdd
          title: hazardous material inventory
          blocks:
            - name: HazMatInventory
              parts: [{name: entries, type: HazMatEntry, mult: "0..*"}]
            - name: HazMatEntry
              stereotype: item
              attributes: ["material : String", "location : String", "quantity : Real", "sdsRef : String", "disposal : String"]
            - {name: MaterialClass, stereotype: enum, values: [Fuel, HydraulicFluid, LithiumIonCell, Coolant, Lubricant]}
    inputs:
      - {ref: SYSDEF, item: Bill of materials (when available)}
    outputs:
      - {ref: T207, item: Exposure sources}
      - {ref: T210, item: Environmental releases}
    contents:
      - {name: hazmat-inventory.csv, desc: Material, location, quantity, SDS, disposal}

  # ======================================================== 02
  - id: E2
    parent: ROOT
    path: 02-hazard-identification
    title: 02 · Identify and Document Hazards
    element: 2
    gate: G0–G5
    applicability: Selected progressively
    role: Safety lead
    purpose: |
      All hazard analysis tasks (200-series). Analyses are iterative and feed each other; arrows in
      the SysML activity are information flow, not a mandatory waterfall. Every hazard found here is
      recorded in the hazard tracking system.
    scope: [SUS-I1]
    boundary:
      name: Hazard analysis scope
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [EXT-PILOT, EXT-CREW, EXT-BYST, EXT-AIR, EXT-ENV]
      flows:
        - [EXT-PILOT, SUS-M1, operator error and workload]
        - [SUS-M1, EXT-BYST, crush / impact / fall]
        - [SUS-A1, EXT-BYST, rotor strike / crash]
        - [EXT-AIR, SUS-A1, link loss / GNSS denial]
        - [EXT-CREW, SUS-GSE, maintenance exposure]
        - [SUS-M1, EXT-ENV, releases]
    model:
      package: HazardAnalyses
      views:
        - kind: act
          name: HazardAnalysisRelationships
          title: analysis information flow
          steps:
            - {name: phl, label: Task 201 PHL}
            - {name: pha, label: Task 202 PHA}
            - {name: fha, label: Task 208 FHA}
            - {name: srha, label: Task 203 SRHA}
            - {name: ssha, label: Task 204 SSHA}
            - {name: sha, label: Task 205 SHA}
            - {name: osha, label: Task 206 O&SHA}
          loops:
            - [sha, ssha, interface cause found]
            - [osha, pha, new operating scenario]
    inputs:
      - {ref: SYSDEF, item: System baseline}
      - {ref: E1, item: Selected tasks}
    outputs:
      - {ref: HTS, item: Hazard records}
      - {ref: E3, item: Hazards for risk assessment}
    contents: []

  - id: T201
    parent: E2
    path: 02-hazard-identification/task-201-preliminary-hazard-list
    title: Task 201 · Preliminary Hazard List (PHL)
    element: 2
    tasks: [{id: 201, name: Preliminary Hazard List}]
    gate: G0
    applicability: Selected
    role: Safety lead
    purpose: |
      First list of potential hazards for the concept: walker instability and fall, unintended motion,
      crush and entrapment, stored energy, fire, rotor strike, docking retention failure, link loss.
    scope: [SUS-I1]
    boundary:
      name: Concept-level system
      inside: [SUS-M1, SUS-A1, SUS-GSE]
      outside: [EXT-PILOT, EXT-BYST, EXT-TERRAIN, EXT-AIR]
      flows:
        - [EXT-PILOT, SUS-M1, "intent, workload"]
        - [SUS-M1, EXT-BYST, motion envelope]
        - [EXT-TERRAIN, SUS-M1, "slope, soft ground"]
        - [EXT-AIR, SUS-A1, "wind, RF, GNSS"]
        - [SUS-M1, SUS-A1, launch / recovery]
      excluded: [detailed component failure modes (Task 204)]
    model:
      package: Task201_PHL
      views:
        - kind: bdd
          title: PHL entry
          blocks:
            - name: PreliminaryHazardList
              attributes: ["configurationId : String", "revision : String"]
              parts: [{name: entries, type: PHLEntry, mult: "0..*"}]
            - name: PHLEntry
              stereotype: item
              attributes: ["hazardId : String", "hazardSource : String", "missionPhase : String", "potentialMishap : String"]
          specializations: []
    inputs:
      - {doc: concept/CONOPS.md, item: Missions and phases}
      - {ref: SYSDEF, item: Concept decomposition}
    outputs:
      - {ref: T202, item: PHL}
      - {ref: HTS, item: Initial hazard records}
    contents:
      - {name: phl.csv, desc: Preliminary hazard list}

  - id: T202
    parent: E2
    path: 02-hazard-identification/task-202-preliminary-hazard-analysis
    title: Task 202 · Preliminary Hazard Analysis (PHA)
    element: 2
    tasks: [{id: 202, name: Preliminary Hazard Analysis}]
    gate: G1–G2
    applicability: Selected
    role: Safety lead with systems lead
    purpose: |
      Develops PHL entries into scenarios with causes, effects, initial risk and candidate controls at
      subsystem level. Use `templates/pha-table.csv`.
    scope: [SUS-M1, SUS-A1, SUS-GSE]
    boundary:
      name: Preliminary architecture
      inside: [SUS-M1-WLK, SUS-M1-PWR, SUS-M1-CTL, SUS-M1-SAF, SUS-M1-DCK, SUS-A1]
      outside: [EXT-PILOT, EXT-BYST, EXT-TERRAIN]
      flows:
        - [EXT-PILOT, SUS-M1-CTL, commands]
        - [SUS-M1-SAF, SUS-M1-CTL, inhibit]
        - [SUS-M1-PWR, SUS-M1-WLK, power]
        - [SUS-M1-DCK, SUS-A1, retention / charge]
        - [SUS-M1-WLK, EXT-BYST, contact]
        - [EXT-TERRAIN, SUS-M1-WLK, ground reaction]
    model:
      package: Task202_PHA
      views:
        - kind: bdd
          title: PHA worksheet row
          blocks:
            - name: PHARow
              stereotype: item
              attributes: ["hazardId : String", "scenario : String", "cause : String", "effect : String", "initialRisk : RiskAssessment", "candidateControl : String"]
              parts: [{name: requirement, type: SafetyRequirement, mult: "0..*"}]
    inputs:
      - {ref: T201, item: PHL}
      - {ref: E3, item: Risk matrix}
      - {doc: concept/architecture.md, item: Preliminary architecture}
    outputs:
      - {ref: T203, item: Candidate safety requirements}
      - {ref: T204, item: Subsystem focus areas}
      - {ref: HTS, item: Updated hazard records}
    contents:
      - {name: pha.csv, desc: PHA worksheet based on templates/pha-table.csv}

  - id: T203
    parent: E2
    path: 02-hazard-identification/task-203-system-requirements-hazard-analysis
    title: Task 203 · System Requirements Hazard Analysis (SRHA)
    element: 2
    tasks: [{id: 203, name: System Requirements Hazard Analysis}]
    gate: G1–G2
    applicability: Selected
    role: Safety lead with systems lead
    purpose: |
      Converts hazards and controls into verifiable system safety requirements and checks that the
      requirements set, standards and design criteria cover identified hazards. Seeds with the
      candidate requirements SYS-001..006 from `concept/architecture.md`.
    scope: [SUS-M1-PIL, SUS-M1-SAF, SUS-M1-CTL, SUS-M1-DCK, SUS-A1-FCS]
    boundary:
      name: System requirements set
      inside: [System safety requirements, Design criteria]
      outside: [Hazard analyses, Applicable standards, Design baseline]
      flows:
        - [Hazard analyses, System safety requirements, controls to specify]
        - [Applicable standards, Design criteria, criteria and guidance]
        - [System safety requirements, Design baseline, allocation]
    model:
      package: Task203_SRHA
      views:
        - kind: req
          title: candidate system safety requirements
          requirements:
            - {id: SYS-001, name: PilotReadinessInterlock, text: Inhibit leg actuation until pilot station readiness conditions are satisfied, risk: High, verify: Test}
            - {id: SYS-002, name: ProtectiveStop, text: Provide an operator-requested protective stop with defined behavior per operating mode, risk: High, verify: Test}
            - {id: SYS-003, name: RetainedRotorInhibit, text: Prevent UAV rotor startup while mechanically retained except under approved maintenance, risk: High, verify: Test}
            - {id: SYS-004, name: FeedbackLossDegradedState, text: Detect loss of essential feedback and transition to a documented degraded state, risk: High, verify: Analysis}
            - {id: SYS-005, name: DockStateReporting, text: Docking interface shall report positively confirmed retained or unretained state, risk: Medium, verify: Test}
            - {id: SYS-006, name: LaunchRecoveryEnvelope, text: Inhibit UAV launch and recovery outside a verified operational envelope, risk: Medium, verify: Demonstration}
          satisfied_by:
            - [SUS-M1-PIL, SYS-001]
            - [SUS-M1-SAF, SYS-002]
            - [SUS-M1-DCK, SYS-003]
            - [SUS-M1-CTL, SYS-004]
            - [SUS-M1-DCK, SYS-005]
            - [SUS-A1-FCS, SYS-006]
    inputs:
      - {ref: T202, item: Hazards and candidate controls}
      - {doc: concept/architecture.md, item: Requirement candidates}
    outputs:
      - {ref: SREQ, item: Baselined safety requirements}
      - {ref: T401, item: Verification methods}
    contents:
      - {name: srha.md, desc: Requirements coverage analysis}

  - id: T204
    parent: E2
    path: 02-hazard-identification/task-204-subsystem-hazard-analysis
    title: Task 204 · Subsystem Hazard Analysis (SSHA)
    element: 2
    tasks: [{id: 204, name: Subsystem Hazard Analysis}]
    gate: G3
    applicability: Selected
    role: Safety lead with subsystem owners
    purpose: |
      Analyses each subsystem's design for failure modes, faults and hazardous conditions, including
      software and human errors within the subsystem. One subfolder or file per subsystem.
    scope: [SUS-M1-WLK, SUS-M1-MAN, SUS-M1-PWR, SUS-M1-CTL, SUS-M1-SAF, SUS-M1-DCK, SUS-A1]
    boundary:
      name: Each subsystem in isolation
      inside: [SUS-M1-WLK, SUS-M1-PWR, SUS-M1-CTL, SUS-M1-SAF, SUS-M1-DCK]
      outside: [Adjacent subsystems, SUS-A1, EXT-PILOT]
      flows:
        - [Adjacent subsystems, SUS-M1-PWR, interface failures as inputs]
        - [SUS-M1-DCK, SUS-A1, interface effects passed to SHA]
        - [EXT-PILOT, SUS-M1-CTL, erroneous command]
      excluded: [subsystem-to-subsystem interactions (Task 205)]
    model:
      package: Task204_SSHA
      views:
        - kind: bdd
          title: SSHA record per subsystem
          blocks:
            - name: SubsystemHazardAnalysis
              attributes: ["subsystemId : String", "designRevision : String"]
              parts: [{name: failureModes, type: FailureModeEntry, mult: "0..*"}]
            - name: FailureModeEntry
              stereotype: item
              attributes: ["failureMode : String", "localEffect : String", "systemEffect : String", "detection : String", "hazardId : String", "softwareContribution : Boolean"]
    inputs:
      - {ref: T202, item: PHA focus areas}
      - {ref: SYSDEF, item: Detailed subsystem design}
    outputs:
      - {ref: T205, item: Interface effects}
      - {ref: SWS, item: Software causal factors}
      - {ref: HTS, item: Subsystem hazards}
    contents:
      - {name: ssha-<subsystem-id>.csv, desc: One worksheet per subsystem (e.g. ssha-SUS-M1-PWR.csv)}

  - id: T205
    parent: E2
    path: 02-hazard-identification/task-205-system-hazard-analysis
    title: Task 205 · System Hazard Analysis (SHA)
    element: 2
    tasks: [{id: 205, name: System Hazard Analysis}]
    gate: G3–G5
    applicability: Selected
    role: Safety lead
    purpose: |
      Analyses interfaces and interactions between subsystems and with the pilot: common-cause,
      propagation, walker-UAV dock interactions, power and protective-stop interactions.
    scope: [SUS-I1]
    boundary:
      name: Subsystem interfaces
      inside: [SUS-M1-PWR, SUS-M1-CTL, SUS-M1-SAF, SUS-M1-DCK, SUS-A1-FCS, SUS-A1-PWR]
      outside: [EXT-PILOT, EXT-AIR, External systems]
      flows:
        - [SUS-M1-SAF, SUS-M1-CTL, torque inhibit]
        - [SUS-M1-SAF, SUS-M1-PWR, isolation]
        - [SUS-M1-DCK, SUS-A1-PWR, charging]
        - [SUS-M1-DCK, SUS-A1-FCS, rotor inhibit]
        - [EXT-PILOT, SUS-M1-CTL, commands]
        - [EXT-AIR, SUS-A1-FCS, navigation]
      excluded: [external system-of-systems interactions (Task 209)]
    model:
      package: Task205_SHA
      views:
        - kind: ibd
          name: SHAInterfaceContext
          title: analysed interfaces
          parts:
            - {name: pwr, type: PowerSystem}
            - {name: ctl, type: MotionControl}
            - {name: saf, type: SafetyMonitor, kind: safety}
            - {name: dck, type: UAVDock, kind: interface}
            - {name: uav, type: ObservationUAV}
          connections:
            - [saf, ctl, torque inhibit]
            - [saf, pwr, energy isolation]
            - [pwr, ctl, drive power]
            - [dck, uav, "retention, charge, rotor inhibit"]
            - [pwr, dck, dock supply]
    inputs:
      - {ref: T204, item: Subsystem interface effects}
      - {ref: SYSDEF, item: Interface register}
    outputs:
      - {ref: SREQ, item: Interface safety requirements}
      - {ref: HTS, item: System-level hazards}
    contents:
      - {name: sha.csv, desc: Interface hazard worksheet}

  - id: T206
    parent: E2
    path: 02-hazard-identification/task-206-operating-and-support-hazard-analysis
    title: Task 206 · Operating and Support Hazard Analysis (O&SHA)
    element: 2
    tasks: [{id: 206, name: Operating and Support Hazard Analysis}]
    gate: G3–G5
    applicability: Selected
    role: Safety lead with human factors lead
    purpose: |
      Analyses hazards in operation, maintenance, ingress/egress, transport, testing, UAV launch and
      recovery, and procedures. Human-occupied testing requires its own authorization.
    scope: [SUS-M1-PIL, SUS-M1-DCK, SUS-GSE]
    boundary:
      name: Operating and support tasks
      inside: [Operating modes, Maintenance procedures, SUS-GSE]
      outside: [EXT-PILOT, EXT-CREW, EXT-BYST]
      flows:
        - [EXT-PILOT, Operating modes, "mode selection, ingress / egress"]
        - [EXT-CREW, Maintenance procedures, lockout / support / service]
        - [Operating modes, EXT-BYST, exclusion zones]
        - [SUS-GSE, Maintenance procedures, "supports, chargers"]
    model:
      package: Task206_OSHA
      views:
        - kind: stm
          name: OperatingModes
          title: operating modes analysed
          initial: Shutdown
          states:
            - {name: Shutdown, doc: energy isolated}
            - {name: MaintenanceLocked, doc: supported and locked out}
            - {name: Standby, doc: pilot seated, actuation inhibited}
            - {name: Walk}
            - {name: Manipulate}
            - {name: UAVLaunchRecovery, doc: walker stationary}
            - {name: ProtectiveStop, doc: safe state, brakes applied}
          transitions:
            - [Shutdown, MaintenanceLocked, lockout applied]
            - [MaintenanceLocked, Shutdown, lockout removed]
            - [Shutdown, Standby, readiness confirmed]
            - [Standby, Walk, pilot enable]
            - [Walk, Standby, pilot hold]
            - [Standby, Manipulate, arm enable]
            - [Manipulate, Standby, arm disable]
            - [Standby, UAVLaunchRecovery, envelope valid]
            - [UAVLaunchRecovery, Standby, UAV docked or clear]
            - [Walk, ProtectiveStop, stop request or fault]
            - [Manipulate, ProtectiveStop, stop request or fault]
            - [UAVLaunchRecovery, ProtectiveStop, abort]
            - [ProtectiveStop, Standby, reset after review]
            - [Standby, Shutdown, power down]
    inputs:
      - {doc: concept/CONOPS.md, item: Operating scenarios}
      - {ref: T202, item: PHA}
    outputs:
      - {ref: SREQ, item: Procedural and design requirements}
      - {ref: T303, item: Test hazard controls}
      - {ref: HTS, item: Operating hazards}
    contents:
      - {name: osha.csv, desc: Task-step hazard worksheet}

  - id: T207
    parent: E2
    path: 02-hazard-identification/task-207-health-hazard-analysis
    title: Task 207 · Health Hazard Analysis (HHA)
    element: 2
    tasks: [{id: 207, name: Health Hazard Analysis}]
    gate: G2–G5
    applicability: Selected
    role: Safety lead with human factors lead
    purpose: |
      Analyses exposure of pilot, crew and bystanders to noise, whole-body vibration, exhaust, heat,
      chemicals, battery off-gas, ergonomic load and rotor noise.
    scope: [SUS-M1-PIL, SUS-M1-PWR, SUS-M1-WLK, SUS-A1-PRP, SUS-A1-PWR]
    boundary:
      name: Human exposure
      inside: [SUS-M1-PWR, SUS-M1-WLK, SUS-M1-PIL, SUS-A1-PRP]
      outside: [EXT-PILOT, EXT-CREW, EXT-BYST]
      flows:
        - [SUS-M1-PWR, EXT-PILOT, "noise, exhaust, heat"]
        - [SUS-M1-WLK, EXT-PILOT, whole-body vibration]
        - [SUS-M1-PIL, EXT-PILOT, posture and restraint loads]
        - [SUS-A1-PRP, EXT-CREW, rotor noise]
        - [SUS-M1-PWR, EXT-CREW, fluids and battery off-gas]
      excluded: [environmental receptors (Task 210)]
    model:
      package: Task207_HHA
      views:
        - kind: bdd
          title: exposure record
          blocks:
            - name: HealthExposure
              stereotype: item
              attributes: ["agent : HealthHazardAgent", "source : String", "exposedPopulation : String", "exposureLimitRef : String", "measured : Boolean"]
            - {name: HealthHazardAgent, stereotype: enum, values: [Acoustic, Vibration, Chemical, Thermal, Ergonomic, Biological, Radiation]}
    inputs:
      - {ref: T108, item: Hazardous materials}
      - {ref: T206, item: Exposure tasks}
    outputs:
      - {ref: SREQ, item: Exposure limits as requirements}
      - {ref: HTS, item: Health hazards}
    contents:
      - {name: hha.csv, desc: Exposure worksheet}

  - id: T208
    parent: E2
    path: 02-hazard-identification/task-208-functional-hazard-analysis
    title: Task 208 · Functional Hazard Analysis (FHA)
    element: 2
    tasks: [{id: 208, name: Functional Hazard Analysis}]
    gate: G1–G2
    applicability: Selected
    role: Safety lead with software safety lead
    purpose: |
      Analyses system functions for loss, erroneous, untimely and unintended operation, and identifies
      safety-significant functions and their software allocation. The SUS-A1 aircraft FHA under
      ARP4761A is a separate artifact with a separate classification scale.
    scope: [SUS-M1-CTL, SUS-M1-SAF, SUS-M1-PIL, SUS-M1-DCK, SUS-A1-FCS]
    boundary:
      name: System functions
      inside: [Locomotion and balance, Protective stop, Pilot command, Dock retention, UAV flight control]
      outside: [Physical implementation, ARP4761A aircraft FHA]
      flows:
        - [Pilot command, Locomotion and balance, intent]
        - [Protective stop, Locomotion and balance, inhibit]
        - [Dock retention, UAV flight control, rotor inhibit]
        - [Locomotion and balance, Physical implementation, allocation]
        - [UAV flight control, ARP4761A aircraft FHA, cross-reference only]
    model:
      package: Task208_FHA
      views:
        - kind: act
          name: WalkerFunctionalChain
          title: functional chain under analysis
          steps:
            - {name: senseIntent, label: Sense pilot intent}
            - {name: estimateState, label: Estimate walker state}
            - {name: planMotion, label: Plan motion and balance}
            - {name: actuateJoints, label: Actuate joints}
            - {name: monitorSafety, label: Monitor and enforce protective stop, safety: true}
          loops: [[monitorSafety, actuateJoints, inhibit on fault]]
        - kind: bdd
          title: functional failure condition
          blocks:
            - name: FunctionalFailure
              stereotype: item
              attributes: ["functionId : String", "failureType : FunctionalFailureType", "hazardId : String", "swci : SoftwareControlCategory"]
            - {name: FunctionalFailureType, stereotype: enum, values: [Loss, Erroneous, Untimely, Unintended, Degraded]}
    inputs:
      - {ref: SYSDEF, item: Function list}
      - {ref: T201, item: PHL}
    outputs:
      - {ref: SWS, item: Safety-significant functions}
      - {ref: T203, item: Functional safety requirements}
    contents:
      - {name: fha.csv, desc: Function x failure-type worksheet}

  - id: T209
    parent: E2
    path: 02-hazard-identification/task-209-system-of-systems-hazard-analysis
    title: Task 209 · System-of-Systems Hazard Analysis (SoSHA)
    element: 2
    tasks: [{id: 209, name: System-of-Systems Hazard Analysis}]
    gate: G2–G5
    applicability: Conditional — external systems not yet baselined
    role: Safety lead
    purpose: |
      Analyses hazards from SUS-I1 interacting with external systems: GNSS, RF spectrum, airspace
      users, site power and logistics, other vehicles and remote observers.
    scope: [SUS-I1]
    boundary:
      name: SUS-I1 as constituent system
      inside: [SUS-I1]
      outside: [EXT-AIR, EXT-SITE, Other site vehicles, Remote video consumers]
      flows:
        - [EXT-AIR, SUS-I1, "GNSS, RF spectrum, airspace"]
        - [EXT-SITE, SUS-I1, "power, fuel, transport"]
        - [SUS-I1, Other site vehicles, shared workspace]
        - [SUS-I1, Remote video consumers, observation feed]
    model:
      package: Task209_SoSHA
      views:
        - kind: ibd
          name: SoSContext
          title: system-of-systems context
          parts:
            - {name: sus, type: IntegratedSystem}
            - {name: gnss, type: GnssConstellation, local: true}
            - {name: airspace, type: AirspaceUsers, local: true}
            - {name: site, type: SiteInfrastructureSystem, local: true}
            - {name: vehicles, type: SiteVehicles, local: true}
          connections:
            - [gnss, sus, navigation signals]
            - [airspace, sus, deconfliction]
            - [site, sus, "power, fuel, comms"]
            - [vehicles, sus, shared workspace]
    inputs:
      - {ref: T205, item: System hazards}
      - {ref: E1, item: Applicability decision}
    outputs:
      - {ref: HTS, item: SoS hazards}
    contents:
      - {name: sosha.csv, desc: External interaction worksheet}

  - id: T210
    parent: E2
    path: 02-hazard-identification/task-210-environmental-hazard-analysis
    title: Task 210 · Environmental Hazard Analysis (EHA)
    element: 2
    tasks: [{id: 210, name: Environmental Hazard Analysis}]
    gate: G2–G5
    applicability: Selected
    role: Environmental / HSE lead
    purpose: |
      Analyses environmental impacts across the lifecycle: emissions, spills, noise, battery
      end-of-life, ground disturbance and disposal.
    scope: [SUS-M1-PWR, SUS-M1-WLK, SUS-A1-PWR, SUS-GSE-CHG]
    boundary:
      name: Environmental aspects
      inside: [SUS-M1-PWR, SUS-M1-WLK, SUS-A1-PWR, SUS-GSE-CHG]
      outside: [EXT-ENV, EXT-SITE]
      flows:
        - [SUS-M1-PWR, EXT-ENV, exhaust and noise]
        - [SUS-M1-WLK, EXT-ENV, "ground disturbance, fluid leaks"]
        - [SUS-A1-PWR, EXT-SITE, battery end-of-life]
        - [SUS-GSE-CHG, EXT-ENV, fuel spills]
    model:
      package: Task210_EHA
      views:
        - kind: bdd
          title: environmental aspect record
          blocks:
            - name: EnvironmentalAspect
              stereotype: item
              attributes: ["aspect : String", "lifecyclePhase : LifecyclePhase", "receptor : String", "regulatoryRef : String"]
            - {name: LifecyclePhase, stereotype: enum, values: [Manufacture, Test, Operation, Maintenance, Transport, Disposal]}
    inputs:
      - {ref: T108, item: Hazardous materials}
    outputs:
      - {ref: SREQ, item: Environmental requirements}
      - {ref: HTS, item: Environmental hazards}
    contents:
      - {name: eha.csv, desc: Aspect and impact worksheet}

  # ======================================================== 03
  - id: E3
    parent: ROOT
    path: 03-risk-assessment
    title: 03 · Assess and Document Risk
    element: 3
    gate: G1 onward
    applicability: Selected
    role: Safety lead
    purpose: |
      Holds the program risk assessment definitions: severity categories, probability levels, the
      risk assessment matrix and risk levels, plus quantitative probability bands for SUS-I1 once
      exposure is defined. Software contribution uses the separate criteria in `software-safety/`.
    scope: [SUS-I1]
    boundary:
      name: Risk assessment criteria
      inside: [Severity categories, Probability levels, Risk matrix]
      outside: [EXT-AUTH, ARP4761A classification, Hazard records]
      flows:
        - [Hazard records, Risk matrix, severity and probability]
        - [Risk matrix, EXT-AUTH, risk level drives authority]
        - [ARP4761A classification, Risk matrix, kept separate - no mapping]
    model:
      package: RiskAssessment
      views:
        - kind: bdd
          title: risk assessment types
          blocks:
            - {name: SeverityCategory, stereotype: enum, values: [Catastrophic, Critical, Marginal, Negligible]}
            - {name: ProbabilityLevel, stereotype: enum, values: [Frequent, Probable, Occasional, Remote, Improbable, Eliminated]}
            - {name: RiskLevel, stereotype: enum, values: [High, Serious, Medium, Low, Eliminated]}
            - name: RiskAssessmentRecord
              stereotype: attribute
              attributes: ["severity : SeverityCategory", "probability : ProbabilityLevel", "level : RiskLevel", "rationale : String"]
    inputs:
      - {ref: T102, item: Matrix approval}
      - {ref: E2, item: Hazards}
    outputs:
      - {ref: E4, item: Prioritised risks}
      - {ref: E7, item: Risk levels for authority}
      - {ref: HTS, item: Initial risk}
    contents:
      - {name: risk-matrix.yaml, desc: Machine-readable matrix used by PDaC checks}
    notes_md: |
      ## Candidate risk assessment matrix

      Reproduces the structure of MIL-STD-882E Table III for planning. **Confirm against the
      controlled standard and record SSPP approval before use.**

      | Probability \ Severity | Catastrophic (1) | Critical (2) | Marginal (3) | Negligible (4) |
      |---|---|---|---|---|
      | Frequent (A) | High | High | Serious | Medium |
      | Probable (B) | High | High | Serious | Medium |
      | Occasional (C) | High | Serious | Medium | Low |
      | Remote (D) | Serious | Medium | Medium | Low |
      | Improbable (E) | Medium | Medium | Medium | Low |
      | Eliminated (F) | Eliminated | Eliminated | Eliminated | Eliminated |

  # ======================================================== 04
  - id: E4
    parent: ROOT
    path: 04-mitigation-identification
    title: 04 · Identify and Document Risk Mitigation Measures
    element: 4
    gate: G2–G3
    applicability: Selected
    role: Safety lead with design owners
    purpose: |
      Records candidate mitigations for each hazard, ordered by the system safety design order of
      precedence, and the rationale when a lower-precedence measure is chosen.
    scope: [SUS-I1]
    boundary:
      name: Mitigation selection
      inside: [Mitigation records, Precedence rationale]
      outside: [Design owners, Hazard records, Safety requirements]
      flows:
        - [Hazard records, Mitigation records, hazard and risk]
        - [Design owners, Mitigation records, feasible design options]
        - [Mitigation records, Safety requirements, selected controls]
    model:
      package: MitigationIdentification
      views:
        - kind: act
          name: DesignOrderOfPrecedence
          title: design order of precedence
          steps:
            - {name: eliminate, label: Eliminate hazard through design selection}
            - {name: reduceByDesign, label: Reduce risk through design alteration}
            - {name: engineeredFeatures, label: Incorporate engineered safety features, safety: true}
            - {name: warningDevices, label: Incorporate detection and warning devices}
            - {name: procedures, label: "Signage, procedures, training and PPE"}
          loops: [[procedures, eliminate, residual risk too high]]
    inputs:
      - {ref: E3, item: Assessed risks}
      - {ref: HTS, item: Hazards}
    outputs:
      - {ref: E5, item: Selected mitigations}
      - {ref: HTS, item: Mitigation links}
    contents:
      - {name: mitigations.csv, desc: Mitigation register with precedence level}

  # ======================================================== 05
  - id: E5
    parent: ROOT
    path: 05-risk-reduction
    title: 05 · Reduce Risk
    element: 5
