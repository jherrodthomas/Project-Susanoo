  - id: T304
    parent: E8
    path: 08-lifecycle-risk-management/task-304-review-changes-deficiencies-mishaps-deviations
    title: Task 304 · Review of Changes, Deficiencies, Mishaps and Deviations
    element: 8
    tasks: [{id: 304, name: "Review of Changes, Deficiencies, Mishaps and Deviations"}]
    gate: G7 (and any change)
    applicability: Selected
    role: Safety lead with configuration manager
    purpose: |
      Safety review of engineering changes, deficiency reports, mishaps, near-misses and deviations;
