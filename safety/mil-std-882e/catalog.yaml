  - id: SREQ
    parent: E5
    path: 05-risk-reduction/safety-requirements
    title: Safety Requirements Register
    element: 5
    gate: G2–G4
    applicability: Selected
    role: Systems lead
    purpose: |
      Baselined safety requirements derived from SRHA, SHA, O&SHA, HHA and EHA, each allocated to a
      system element and assigned a verification method. Released requirements need a verification
      disposition (traceability rule 2).
    scope: [SUS-M1-SAF, SUS-M1-CTL, SUS-M1-PIL, SUS-M1-DCK, SUS-A1-FCS]
    boundary:
      name: Safety requirement allocation
      inside: [SUS-M1-SAF, SUS-M1-CTL, SUS-M1-PIL, SUS-M1-DCK, SUS-A1-FCS]
      outside: [Verification program, Hazard records]
      flows:
        - [Hazard records, SUS-M1-SAF, hazard_id link]
        - [SUS-M1-SAF, Verification program, verified_by]
        - [SUS-M1-DCK, Verification program, verified_by]
    model:
      package: SafetyRequirements
      views:
        - kind: req
          title: allocation and derivation
          requirements:
            - {id: SYS-002, name: ProtectiveStop, from: Task203_SRHA, text: Operator-requested protective stop with defined behavior per mode, risk: High, verify: Test}
            - {id: SR-002-1, name: StopIndependence, text: Protective stop path shall not depend on motion-control software, risk: High, verify: Analysis}
            - {id: SR-002-2, name: StopResponseTime, text: Protective stop reaction time shall meet the value set by hazard analysis (TBD), risk: High, verify: Test}
            - {id: SYS-003, name: RetainedRotorInhibit, from: Task203_SRHA, text: No rotor startup while UAV mechanically retained, risk: High, verify: Test}
            - {id: SR-003-1, name: LatchStateInterlock, text: Rotor arming shall require a positively confirmed unretained dock state, risk: High, verify: Test}
          derives:
            - [SYS-002, SR-002-1]
            - [SYS-002, SR-002-2]
            - [SYS-003, SR-003-1]
          satisfied_by:
            - [SUS-M1-SAF, SR-002-1]
            - [SUS-M1-SAF, SR-002-2]
            - [SUS-M1-DCK, SR-003-1]
    inputs:
      - {ref: T203, item: System safety requirements}
      - {ref: T205, item: Interface requirements}
      - {ref: T206, item: Procedural requirements}
    outputs:
      - {ref: T401, item: Requirements to verify}
      - {ref: HTS, item: requirement_ids}
    contents:
      - {name: safety-requirements.yaml, desc: Typed requirement records (PDaC Requirement objects)}

  # ======================================================== 06
  - id: E6
    parent: ROOT
    path: 06-verification
    title: 06 · Verify, Validate and Document Risk Reduction
    element: 6
    gate: G4–G5
    applicability: Selected
    role: Test lead with safety lead
    purpose: |
      Plans and records evidence that mitigations are implemented and effective: analysis,
      inspection, demonstration, simulation and test, including fault injection. Simulated evidence
      is labelled as simulated.
    scope: [SUS-I1, SUS-GSE-TST]
    boundary:
      name: Verification program
      inside: [SUS-GSE-TST, Test procedures, Evidence records]
      outside: [SUS-M1, SUS-A1, EXT-AUTH]
      flows:
        - [SUS-GSE-TST, SUS-M1, supported rig tests]
        - [SUS-GSE-TST, SUS-A1, HIL / SITL]
        - [Evidence records, EXT-AUTH, verification summary]
    model:
      package: SafetyVerification
      views:
        - kind: act
          name: VerifyRiskReduction
          steps:
            - {name: planVerification, label: Select method per requirement}
            - {name: confirmTestSafety, label: Confirm test hazards controlled, safety: true}
            - {name: execute, label: "Execute analysis, test or demonstration"}
            - {name: recordEvidence, label: Record evidence with provenance and hash}
            - {name: assessEffectiveness, label: Assess mitigation effectiveness}
          loops: [[assessEffectiveness, planVerification, failed or inconclusive]]
    inputs:
      - {ref: SREQ, item: Requirements}
      - {ref: E5, item: Implemented mitigations}
    outputs:
      - {ref: E7, item: Verified residual risk}
      - {ref: HTS, item: evidence_ids}
    contents: []

  - id: T303
    parent: E6
    path: 06-verification/task-303-test-and-evaluation-participation
    title: Task 303 · Test and Evaluation Participation
    element: 6
    tasks: [{id: 303, name: Test and Evaluation Participation}]
    gate: G4–G5
    applicability: Selected
    role: Safety lead with test lead
    purpose: |
      Safety participation in test planning and execution: test hazard analysis, safety releases for
      rig and human-in-the-loop tests, and use of test data to update hazards.
    scope: [SUS-GSE-TST, SUS-M1, SUS-A1]
    boundary:
      name: Test events
      inside: [SUS-GSE-TST, Test safety release]
      outside: [EXT-PILOT, EXT-CREW, Test range or site]
      flows:
        - [Test safety release, EXT-PILOT, authorization for occupied test]
        - [SUS-GSE-TST, EXT-CREW, exclusion zone]
        - [Test range or site, SUS-GSE-TST, site rules]
    model:
      package: Task303_TestParticipation
      views:
        - kind: stm
          name: TestSafetyRelease
          initial: Planned
          states:
            - {name: Planned}
            - {name: HazardsReviewed}
            - {name: Released, doc: authorized for stated configuration}
            - {name: Executed}
            - {name: Suspended, doc: stop-test condition}
          transitions:
            - [Planned, HazardsReviewed, test hazard analysis complete]
            - [HazardsReviewed, Released, independent review approves]
            - [Released, Executed, test complete]
            - [Released, Suspended, stop condition]
            - [Suspended, HazardsReviewed, anomaly dispositioned]
          final: [Executed]
    inputs:
      - {ref: T206, item: Operating hazards}
      - {ref: SREQ, item: Requirements under test}
    outputs:
      - {ref: T401, item: Test results}
      - {ref: T304, item: Test anomalies}
    contents:
      - {name: test-safety-releases/, desc: One release record per test event}

  - id: T401
    parent: E6
    path: 06-verification/task-401-safety-verification
    title: Task 401 · Safety Verification
    element: 6
    tasks: [{id: 401, name: Safety Verification}]
    gate: G4–G5
    applicability: Selected
    role: Test lead with safety lead
    purpose: |
