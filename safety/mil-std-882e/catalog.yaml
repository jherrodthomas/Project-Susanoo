  # ======================================================== 07
  - id: E7
    parent: ROOT
    path: 07-risk-acceptance
    title: 07 · Accept Risk and Document
    element: 7
    gate: G6
    applicability: Selected
    role: Risk acceptance authority (human only)
    purpose: |
      Holds safety assessment reports and formal residual-risk decisions. Automation may check that
      evidence and links are complete; only an authorized human may accept risk. Illustrative or
      simulated approvals are labelled as such.
    scope: [SUS-I1]
    boundary:
      name: Risk acceptance
      inside: [Acceptance records, SAR, HMAR]
      outside: [EXT-AUTH, PDaC release]
      flows:
        - [SAR, EXT-AUTH, residual risk summary]
        - [EXT-AUTH, Acceptance records, signed decision]
        - [Acceptance records, PDaC release, approvals list]
    model:
      package: RiskAcceptance
      views:
        - kind: stm
          name: RiskAcceptanceDecisionFlow
          initial: Requested
          states:
            - {name: Requested}
            - {name: UnderReview}
            - {name: Accepted, doc: authority and record named}
            - {name: Rejected}
            - {name: Expired, doc: configuration changed}
          transitions:
            - [Requested, UnderReview, package complete]
            - [UnderReview, Accepted, authority signs]
            - [UnderReview, Rejected, further mitigation required]
            - [Accepted, Expired, configuration or CONOPS change]
            - [Expired, Requested, reassessed]
    inputs:
      - {ref: E6, item: Verified residual risk}
      - {ref: E1, item: Authority matrix}
    outputs:
      - {ref: HTS, item: risk_acceptance status}
      - {ref: E8, item: Accepted risk baseline}
    contents: []

