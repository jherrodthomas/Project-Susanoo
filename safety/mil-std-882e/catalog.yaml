        - [SUS-GSE-TST, SUS-M1-SAF, fault injection]
        - [SUS-GSE-TST, SUS-M1-DCK, latch state tests]
        - [SUS-M1-SAF, Evidence store, results with hash]
    model:
      package: Task401_SafetyVerification
      views:
        - kind: req
          title: verification relationships
          requirements:
            - {id: SYS-001, name: PilotReadinessInterlock, from: Task203_SRHA, text: Inhibit leg actuation until pilot readiness satisfied, risk: High, verify: Test}
            - {id: SYS-002, name: ProtectiveStop, from: Task203_SRHA, text: Operator-requested protective stop per mode, risk: High, verify: Test}
            - {id: SYS-003, name: RetainedRotorInhibit, from: Task203_SRHA, text: No rotor startup while retained, risk: High, verify: Test}
          verified_by:
