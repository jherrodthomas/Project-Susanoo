    scope: [SUS-I1]
    boundary:
      name: Change and event review
      inside: [Impact assessments]
      outside: [Change control board, Field reports, HTS]
      flows:
        - [Change control board, Impact assessments, ECR / deviation]
        - [Field reports, Impact assessments, mishap or deficiency]
        - [Impact assessments, HTS, affected hazards reopened]
    model:
      package: Task304_ChangeReview
      views:
        - kind: act
          name: ChangeSafetyReview
          steps:
            - {name: intake, label: Log change or event}
            - {name: screen, label: Screen for safety impact}
            - {name: analyse, label: Analyse affected hazards and controls, safety: true}
            - {name: decide, label: Record disposition and actions}
          loops: [[decide, screen, new information]]
    inputs:
      - {ref: T303, item: Test anomalies}
      - {ref: T104, item: Audit findings}
    outputs:
      - {ref: HTS, item: Reopened hazards}
      - {ref: E2, item: Reanalysis requests}
    contents:
      - {name: reviews/, desc: One impact assessment per change or event}

  # ======================================================== cross-cutting
  - id: HTS
    parent: ROOT
    path: hazard-tracking-system
    title: Task 106 · Hazard Tracking System (Hazard Log)
    crosscut: hts
    tasks: [{id: 106, name: Hazard Tracking System}]
    gate: G0 onward
    applicability: Selected
    role: Safety lead
    purpose: |
      Closed-loop hazard log used by every element. One YAML record per hazard using
      `templates/hazard-record.yaml`; CI resolves every ID link (traceability rule 1).
    scope: [SUS-I1]
    boundary:
      name: Hazard log
      inside: [Hazard records]
      outside: [Analyses, Safety requirements, Evidence store, EXT-AUTH]
      flows:
        - [Analyses, Hazard records, new hazards]
        - [Hazard records, Safety requirements, requirement_ids]
        - [Evidence store, Hazard records, verification_evidence_ids]
        - [EXT-AUTH, Hazard records, risk_acceptance]
    model:
      package: HazardTrackingSystem
      views:
        - kind: bdd
          title: hazard record links
          blocks:
            - name: HazardLog
              attributes: ["configurationId : String"]
              parts: [{name: records, type: Hazard, mult: "0..*"}]
        - kind: stm
          name: HazardRecordStatus
          title: record status
          initial: Open
          states:
            - {name: Open}
            - {name: Mitigated}
            - {name: Verified}
            - {name: Accepted}
            - {name: Closed}
          transitions:
            - [Open, Mitigated, mitigation linked]
            - [Mitigated, Verified, evidence linked]
            - [Verified, Accepted, decision_record linked]
            - [Accepted, Closed, closure criteria met]
            - [Accepted, Open, change reopens]
          final: [Closed]
    inputs:
      - {ref: E2, item: Hazards}
      - {ref: SREQ, item: Requirement links}
      - {ref: T401, item: Evidence links}
      - {ref: ACC, item: Acceptance links}
    outputs:
      - {ref: T107, item: Status snapshot}
      - {ref: T301, item: Hazard log}
    contents:
      - {name: hazards/, desc: HAZ-<nnn>.yaml records}

  - id: SWS
    parent: ROOT
    path: software-safety
    title: Software Contribution to System Risk (Section 4.4)
    crosscut: sws
    gate: G1–G5
    applicability: Selected
    role: Software safety lead
    procedure: docs/wiki/MIL-STD-882E-Software-Safety.md
    purpose: |
      Software control category, software safety criticality and level-of-rigor assignments for
      walker motion control, protective stop, pilot HMI, dock interlocks and PX4. MIL-STD-882E
      criticality is kept distinct from any DO-178C assurance level.
    scope: [SUS-M1-CTL, SUS-M1-SAF, SUS-M1-PIL, SUS-M1-DCK, SUS-A1-FCS]
    boundary:
      name: Safety-significant software
      inside: [SUS-M1-CTL, SUS-M1-SAF, SUS-M1-DCK, SUS-A1-FCS]
      outside: [PX4 upstream project, Toolchain and dependencies, EXT-PILOT]
      flows:
        - [PX4 upstream project, SUS-A1-FCS, pinned version and parameters]
        - [Toolchain and dependencies, SUS-M1-CTL, build inputs]
        - [EXT-PILOT, SUS-M1-CTL, commands via HMI]
        - [SUS-M1-SAF, SUS-M1-CTL, independent inhibit]
    model:
      package: SoftwareSafety
      views:
        - kind: bdd
          title: software criticality assignment
          blocks:
            - name: SoftwareFunctionAssessment
              stereotype: item
              attributes: ["functionId : String", "controlCategory : SoftwareControlCategory", "severity : SeverityCategory", "levelOfRigor : String", "independentMitigation : Boolean"]
            - {name: SoftwareControlCategory, stereotype: enum, values: [Autonomous, SemiAutonomous, RedundantFaultTolerant, Influential, NoSafetyImpact]}
    inputs:
      - {ref: T208, item: Safety-significant functions}
      - {ref: T204, item: Software causal factors}
      - {doc: integrations/px4/README.md, item: PX4 integration plan}
    outputs:
      - {ref: SREQ, item: Software safety requirements}
      - {ref: T401, item: Level-of-rigor verification tasks}
    contents:
      - {name: swci-assessment.csv, desc: Function x control category x severity x LOR}

  - id: TPL
    parent: ROOT
    path: templates
    title: Work-Product Templates
    gate: All
    role: Safety lead
    purpose: |
      Record templates used across the tree. Templates mirror `SusanooSafety.sysml` so records,
      models and checks share one vocabulary.
    scope: []
    boundary:
      name: Templates
      inside: [hazard-record.yaml, task-record.yaml, pha-table.csv, sspp-outline.md]
      outside: [Work-product folders]
      flows:
        - [hazard-record.yaml, Work-product folders, hazard records]
        - [task-record.yaml, Work-product folders, task records]
        - [pha-table.csv, Work-product folders, PHA worksheets]
        - [sspp-outline.md, Work-product folders, SSPP]
    model:
      package: TemplateSchemas
      views:
        - kind: bdd
          title: template schemas
          blocks:
            - name: TaskRecord
              stereotype: item
              attributes: ["taskId : Integer", "artifactId : String", "revision : String", "configurationId : String", "decision : String"]
              parts: [{name: hazards, type: Hazard, mult: "0..*"}, {name: requirements, type: SafetyRequirement, mult: "0..*"}, {name: evidence, type: VerificationEvidence, mult: "0..*"}]
    inputs:
      - {ref: SYSDEF, item: SusanooSafety vocabulary}
    outputs:
      - {ref: HTS, item: Hazard record schema}
    contents:
      - {name: hazard-record.yaml, desc: Hazard record template}
      - {name: task-record.yaml, desc: Task record template}
      - {name: pha-table.csv, desc: PHA worksheet columns}
      - {name: sspp-outline.md, desc: SSPP outline}
