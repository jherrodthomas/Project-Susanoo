<text x="40" y="773.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: ARP4754B = SAE guidelines for development of civil aircraft and systems · ARP4761A = SAE guidelines for the safety</text>
<text x="40" y="788.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">assessment process on civil aircraft · DoD = US Department of Defense · FHA = functional hazard analysis (MIL-STD-882E Task 208;</text>
<text x="40" y="802.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">also ARP4761A aircraft FHA) · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May 2012, base edition) · PX4 = PX4</text>
<text x="40" y="817.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Autopilot, the open-source flight-control software candidate for SUS-A1 · SAE = SAE International, publisher of ARP4754B and</text>
<text x="40" y="831.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ARP4761A · SSHA = subsystem hazard analysis (MIL-STD-882E Task 204) · SUS-A1 = dockable observation UAV · UAV = uncrewed aerial</text>
<text x="40" y="846.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">vehicle (drone) · US = United States</text>
</g>
