examples:
- title: Protective stop supervisor on a certified safety PLC
  need:
  - ref: SSF-002 Protective stop supervisor
    what: 'SCC 1, SwCI 1: all five level-of-rigor activities on the software (882E Table V)'
  - ref: HAZ-SAF-001
    what: 'Protective stop does not reach a safe state: 1C → target 1E'
  - ref: SYS-002, SYS-010
    what: Defined stop behaviour per mode; stop path independent of the motion control software
  part: Safety PLC with an IEC 61508 SIL 3 certificate
  read_column: IEC 61508 · SIL 3
  reads:
  - PFH 10⁻⁸ to < 10⁻⁷ /h for the platform
  - HFT and safe failure fraction per Route 1H
  - Annex A/B techniques at SIL 3 for the vendor's firmware and tools
  - Assessed by an independent department
  - Certificate and safety manual with conditions of use
  covers: The PLC hardware, its firmware and its programming tool, used as the safety manual says.
  leaves_to_us:
  - 'Our stop logic is application software: the SwCI 1 level-of-rigor activities still apply to it (882E §4.4).'
  - The safety manual's conditions of use (proof-test interval, response time) become inputs to SYS-011 (stop reaction time).
  - The platform failure rate is one input to the probability of HAZ-SAF-001, not the hazard's probability.
  decided_by: Whether the certificate counts toward the level-of-rigor evidence is a lead decision.
- title: Readiness interlock built from a PL d safety relay
  need:
  - ref: HAZ-PIL-001
    what: 'Unintended leg motion during ingress or egress: 1C → target 1E'
  - ref: SYS-001
    what: Inhibit leg actuation until restraint, hatch, neutral controls and clear zone are confirmed
  - ref: SUS-RISKDEF-001
    what: Probability E means < 10⁻⁶ over the item life of 500 walker hours (decision DQ-003)
  part: Safety relay and interlock switches rated PL d, Category 3
  read_column: ISO 13849-1 · PL d
  reads:
  - PFH_D 10⁻⁷ to < 10⁻⁶ /h
  - 'Category 3: a single fault does not lose the safety function'
  - DC_avg medium or better
  - Validated by persons independent of the design
  - PL, category, PFH_D, MTTF_D, DC, mission time and conditions of use
  covers: The interlock channel's dangerous-failure rate and its fault tolerance.
  leaves_to_us:
  - 'Our own arithmetic, with our own definitions: PFH_D just under 10⁻⁶ /h over 500 h gives up to 5 × 10⁻⁴, which is probability
    D, not E, if the relay alone stood between a fault and the mishap. PL e (< 10⁻⁷ /h) gives up to 5 × 10⁻⁵: still D.'
  - 'So the 1E target rests on the other mitigations as well: mechanical supports (M1), the hardware enable chain (M3) and
    the ingress procedure (M4). The PHA should show that combination.'
  - This is not a PL-to-882E mapping; it is the part's own figure run through the project's own probability definitions.
  decided_by: The severity and probability basis is the lead's; the PHA (Task 202) records the analysis.
- title: UAV failsafe on an autopilot sold with DAL C evidence
  need:
  - ref: SSF-008 PX4 failsafe contingency
    what: SCC 1, SwCI 1
  - ref: HAZ-INT-001
    what: 'UAV launch or recovery outside the safe envelope: 2C → target 2E'
  - ref: SYS-013
    what: On link loss, hold then land in place; never return to the dock without a permit (DQ-008)
  part: Commercial autopilot with DO-178C DAL C accomplishment summary
  read_column: DO-178C · DAL C
  reads:
  - 62 objectives, 5 of them with independence
  - Statement coverage (no decision or MC/DC coverage)
  - 'No failure-rate target: process assurance only'
  - Accomplishment summary (PSAC/SAS)
  covers: How the vendor's software was developed and verified, for the failure classification the vendor assumed.
  leaves_to_us:
  - 'The vendor''s failure classification came from an aircraft safety assessment, not from HAZ-INT-001: check that the
    assumed function and effects match ours.'
  - 'Our failsafe configuration (link-loss action, keep-out, permit) is ours: SYS-013 needs our own verification on top.'
  - Whether DAL C evidence satisfies the SwCI 1 level-of-rigor activities is our judgement, activity by activity.
  decided_by: Accepting supplier evidence as level-of-rigor evidence is a lead decision.
- title: Battery isolation from an automotive BMS with ASIL C capability
  need:
  - ref: HAZ-PWR-002
    what: 'Battery thermal runaway near the pilot station: 1D → target 1E (power alternative B only)'
  - ref: SYS-014
    what: Isolate the traction battery on over-temperature, over-voltage or over-current, independently of the motion controller
  part: Battery management system developed as an ISO 26262 SEooC, ASIL C
  read_column: ISO 26262 · ASIL C
  reads:
  - SPFM ≥ 97 %, LFM ≥ 80 %
  - PMHF < 10⁻⁷ /h (recommended)
  - Part 6 methods at ASIL C; confirmation measures at I2
  - Safety manual with SEooC assumptions
  covers: The BMS's random hardware failure metrics and its development process, under the vendor's assumptions.
  leaves_to_us:
  - 'SEooC assumptions are about a road vehicle: check drive cycle, thermal environment, vibration and falls against walker
    use.'
  - 'SYS-014 asks for isolation independent of the motion controller: confirm the BMS contactor path is independent in our
    architecture.'
  - The ASIL was set for a car's hazards; HAZ-PWR-002's severity and exposure are ours.
  decided_by: Retaining power alternative B at all is open in trade study TS-001.
