parameters:
- id: what-sets-the-level
  title: What sets the level
  cells:
    882E:
    - span: 4
      text: Risk assessment code from severity (Table I) × probability (Table II), mapped to a risk level by Table III
      source: 882E §4.3.3, Tables I–III
    '26262':
    - span: 5
      text: Severity S0–S3 × exposure E0–E4 × controllability C0–C3 of the hazardous event
      source: 26262-3 §6.4.3, Table 4
    '61508':
    - span: 4
      text: Risk reduction needed to reach the tolerable risk; risk graph or hazardous-event matrix (informative methods)
      source: 61508-5 Annexes C–E
    '13849':
    - span: 5
      text: Required PL from severity S1–S2, frequency/exposure F1–F2, possibility of avoidance P1–P2 (risk graph)
      source: 13849-1 §4.3, Annex A
    '178':
    - span: 5
      text: Failure condition classification of the function (Catastrophic → No effect), from the system safety assessment
      source: DO-178C §2.3; ARP4754B / ARP4761A
- id: quantitative-failure-target
  title: Quantitative failure target
  cells:
    882E:
    - span: 4
      text: Probability levels A–F (qualitative, with project-defined quantitative bands); no hardware failure-rate target
      source: 882E Table II, Appendix A
    '26262':
    - span: 1
      text: No target
      source: 26262-5 §9
    - span: 1
      text: No target
      source: 26262-5 §9
    - span: 1
      text: PMHF < 10⁻⁷ /h (recommended)
      source: 26262-5 Table 6
    - span: 1
      text: PMHF < 10⁻⁷ /h (recommended)
      source: 26262-5 Table 6
    - span: 1
      text: PMHF < 10⁻⁸ /h (recommended)
      source: 26262-5 Table 6
    '61508':
    - span: 1
      text: PFH 10⁻⁶ to < 10⁻⁵ /h
      source: 61508-1 Table 3
    - span: 1
      text: PFH 10⁻⁷ to < 10⁻⁶ /h
      source: 61508-1 Table 3
    - span: 1
      text: PFH 10⁻⁸ to < 10⁻⁷ /h
      source: 61508-1 Table 3
    - span: 1
      text: PFH 10⁻⁹ to < 10⁻⁸ /h
      source: 61508-1 Table 3
    '13849':
    - span: 1
      text: PFH_D 10⁻⁵ to < 10⁻⁴ /h
      source: 13849-1 Table 2
    - span: 1
      text: 3×10⁻⁶ to < 10⁻⁵
    - span: 1
      text: 10⁻⁶ to < 3×10⁻⁶
    - span: 1
      text: 10⁻⁷ to < 10⁻⁶
    - span: 1
      text: 10⁻⁸ to < 10⁻⁷
    '178':
    - span: 5
      text: Not defined in DO-178C or DO-254 (process assurance only); probability targets live in the system safety assessment
      source: DO-178C §2.3
- id: architecture-and-fault-tolerance
  title: Architecture and fault tolerance
  cells:
    882E:
    - span: 4
      text: Not defined; design order of precedence (eliminate → engineer → warn → procedures)
      source: 882E §4.3.4
    '26262':
    - span: 1
      text: —
    - span: 1
      text: No hardware metric
    - span: 1
      text: SPFM ≥ 90 % · LFM ≥ 60 %
      source: 26262-5 Tables 4–5
    - span: 1
      text: SPFM ≥ 97 % · LFM ≥ 80 %
    - span: 1
      text: SPFM ≥ 99 % · LFM ≥ 90 %
    '61508':
    - span: 4
      text: Hardware fault tolerance and safe failure fraction per Route 1H (Tables 2–3), or Route 2H from field data
      source: 61508-2 §7.4.4
    '13849':
    - span: 5
      text: Designated architecture Category B, 1, 2, 3 or 4, combined with MTTF_D, DC_avg and CCF to reach the PL
      source: 13849-1 §6, Figure 12
    '178':
    - span: 5
      text: Not graded by DAL; architecture handled at system level (ARP4754B)
      source: ARP4754B §5
- id: diagnostic-coverage
