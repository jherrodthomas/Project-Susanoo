# Standards comparison (crosswalk): integrity levels side by side, each as its own standard defines it.
# Rendered by tools/crosswalk/build.py to standards/crosswalk.md. Columns are NOT aligned across standards.
# span: how many consecutive levels of that standard one cell covers (they must add up to the level count).
# phases / process: each standard's own steps in order (the swimlane figure); a shared phase is where a step
# happens in that standard's process, not a claim that steps or levels are equal.
schema: susanoo/standards-crosswalk/v0.1
id: SUS-XWALK-001
title: 'Standards comparison: integrity levels side by side'
status: draft
purpose: Show each standard's integrity levels as that standard defines them, side by side, so a part rated to another standard
  (ASIL, SIL, PL, DAL) can be read in its own terms and judged against Susanoo's own requirement. Columns are not aligned
  across standards and no level is equivalent to another.
verification:
  status: unverified
  note: Drafted at independence level I0 from the structure of each standard. Every cell must be checked against the controlled
    text of its standard and marked verified (with who and against which edition) before it is relied on.
phases:
- id: analyse-hazards
  title: Analyse hazards
- id: set-the-level
  title: Set the level
- id: specify-requirements
  title: Specify requirements
- id: hardware-measures
  title: Hardware measures
- id: software-and-development
  title: Software and development
- id: verify-and-review
  title: Verify and review
- id: evidence-produced
  title: Evidence produced
