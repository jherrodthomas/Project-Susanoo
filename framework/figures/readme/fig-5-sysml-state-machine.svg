<text x="40" y="1905.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: DoD = US Department of Defense · EMD = engineering and manufacturing development (acquisition phase) · G0–G7 =</text>
<text x="40" y="1920.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">lifecycle gate (G0 concept to G7 change and sustainment) · MIL-STD-882E = US DoD Standard Practice for System Safety (11 May</text>
<text x="40" y="1934.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">2012, base edition) · MSA = materiel solution analysis (acquisition phase) · OS = operations and support (acquisition phase)</text>
<text x="40" y="1949.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">· PD = production and deployment (acquisition phase) · SysML = Systems Modeling Language (SysML v2) · TD = technology</text>
<text x="40" y="1963.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">development (acquisition phase) · US = United States</text>
