procedure: 'Purpose: show that the dock stops charging on over-voltage, over-current and over-temperature independently
  of the charging software.

  Setup: dock charger on a bench with a battery emulator and a heated test fixture; charging software disabled or
  held faulted; limits are TBD (SYS-022).

  Steps: drive each quantity past its limit in turn with the software unable to stop charging.

  Pass: charging stops within the response time (TBD) for every case with the software faulted. Record trip values
  and times.'
