<g class="terms" data-base-h="525">
<rect x="0" y="525" width="989.6" height="69.1" fill="#FFFFFF"/>
<line x1="40" y1="529" x2="949.6" y2="529" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="544.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: CI = continuous integration (the automated checks GitHub runs on every change) · M1, M2 … = mitigation in a hazard record (M1, M2 …), or a SysML model check</text>
<text x="40" y="559.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">rule in tools/sysml · OMG = Object Management Group, publisher of SysML · R01 … = validator rule in tools/pdac (R13 = only a named human review accepts anything) ·</text>
<text x="40" y="573.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">SysML = Systems Modeling Language (SysML v2)</text>
