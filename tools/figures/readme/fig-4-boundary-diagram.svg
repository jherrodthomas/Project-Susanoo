<text x="40" y="703.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: CI = continuous integration (the automated checks GitHub runs on every change) · ELK = Eclipse Layout Kernel, the engine that lays out the generated figures · OMG = Object Management Group, publisher of SysML · R01 … =</text>
<text x="40" y="718.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">validator rule in tools/pdac (R13 = only a named human review accepts anything) · SVG = Scalable Vector Graphics, the figure file format · SysML = Systems Modeling Language (SysML v2) · YAML = a plain-text data format used</text>
<text x="40" y="732.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">for the records</text>
