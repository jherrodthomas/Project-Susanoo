# Box positions [x, y, width, height] for the generated item-definition figures (tools/figures/fig_item.py).
# Every element, external and the SUS-I1 boundary must have a box; an ID not in the record fails the build.
# Children must sit inside their parent; externals outside the boundary. A connector that crosses a box it does
# not belong to fails the build: add a route keyed "A|B" (the two endpoint IDs, sorted) with waypoints (via)
# through the gaps between boxes, and optionally a fixed label point.
