<text x="40" y="595.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: A01–A04 = item-definition validator rule (A01–A04) · CAD = computer-aided design · CONOPS = concept of operations · ID = identifier · M1, M2 … = mitigation in a hazard record</text>
<text x="40" y="610.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">(M1, M2 …), or a SysML model check rule in tools/sysml · MOD-nnn = operating mode from the CONOPS (MOD-01 to MOD-10) · SCN-nnn = CONOPS scenario (SCN-0nn nominal, SCN-1nn off-nominal)</text>
<text x="40" y="624.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">· SysML = Systems Modeling Language (SysML v2)</text>
