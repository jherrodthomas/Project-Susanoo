# Fault tree for HAZ-MAN-001 (tools/reliability). Drafted by an AI at independence I0.
# Hardware failure modes come from reliability/parts.yaml with assumed values. Software, human, environmental,
# interface and systematic causes are undeveloped events: shown and traced to their causal factor, never given a
# number. Software is handled by the level-of-rigour tasks of MIL-STD-882E section 4.4, not by a probability.
schema: susanoo/fault-tree/v0.1
hazard: HAZ-MAN-001
exposure: walker_operating_hours
trees:
  - id: FT-011
    title: Person struck or pinned by an arm
    top: struck
    gates:
      - {id: struck, type: and, title: Person struck or pinned, inputs: [person-in-reach, arm-moves]}
      - {id: arm-moves, type: or, title: An arm moves into the person, inputs: [stow-lock-fails, not-inhibited]}
    events:
      - {id: person-in-reach, kind: undeveloped, nature: human, causal_factor: CF1, title: Person inside the arms' reach}
      - {id: stow-lock-fails, mode: PT-015-FM1, count: 2, causal_factor: CF2, title: Stow lock already failed}
      - {id: not-inhibited, kind: undeveloped, nature: software, causal_factor: CF3, ssf: SSF-001, title: Manipulation not inhibited}
