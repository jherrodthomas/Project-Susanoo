# SPDX-License-Identifier: Apache-2.0
# The GitHub wiki is a generated mirror of docs/wiki/ on main. Pages are written and reviewed in the
# repository by pull request (checked by checks.yaml); on every push to main this workflow builds them
# with tools/wiki/build_wiki.py and pushes the result to <owner>/<repo>.wiki.git. Edits made directly
# in the wiki are overwritten.
#
# One-time setup: GitHub creates the wiki repository only after a first page is saved from the
# repository's Wiki tab. Until then this job fails at "Clone the wiki" and says so.
name: wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to the GitHub wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # the wiki repository is written with the repository token
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the pinned packages
      run: python3 -m pip install --quiet --user --break-system-packages -r tools/requirements.txt
    - name: Build the pages
      run: >
        python3 tools/wiki/build_wiki.py --out build/wiki
        --repo "${{ github.repository }}" --branch "${{ github.ref_name }}" --commit "${{ github.sha }}"
    - name: Clone the wiki
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" build/wiki-repo; then
          echo "::error::Could not clone ${GITHUB_REPOSITORY}.wiki.git. Create the wiki once from the repository's Wiki tab (any first page), then re-run this workflow."
          exit 1
        fi
    - name: Replace the wiki content and push when it changed
      run: |
        set -e
        find build/wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -R build/wiki/. build/wiki-repo/
        cd build/wiki-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "The wiki already matches docs/wiki at ${GITHUB_SHA::7}; nothing to push."
          exit 0
        fi
        git commit --quiet -m "Sync docs/wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
        git push --quiet
        echo "Pushed the wiki at ${GITHUB_SHA::7}."
