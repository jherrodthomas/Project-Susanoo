name: Publish engineering handbook to GitHub Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'docs/readme/**'
      - 'safety/mil-std-882e/**'
      - 'concept/figures/**'
      - 'integrations/px4/figures/**'
      - 'framework/figures/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: read

concurrency:
  group: publish-project-susanoo-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out handbook source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Check Wiki deploy credential
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_DEPLOY_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Configure repository secret WIKI_DEPLOY_TOKEN with wiki repository write permission."
            exit 1
          fi

      - name: Publish pages to the separate Wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "susanoo-wiki-publisher[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone "https://github.com/${REPO}.wiki.git" wiki-publish
          # Copy the pages, images and figures in wiki form (figure paths to assets/, page links without .md).
          # Pages maintained separately in the wiki are not deleted.
          python -m tools.wiki.build_wiki --publish wiki-publish
          cd wiki-publish
          git add -- '*.md' images/ assets/
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "Publish Susanoo handbook from ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD
