name: Documentation standard check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/figures/package-lock.json

      - name: Install dependencies
        run: |
          pip install pyyaml==6.0.2
          npm ci --prefix tools/figures

      - name: Check READMEs, regenerate every figure and SysML view, and diff
        run: python3 tools/check_readme_diagrams.py

      - name: Front-page README figures and numbers match the records
        run: python -m tools.readme.build_readme --check

      - name: Every folder has a visual preview (docs/previews.yaml)
        run: python -m tools.previews.build_previews --check

      - name: Preview tests
        run: python -m unittest discover -s tools/previews/tests -t .

      - name: Wiki copies of the repository pages are current (docs/wiki, assets.txt)
        run: python -m tools.wiki.build_wiki --check

      - name: Every page and figure explains its abbreviations and codes (docs/terms.yaml)
        run: python -m tools.terms.terms --check

      - name: Terms tests
        run: python -m unittest discover -s tools/terms/tests -t .

  doc-sysml:
    name: documentation SysML (OMG pilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pip install -r tools/sysml/pilot/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/susanoo-sysml-pilot
          key: sysml-pilot-0.62.0

      - name: Validate canonical models, concept, PX4 and every folder SysML view
        run: tools/validate_doc_sysml.sh
