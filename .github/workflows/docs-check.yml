name: Documentation standard check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/figures/package-lock.json

      - name: Install dependencies
        run: |
          pip install pyyaml==6.0.2
          npm ci --prefix tools/figures

      - name: Check READMEs, regenerate every figure and SysML view, and diff
        run: python3 tools/check_readme_diagrams.py
