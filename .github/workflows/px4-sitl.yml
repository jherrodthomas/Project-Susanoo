name: PX4 SITL failsafe scenarios

# Builds the pinned PX4 (v1.16.2) and re-runs the SUS-A1 failsafe scenarios (sim/uav/scenarios.yaml).
# Fails if a scenario's outcome class differs from the committed result in sim/results/uav/.
# Not run on every pull request: a PX4 build and six SITL runs take several minutes.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  sitl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build bc
      - name: Install Python packages
        run: pip install -r tools/pdac/requirements.txt -r sim/uav/requirements.txt -r sim/uav/requirements-px4-build.txt
      - name: Cache the PX4 checkout and build
        uses: actions/cache@v4
        with:
          path: ~/px4
          key: px4-v1.16.2-sitl-${{ hashFiles('sim/uav/fetch_px4.sh') }}
      - name: Fetch and build PX4 SITL
        run: sim/uav/fetch_px4.sh ~/px4
      - name: Re-run the scenarios and compare outcome classes
        run: python -m sim.uav.harness --px4 ~/px4 --compare
