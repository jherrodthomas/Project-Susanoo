<text x="40" y="859.6" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: M1, M2 … = mitigation in a hazard record (M1, M2 …), or a SysML model check rule in tools/sysml · OMG = Object Management Group,</text>
<text x="40" y="874.1" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">publisher of SysML · R01 … = validator rule in tools/pdac (R13 = only a named human review accepts anything) · SysML = Systems Modeling</text>
<text x="40" y="888.6" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Language (SysML v2) · V-nnn = SysML view (tools/sysml/views.py)</text>
