<text x="40" y="530.7" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Terms: M1, M2 … = mitigation in a hazard record (M1, M2 …), or a SysML model check rule in tools/sysml · OMG = Object Management Group, publisher of SysML · R01 … =</text>
<text x="40" y="545.2" font-size="10.5" fill="#475569" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">validator rule in tools/pdac (R13 = only a named human review accepts anything) · SysML = Systems Modeling Language (SysML v2) · V-nnn = SysML view (tools/sysml/views.py)</text>
</g>
